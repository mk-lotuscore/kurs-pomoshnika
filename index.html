<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Курс подготовки помощника по госуслугам и страхованию в Казахстане. Автострахование и штрафы за нарушения ПДД. Русский и казахский язык.">
<meta name="theme-color" content="#EDF2F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1416" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Помощник по госуслугам и страхованию РК — курс</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:#EDF2F2}
@media (prefers-color-scheme: dark){body{background:#0D1416}}
img,svg{max-width:100%;height:auto}
button{font:inherit;color:inherit}
</style>
</head>
<body>
<style>
/* ============ TOKENS ============ */
:root{
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;

  --bg:#EDF2F2; --surface:#FFFFFF; --surface2:#F5F9F9;
  --ink:#152528; --ink2:#455B5E; --ink3:#7B8F91;
  --line:#DAE5E5; --line2:#C6D6D6;
  --accent:#0B6E72; --accent-ink:#FFFFFF; --accent-soft:#DFEFEF; --accent-line:#9FCDCE;
  --gold:#8E6A18; --gold-soft:#F6EEDA; --gold-line:#DFCDA0;
  --danger:#9E3626; --danger-soft:#FAE9E5; --danger-line:#E5BDB4;
  --ok:#256B52; --ok-soft:#E2F1EA; --ok-line:#A9D2C1;
  --shadow: 0 1px 2px rgba(16,40,42,.05), 0 6px 18px rgba(16,40,42,.06);

  --fs-xs:.8125rem; --fs-sm:.9375rem; --fs-b:1.0625rem;
  --fs-lg:1.1875rem; --fs-xl:1.4375rem; --fs-2xl:1.75rem;
  --r:14px; --r-sm:10px;
  --tap:56px;
  --wrap:600px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1416; --surface:#151E20; --surface2:#1C2729;
    --ink:#E7EFEF; --ink2:#A8BCBD; --ink3:#7A8E90;
    --line:#283537; --line2:#354547;
    --accent:#5BC4C6; --accent-ink:#06282A; --accent-soft:#12312F; --accent-line:#2A5A5B;
    --gold:#D9AC50; --gold-soft:#2A2316; --gold-line:#4C3F22;
    --danger:#E28675; --danger-soft:#301A18; --danger-line:#59332C;
    --ok:#5FBE95; --ok-soft:#152C24; --ok-line:#2C513F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1416; --surface:#151E20; --surface2:#1C2729;
  --ink:#E7EFEF; --ink2:#A8BCBD; --ink3:#7A8E90;
  --line:#283537; --line2:#354547;
  --accent:#5BC4C6; --accent-ink:#06282A; --accent-soft:#12312F; --accent-line:#2A5A5B;
  --gold:#D9AC50; --gold-soft:#2A2316; --gold-line:#4C3F22;
  --danger:#E28675; --danger-soft:#301A18; --danger-line:#59332C;
  --ok:#5FBE95; --ok-soft:#152C24; --ok-line:#2C513F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:#EDF2F2; --surface:#FFFFFF; --surface2:#F5F9F9;
  --ink:#152528; --ink2:#455B5E; --ink3:#7B8F91;
  --line:#DAE5E5; --line2:#C6D6D6;
  --accent:#0B6E72; --accent-ink:#FFFFFF; --accent-soft:#DFEFEF; --accent-line:#9FCDCE;
  --gold:#8E6A18; --gold-soft:#F6EEDA; --gold-line:#DFCDA0;
  --danger:#9E3626; --danger-soft:#FAE9E5; --danger-line:#E5BDB4;
  --ok:#256B52; --ok-soft:#E2F1EA; --ok-line:#A9D2C1;
  --shadow: 0 1px 2px rgba(16,40,42,.05), 0 6px 18px rgba(16,40,42,.06);
}

*{ box-sizing:border-box; }
body{ margin:0; }
#app{
  font-family:var(--sans);
  background:var(--bg); color:var(--ink);
  font-size:var(--fs-b); line-height:1.62;
  -webkit-text-size-adjust:100%;
  min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}
#app *{ font-family:inherit; }

/* ============ ORNAMENT ============ */
.ornament{
  height:14px; width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='14' viewBox='0 0 56 14'><g fill='none' stroke='%234A9295' stroke-width='1.3' stroke-linecap='round'><path d='M2 12 C2 4 10 2 13 6 C15 9 11 11 10 8'/><path d='M54 12 C54 4 46 2 43 6 C41 9 45 11 46 8'/><path d='M20 12 L28 5 L36 12'/></g></svg>");
  background-repeat:repeat-x; background-position:center;
  opacity:.45;
}

/* ============ LAYOUT ============ */
.wrap{ max-width:var(--wrap); margin:0 auto; padding:0 16px; }

#topbar{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:var(--wrap); margin:0 auto; padding:8px 12px;
  display:flex; align-items:center; gap:10px; min-height:56px;
}
.top-title{
  flex:1 1 auto; min-width:0;
  font-size:var(--fs-sm); font-weight:650; letter-spacing:-.01em;
  color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.iconbtn{
  flex:0 0 auto; width:44px; height:44px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:1.25rem; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.iconbtn:active{ background:var(--surface2); }

.langsw{
  flex:0 0 auto; display:inline-flex; padding:3px; gap:2px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
}
.langsw button{
  border:0; background:transparent; color:var(--ink3);
  font-size:var(--fs-xs); font-weight:700; letter-spacing:.04em;
  padding:8px 11px; border-radius:9px; cursor:pointer; min-height:38px;
}
.langsw button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }

main{ padding:18px 0 24px; }
.pad-bottom{ padding-bottom:96px; }

#actionbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
#actionbar:empty{ display:none; }
.actionbar-in{ max-width:var(--wrap); margin:0 auto; display:flex; gap:10px; }

/* ============ TYPE ============ */
h1,h2,h3{ margin:0; text-wrap:balance; letter-spacing:-.02em; line-height:1.22; }
h1{ font-size:var(--fs-2xl); font-weight:760; }
h2{ font-size:var(--fs-xl); font-weight:720; }
h3{ font-size:var(--fs-lg); font-weight:700; }
p{ margin:0; }
.eyebrow{
  font-family:var(--mono); font-size:var(--fs-xs); font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink3);
}
.lede{ color:var(--ink2); font-size:var(--fs-b); }
.muted{ color:var(--ink3); font-size:var(--fs-sm); }
.stack{ display:flex; flex-direction:column; gap:14px; }
.stack-s{ display:flex; flex-direction:column; gap:8px; }
.stack-l{ display:flex; flex-direction:column; gap:22px; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:14px 20px; width:100%;
  border-radius:var(--r); border:1px solid transparent;
  font-size:var(--fs-b); font-weight:680; letter-spacing:-.01em;
  cursor:pointer; text-align:center;
  transition:transform .12s ease, background .12s ease;
}
.btn:active{ transform:scale(.985); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--line2); }
.btn-quiet{ background:transparent; color:var(--ink2); border-color:var(--line); }
.btn-danger{ background:var(--danger-soft); color:var(--danger); border-color:var(--danger-line); }
.btn-sm{ min-height:44px; padding:10px 14px; font-size:var(--fs-sm); width:auto; }
.btn[disabled]{ opacity:.5; cursor:default; }

:where(a,button,[tabindex]):focus-visible{
  outline:3px solid var(--accent); outline-offset:2px; border-radius:8px;
}

/* ============ CARDS ============ */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:16px; box-shadow:var(--shadow);
}
.card-flat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }

.hero{
  background:var(--surface); border:1px solid var(--line);
  border-radius:20px; overflow:hidden; box-shadow:var(--shadow);
}
.hero-body{ padding:20px 18px 18px; display:flex; flex-direction:column; gap:14px; }

/* ============ PROGRESS ============ */
.bar{ height:10px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s cubic-bezier(.2,.7,.3,1); }
.bar.gold > i{ background:var(--gold); }
.bar-lg{ height:14px; }
.pct{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:var(--fs-2xl); letter-spacing:-.03em; }
.rowbetween{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }

.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat{ background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 8px; text-align:center; }
.stat b{ display:block; font-family:var(--mono); font-size:1.15rem; font-variant-numeric:tabular-nums; }
.stat span{ font-size:var(--fs-xs); color:var(--ink3); }

/* ============ MODULE CARD ============ */
.mod{
  width:100%; text-align:left; color:var(--ink); font-size:var(--fs-b);
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; cursor:pointer; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:12px;
}
.mod:active{ background:var(--surface2); }
.mod[data-locked="1"]{ opacity:.72; box-shadow:none; cursor:default; }
.mod-head{ display:flex; gap:12px; align-items:flex-start; }
.mod-num{
  flex:0 0 auto; width:38px; height:38px; border-radius:11px;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:var(--fs-sm);
}
.mod[data-locked="1"] .mod-num{ background:var(--surface2); color:var(--ink3); border-color:var(--line); }
.mod-t{ font-size:var(--fs-lg); font-weight:700; letter-spacing:-.02em; line-height:1.25; }
.mod-s{ font-size:var(--fs-sm); color:var(--ink2); margin-top:3px; }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:var(--fs-xs); font-weight:650; padding:5px 10px; border-radius:99px;
  border:1px solid var(--line); background:var(--surface2); color:var(--ink2);
}
.chip-ok{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
.chip-gold{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold-line); }
.chip-acc{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }

/* ============ LESSON LIST ============ */
.lrow{
  display:flex; gap:12px; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; min-height:var(--tap); cursor:pointer;
}
.lrow:active{ background:var(--surface2); }
.lrow-n{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  border:1.5px solid var(--line2); color:var(--ink3);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:var(--fs-sm); font-weight:700;
}
.lrow[data-done="1"] .lrow-n{ background:var(--ok); border-color:var(--ok); color:#fff; }
.lrow[data-read="1"] .lrow-n{ border-color:var(--accent); color:var(--accent); }
.lrow-t{ flex:1 1 auto; min-width:0; font-weight:640; font-size:var(--fs-sm); line-height:1.35; }
.lrow-m{ font-size:var(--fs-xs); color:var(--ink3); font-weight:500; margin-top:2px; display:block; }
.lrow-a{ flex:0 0 auto; color:var(--ink3); font-size:1.1rem; }

/* ============ TABS ============ */
.tabs{
  display:flex; gap:6px; overflow-x:auto; padding:4px;
  background:var(--surface2); border:1px solid var(--line); border-radius:12px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{
  flex:0 0 auto; border:0; background:transparent; color:var(--ink2);
  font-size:var(--fs-sm); font-weight:650; padding:10px 14px; border-radius:9px;
  cursor:pointer; min-height:44px; white-space:nowrap;
}
.tabs button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

/* ============ CONTENT BLOCKS ============ */
.prose{ display:flex; flex-direction:column; gap:16px; }
.prose h3{ margin-top:8px; }
.prose p{ line-height:1.68; }
.prose strong{ font-weight:700; }
.prose ul, .prose ol{ margin:0; padding-left:1.15em; display:flex; flex-direction:column; gap:9px; }
.prose li{ line-height:1.6; }
.prose ol{ counter-reset:none; }

.callout{ border-radius:var(--r); padding:14px 15px; border:1px solid; display:flex; flex-direction:column; gap:7px; }
.callout .lbl{ font-family:var(--mono); font-size:var(--fs-xs); font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
.c-example{ background:var(--surface); border-color:var(--accent-line); }
.c-example .lbl{ color:var(--accent); }
.c-note{ background:var(--accent-soft); border-color:var(--accent-line); }
.c-note .lbl{ color:var(--accent); }
.c-warn{ background:var(--danger-soft); border-color:var(--danger-line); }
.c-warn .lbl{ color:var(--danger); }
.c-check{ background:var(--gold-soft); border-color:var(--gold-line); }
.c-check .lbl{ color:var(--gold); }

.term{
  background:var(--surface2); border:1px solid var(--line); border-left:4px solid var(--gold);
  border-radius:var(--r-sm); padding:12px 14px;
}
.term b{ font-weight:750; }
.term .ab{ font-family:var(--mono); font-weight:700; color:var(--gold); letter-spacing:.02em; }

.formula{
  font-family:var(--mono); font-size:var(--fs-sm); line-height:1.7;
  background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:14px; white-space:pre-wrap; overflow-x:auto; color:var(--ink);
}

.tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); }
table{ border-collapse:collapse; width:100%; font-size:var(--fs-sm); min-width:340px; }
th,td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
th{ background:var(--surface2); font-weight:700; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.05em; color:var(--ink2); }
tr:last-child td{ border-bottom:0; }
td.n{ font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }

.steps{ display:flex; flex-direction:column; gap:12px; counter-reset:s; }
.step{ display:flex; gap:12px; align-items:flex-start; }
.step-n{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink);
  font-family:var(--mono); font-size:var(--fs-xs); font-weight:700;
  display:flex; align-items:center; justify-content:center; margin-top:2px;
}
.step-b{ flex:1 1 auto; }

/* ============ SCRIPTS / MISTAKES ============ */
.qa{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.qa-q{
  list-style:none; width:100%; text-align:left; background:transparent; border:0; cursor:pointer;
  padding:14px 15px; min-height:var(--tap); font-size:var(--fs-sm); font-weight:680; color:var(--ink);
  display:flex; gap:10px; align-items:center; justify-content:space-between;
}
.qa-q::-webkit-details-marker{ display:none; }
.qa-q .tw{ transition:transform .2s ease; color:var(--ink3); }
.qa[open] .qa-q .tw{ transform:rotate(180deg); }
.qa-a{ padding:0 15px 15px; font-size:var(--fs-sm); color:var(--ink2); line-height:1.65; display:none; }
.qa[open] .qa-a{ display:block; }
.qa-a .say{
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r-sm);
  padding:12px; color:var(--ink); margin-top:8px;
}

.mistake{
  display:flex; gap:11px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:14px;
}
.mistake .x{ flex:0 0 auto; color:var(--danger); font-weight:800; font-family:var(--mono); }
.mistake .b b{ display:block; margin-bottom:4px; font-weight:700; }
.mistake .b span{ font-size:var(--fs-sm); color:var(--ink2); }

/* ============ QUIZ ============ */
.qprog{ display:flex; gap:5px; }
.qprog i{ flex:1 1 0; height:5px; border-radius:99px; background:var(--line); }
.qprog i.on{ background:var(--accent); }
.qprog i.bad{ background:var(--danger); }
.qprog i.good{ background:var(--ok); }

.opt{
  width:100%; text-align:left; display:flex; gap:12px; align-items:flex-start;
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r);
  padding:15px; min-height:var(--tap); cursor:pointer;
  font-size:var(--fs-sm); line-height:1.5; color:var(--ink);
}
.opt:active{ background:var(--surface2); }
.opt .mk{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%;
  border:1.5px solid var(--line2); color:var(--ink3);
  font-family:var(--mono); font-size:var(--fs-xs); font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.opt[data-state="correct"]{ border-color:var(--ok); background:var(--ok-soft); }
.opt[data-state="correct"] .mk{ background:var(--ok); border-color:var(--ok); color:#fff; }
.opt[data-state="wrong"]{ border-color:var(--danger); background:var(--danger-soft); }
.opt[data-state="wrong"] .mk{ background:var(--danger); border-color:var(--danger); color:#fff; }
.opt[disabled]{ cursor:default; opacity:1; }
.opt[disabled][data-state=""]{ opacity:.55; }

.score{ text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; }
.score .big{ font-family:var(--mono); font-size:3rem; font-weight:750; letter-spacing:-.04em; line-height:1; }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
.fade{ animation:fade .28s ease both; }
@keyframes fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
</style>

<div id="app">
  <header id="topbar">
    <div class="topbar-in">
      <button class="iconbtn" id="backBtn" aria-label="Назад" style="display:none">←</button>
      <div class="top-title" id="topTitle"></div>
      <div class="langsw" role="group" aria-label="Тіл / Язык">
        <button data-lang="ru" aria-pressed="true">РУС</button>
        <button data-lang="kk" aria-pressed="false">ҚАЗ</button>
      </div>
    </div>
    <div class="ornament" aria-hidden="true"></div>
  </header>
  <main id="view" class="wrap"></main>
  <div id="actionbar"></div>
</div>

<script>
(function(){
'use strict';

/* ==================================================================
   1. ХРАНИЛИЩЕ ПРОГРЕССА
   window.storage → localStorage → память
   ================================================================== */
var Store = (function(){
  var KEY = 'kz_helper_course_v1';
  var mem = null;
  var ws = (typeof window !== 'undefined' && window.storage) ? window.storage : null;

  function tryCall(obj, names, args){
    for (var i=0;i<names.length;i++){
      if (obj && typeof obj[names[i]] === 'function'){
        return { ok:true, val: obj[names[i]].apply(obj, args) };
      }
    }
    return { ok:false };
  }
  return {
    read: function(){
      return Promise.resolve().then(function(){
        if (ws){
          var r = tryCall(ws, ['getItem','get'], [KEY]);
          if (r.ok) return r.val;
        }
        try { return localStorage.getItem(KEY); } catch(e){}
        return mem;
      }).then(function(raw){
        if (raw == null) return null;
        if (typeof raw === 'object') return raw;
        try { return JSON.parse(raw); } catch(e){ return null; }
      }).catch(function(){ return null; });
    },

      ru:'КАСКО никто не обязан покупать. Инспектор на дороге его не спросит. Но именно КАСКО отвечает на вопрос, который волнует владельца сильнее всего: а мою машину кто починит? Набор рисков в КАСКО зависит от программы, которую человек выбрал: угон, ущерб в аварии по своей вине, град, упавшая ветка или сосулька, поджог, действия третьих лиц.',
      kk:'КАСКО сатып алуға ешкім міндетті емес. Жолдағы инспектор оны сұрамайды. Бірақ дәл КАСКО көлік иесін ең қатты алаңдататын сұраққа жауап береді: менің көлігімді кім жөндейді? КАСКО-дағы тәуекелдер жиынтығы адам таңдаған бағдарламаға байланысты: ұрлау, өз кінәсінен болған апаттағы зиян, бұршақ, құлаған бұтақ немесе мұз сіркесі, өртеу, үшінші тұлғалардың әрекеттері.' },
    { t:'example',
      ru:'Марат оставил машину под тополем, ночью был ураган, ветка проломила крышу. Виноватого нет — это стихия. ОГПО тут вообще не работает: никто никому ущерб не причинял. А по КАСКО, если в программе есть риск повреждения падающими предметами, Марату оплатят ремонт крыши.',
      kk:'Марат көлігін теректің астына қалдырды, түнде дауыл болып, бұтақ шатырды тесіп өтті. Кінәлі жоқ — бұл табиғат апаты. Мұнда ОГПО мүлдем жұмыс істемейді: ешкім ешкімге зиян келтірген жоқ. Ал КАСКО бойынша, егер бағдарламада құлаған заттардан зақымдану тәуекелі болса, Мараттың шатырын жөндеуге төлейді.' },
    { t:'p',
      ru:'Цена КАСКО не установлена государством. Каждая страховая компания считает её сама, отталкиваясь от стоимости автомобиля, его возраста, того, где он ночует, и от истории водителя. Почти всегда в КАСКО есть франшиза — та часть ущерба, которую владелец платит сам. Чем больше франшиза, тем дешевле полис.',
      kk:'КАСКО бағасын мемлекет белгілемейді. Әр сақтандыру компаниясы оны көліктің құнына, жасына, түнде қайда тұратынына және жүргізушінің тарихына сүйене отырып өзі есептейді. КАСКО-да әрдайым дерлік франшиза болады — зиянның иесі өзі төлейтін бөлігі. Франшиза неғұрлым үлкен болса, полис соғұрлым арзан.' },
    { t:'note',
      ru:'Франшиза — это не обман и не хитрость страховой. Это способ сделать полис дешевле. Клиенту объясняйте так: «Мелкие царапины вы чините сами, а страховая берёт на себя серьёзные случаи. За это полис стоит меньше».',
      kk:'Франшиза — алдау да, сақтандырушының айласы да емес. Бұл — полисті арзандату тәсілі. Клиентке былай түсіндіріңіз: «Ұсақ сызаттарды өзіңіз жөндейсіз, ал сақтандырушы ауыр жағдайларды өз мойнына алады. Сол үшін полис арзанырақ тұрады».' },

    { t:'h', ru:'Где живёт полис: ЕСБД', kk:'Полис қайда сақталады: ЕСБД' },
    { t:'term', abbr:'ЕСБД',
      ru:'единая страховая база данных. Это общая государственная база, куда страховые компании обязаны записывать каждый оформленный полис. Именно поэтому бумажка перестала быть главной: полис существует в базе, даже если у человека нет ни одного распечатанного листа.',
      kk:'бірыңғай сақтандыру дерекқоры. Бұл — сақтандыру компаниялары рәсімделген әр полисті жазуға міндетті ортақ мемлекеттік база. Сондықтан да қағаз басты нәрсе болудан қалды: адамда бірде-бір басып шығарылған парақ болмаса да, полис базада бар болып саналады.' },
    { t:'p',
      ru:'Из ЕСБД полис видят все: дорожная полиция, камеры, другая страховая при аварии. Отсюда два практических вывода для вашей работы. Первый: после оформления обязательно проверьте, что полис реально появился в базе. Второй: клиенту не нужно возить с собой распечатку, но ему стоит сохранить электронный полис в телефоне — так спокойнее.',
      kk:'ЕСБД-дан полисті бәрі көреді: жол полициясы, камералар, апат кезінде екінші сақтандыру компаниясы. Бұдан жұмысыңызға екі практикалық қорытынды шығады. Біріншісі: рәсімдегеннен кейін полистің базада шынымен пайда болғанын міндетті түрде тексеріңіз. Екіншісі: клиентке басып шығарылған қағазды алып жүрудің қажеті жоқ, бірақ электрондық полисті телефонына сақтап қойғаны дұрыс — солай көңілі жайланады.' },
    { t:'warn',
      ru:'Бывают мошеннические сайты, которые продают красивый файл в формате PDF, но полис в ЕСБД не заводят. Человек уверен, что застрахован, а на деле у него нет ничего: ни защиты при аварии, ни отметки для полиции. Работайте только через официальные сайты и приложения страховых компаний, и всегда проверяйте полис в базе после оплаты.',
      kk:'ЕСБД-ға полисті енгізбей, тек әдемі PDF файлын сататын алаяқ сайттар кездеседі. Адам сақтандырылғанына сенімді, ал шын мәнінде оның ештеңесі жоқ: апат кезінде де қорғау жоқ, полиция үшін де белгі жоқ. Тек сақтандыру компанияларының ресми сайттары мен қосымшалары арқылы жұмыс істеңіз және төлемнен кейін полисті базадан әрқашан тексеріңіз.' },

    { t:'h', ru:'Почему многим клиентам нужны обе страховки', kk:'Неліктен көп клиентке екі сақтандыру да қажет' },
    { t:'p',
      ru:'ОГПО закрывает вашу ответственность перед другими. КАСКО закрывает вашу собственную потерю. Это не конкуренты, а два разных кармана. Человек с новой машиной в кредите почти всегда берёт оба полиса — часто КАСКО от него требует банк. Человек со старой машиной за небольшие деньги обычно ограничивается ОГПО, потому что КАСКО на такую машину стоит несоразмерно дорого.',
      kk:'ОГПО сіздің басқалар алдындағы жауапкершілігіңізді жабады. КАСКО сіздің өз шығыныңызды жабады. Бұл — бәсекелестер емес, екі бөлек қалта. Несиеге алынған жаңа көлігі бар адам әрдайым дерлік екі полисті де алады — көбіне КАСКО-ны банк талап етеді. Арзан ескі көлігі бар адам әдетте ОГПО-мен шектеледі, өйткені мұндай көлікке КАСКО шамадан тыс қымбат тұрады.' },
    { t:'note',
      ru:'Ваша задача как помощника — не продать человеку самое дорогое, а помочь ему понять разницу и выбрать. Клиент, которому честно объяснили, вернётся через год и приведёт родственников. Клиент, которому навязали лишнее, уйдёт и расскажет об этом всем.',
      kk:'Көмекші ретіндегі сіздің міндетіңіз — адамға ең қымбатын сату емес, айырмашылықты түсініп, таңдауына көмектесу. Шыншыл түсіндірген клиент бір жылдан кейін қайта келеді және туыстарын ертіп келеді. Артық нәрсені зорлап таңған клиент кетеді және бұл туралы бәріне айтады.' }

  quiz:[
    { q:{ ru:'Клиент сам въехал в столб и помял свою машину. У него есть только ОГПО ВТС. Что ему положено?', kk:'Клиент бағанға өзі соғып, өз көлігін мыжып алды. Онда тек ОГПО ВТС бар. Оған не тиесілі?' },
      opts:{ ru:['Ремонт его машины за счёт страховой','Ничего: ОГПО не платит за машину виновника','Половина стоимости ремонта','Выплата после экспертизы'], kk:['Сақтандырушы есебінен көлігін жөндеу','Ештеңе: ОГПО кінәлінің көлігі үшін төлемейді','Жөндеу құнының жартысы','Сараптамадан кейінгі төлем'] },
      correct:1,
      why:{ ru:'ОГПО ВТС покрывает вред, причинённый другим людям. Свою машину владелец чинит сам либо по КАСКО, если оно есть. Столб, кстати, тоже может быть чужим имуществом — если у него есть хозяин, ущерб столбу как раз покроет ОГПО.', kk:'ОГПО ВТС басқа адамдарға келтірілген зиянды өтейді. Өз көлігін иесі өзі немесе КАСКО бар болса, сол бойынша жөндейді. Айтпақшы, баған да өзге біреудің мүлкі болуы мүмкін — иесі бар болса, бағанға келген зиянды дәл сол ОГПО өтейді.' } },
    { q:{ ru:'Что означает аббревиатура ОГПО ВТС?', kk:'ОГПО ВТС қысқартуы нені білдіреді?' },
      opts:{ ru:['Общее государственное покрытие ответственности','Обязательное страхование гражданско-правовой ответственности владельцев транспортных средств','Официальный государственный полис обязательного возмещения','Обязательное грузовое и пассажирское обслуживание транспорта'], kk:['Жауапкершілікті жалпы мемлекеттік жабу','Көлік құралдары иелерінің азаматтық-құқықтық жауапкершілігін міндетті сақтандыру','Міндетті өтеудің ресми мемлекеттік полисі','Көлікке міндетті жүк және жолаушы қызметі'] },
      correct:1,
      why:{ ru:'Ключевые слова здесь — «ответственности» и «владельцев транспортных средств». Именно ответственность перед другими, а не имущество страхователя.', kk:'Мұндағы негізгі сөздер — «жауапкершілік» және «көлік құралдарының иелері». Дәл басқалар алдындағы жауапкершілік, сақтанушының мүлкі емес.' } },
    { q:{ ru:'Ночью на машину клиента упала ветка во время урагана. Виновных нет. Какая страховка может помочь?', kk:'Түнде дауыл кезінде клиенттің көлігіне бұтақ құлады. Кінәлілер жоқ. Қандай сақтандыру көмектесе алады?' },
      opts:{ ru:['ОГПО ВТС','КАСКО, если этот риск включён в программу','Любая из двух','Никакая, такие случаи не страхуются'], kk:['ОГПО ВТС','КАСКО, егер бұл тәуекел бағдарламаға енгізілсе','Екеуінің кез келгені','Ешқайсысы, мұндай жағдайлар сақтандырылмайды'] },
      correct:1,
      why:{ ru:'Когда виновного нет, ОГПО бессильно: возмещать нечего и некому предъявлять. Работает КАСКО, но только если конкретный риск прописан в программе. Поэтому при продаже КАСКО всегда смотрите список рисков, а не только цену.', kk:'Кінәлі болмаған кезде ОГПО дәрменсіз: өтейтін де, талап қоятын да ешкім жоқ. КАСКО жұмыс істейді, бірақ нақты тәуекел бағдарламада жазылған болса ғана. Сондықтан КАСКО сатқанда әрқашан бағаны ғана емес, тәуекелдер тізімін де қараңыз.' } },
    { q:{ ru:'Клиент оплатил полис на незнакомом сайте и получил красивый файл PDF. Что нужно сделать в первую очередь?', kk:'Клиент таныс емес сайтта полисті төлеп, әдемі PDF файл алды. Ең алдымен не істеу керек?' },
      opts:{ ru:['Распечатать и положить в бардачок','Проверить, есть ли полис в ЕСБД','Позвонить в дорожную полицию','Ничего, файла достаточно'], kk:['Басып шығарып, қолғап салғышқа салу','Полистің ЕСБД-да бар-жоғын тексеру','Жол полициясына қоңырау шалу','Ештеңе, файлдың өзі жеткілікті'] },
      correct:1,
      why:{ ru:'Полис существует, только если он есть в единой страховой базе данных. Файл сам по себе ничего не доказывает — его может нарисовать кто угодно. Проверка в базе занимает минуту и защищает клиента от потери денег.', kk:'Полис бірыңғай сақтандыру дерекқорында болса ғана бар болып саналады. Файлдың өзі ештеңені дәлелдемейді — оны кез келген адам жасай алады. Базадан тексеру бір минут алады және клиентті ақшадан айырылудан қорғайды.' } },
    { q:{ ru:'Чем принципиально отличается ценообразование ОГПО и КАСКО?', kk:'ОГПО мен КАСКО бағасының қалыптасуы неден түбегейлі ерекшеленеді?' },
      opts:{ ru:['Цена ОГПО считается по государственной формуле, цену КАСКО компания определяет сама','Обе цены устанавливает государство','Обе цены определяет страховая компания','Цену обеих страховок определяет банк'], kk:['ОГПО бағасы мемлекеттік формула бойынша есептеледі, КАСКО бағасын компания өзі белгілейді','Екі бағаны да мемлекет белгілейді','Екі бағаны да сақтандыру компаниясы белгілейді','Екі сақтандырудың бағасын да банк белгілейді'] },
      correct:0,
      why:{ ru:'Поэтому ОГПО в разных компаниях стоит примерно одинаково — формула одна на всех. А КАСКО имеет смысл сравнивать по нескольким компаниям: разброс цен и условий бывает большой.', kk:'Сондықтан ОГПО әртүрлі компанияларда шамамен бірдей тұрады — формула бәріне ортақ. Ал КАСКО-ны бірнеше компания бойынша салыстырған жөн: баға мен шарттардың айырмашылығы үлкен болуы мүмкін.' } }

  practice:[
    { t:'p',
      ru:'Возьмите телефон и найдите знакомого с машиной — мужа, брата, соседку. Задайте ему три вопроса и запишите ответы в тетрадь.',

    { t:'check',
      ru:'Размер МРП на текущий год и величину базовой страховой премии в МРП уточняйте на egov.kz или на сайте страховой компании перед каждым расчётом. Не заучивайте: эти значения пересматриваются. Формула стабильна, цифры — нет.',
      kk:'Ағымдағы жылғы АЕК мөлшерін және АЕК-пен берілген базалық сақтандыру сыйлықақысының шамасын әр есептеу алдында egov.kz сайтынан немесе сақтандыру компаниясының сайтынан нақтылаңыз. Жаттап алмаңыз: бұл мәндер қайта қаралып отырады. Формула тұрақты, сандар — жоқ.' },

    { t:'h', ru:'Шаг второй: коэффициент по региону', kk:'Екінші қадам: өңір бойынша коэффициент' },
    { t:'p',
      ru:'Второй множитель зависит от того, где зарегистрирован автомобиль. Не от того, где человек живёт сейчас, и не от того, где он ездит, а именно от места регистрации транспортного средства.',
      kk:'Екінші көбейткіш көлік қай жерде тіркелгеніне байланысты. Адамның қазір қайда тұратынына да, қайда жүретініне де емес, дәл көлік құралының тіркелген жеріне байланысты.' },
    { t:'p',
      ru:'Логика простая и справедливая: чем плотнее движение, тем чаще аварии, тем дороже страховка. Поэтому у крупнейших городов коэффициент самый высокий, у областных центров — средний, у районов и сельской местности — самый низкий, иногда меньше единицы.',
      kk:'Логикасы қарапайым әрі әділ: қозғалыс неғұрлым тығыз болса, апат жиі болады, сақтандыру да қымбаттайды. Сондықтан ірі қалаларда коэффициент ең жоғары, облыс орталықтарында — орташа, аудандар мен ауылдық жерлерде — ең төмен, кейде бірден де аз.' },
    { t:'example',
      ru:'Две одинаковые машины, два водителя одного возраста и стажа. Одна машина зарегистрирована в крупном городе, другая — в районном центре. Полис у первой будет заметно дороже, хотя обе стоят во дворе и ездят одинаково. Это не ошибка и не несправедливость, это заложено в формулу.',
      kk:'Екі бірдей көлік, жасы мен өтілі бірдей екі жүргізуші. Бір көлік ірі қалада, екіншісі аудан орталығында тіркелген. Екеуі де ауладан жүріп, бірдей пайдаланылса да, біріншісінің полисі айтарлықтай қымбат болады. Бұл қате де, әділетсіздік те емес, формулаға солай салынған.' },
    { t:'note',
      ru:'Частая ситуация в вашей работе: человек переехал в другой город, но машину не перерегистрировал. Коэффициент будет считаться по старому месту регистрации. Это законно, но объясните клиенту заранее, иначе он удивится цене.',
      kk:'Жұмысыңызда жиі кездесетін жағдай: адам басқа қалаға көшіп кеткен, бірақ көлігін қайта тіркетпеген. Коэффициент ескі тіркеу орны бойынша есептеледі. Бұл заңды, бірақ клиентке алдын ала түсіндіріңіз, әйтпесе ол бағаға таңғалады.' },
    { t:'check',
      ru:'Точная таблица региональных коэффициентов есть в законе и на сайтах страховых компаний в калькуляторе. Не пишите цифры по памяти в переписке с клиентом — откройте калькулятор и покажите расчёт.',
      kk:'Өңірлік коэффициенттердің нақты кестесі заңда және сақтандыру компанияларының сайттарындағы калькуляторда бар. Клиентпен жазысқанда сандарды жаттап жазбаңыз — калькуляторды ашып, есептеуді көрсетіңіз.' },

    { t:'h', ru:'Шаг третий: коэффициент по типу транспортного средства', kk:'Үшінші қадам: көлік құралының түрі бойынша коэффициент' },
    { t:'p',
      ru:'Третий множитель зависит от того, что за техника у клиента. Здесь логика тоже понятная: чем больше и тяжелее машина, тем серьёзнее ущерб, который она может причинить.',
      kk:'Үшінші көбейткіш клиентте қандай техника бар екеніне байланысты. Мұнда да логика түсінікті: көлік неғұрлым үлкен әрі ауыр болса, ол келтіретін зиян соғұрлым ауыр болады.' },
    { t:'list',
      ru:[
        'Легковые автомобили — самая массовая категория, с неё считается большинство ваших расчётов.',
        'Грузовые автомобили — коэффициент выше, часто разделён по грузоподъёмности.',
        'Автобусы и микроавтобусы — отдельная группа, обычно разделённая по количеству мест.',
        'Мототранспорт — мотоциклы, мопеды, мотороллеры.',
        'Прицепы — отдельный коэффициент, и это то, о чём клиенты забывают чаще всего.',
        'Троллейбусы и трамваи — редко встретятся в вашей практике, но в законе они есть.'
      ],
      kk:[
        'Жеңіл автомобильдер — ең көп таралған санат, есептеулеріңіздің көбі осыдан басталады.',
        'Жүк автомобильдері — коэффициенті жоғары, көбіне жүк көтергіштігі бойынша бөлінген.',
        'Автобустар мен шағын автобустар — жеке топ, әдетте орын санына қарай бөлінеді.',
        'Мотокөлік — мотоциклдер, мопедтер, мотороллерлер.',
        'Тіркемелер — жеке коэффициент, және клиенттер дәл осыны жиі ұмытады.',
        'Троллейбустар мен трамвайлар — тәжірибеңізде сирек кездеседі, бірақ заңда бар.'
      ] },
    { t:'warn',
      ru:'Прицеп — это отдельное транспортное средство, и на него нужен свой полис. Человек с дачным прицепом искренне считает, что он застрахован вместе с машиной. Это не так. Спрашивайте про прицеп сами, клиент о нём не вспомнит.',
      kk:'Тіркеме — жеке көлік құралы, оған өз полисі керек. Саяжай тіркемесі бар адам оны көлікпен бірге сақтандырылған деп шын жүрегімен ойлайды. Бұл олай емес. Тіркеме туралы өзіңіз сұраңыз, клиент оны есіне алмайды.' },

    { t:'h', ru:'Шаг четвёртый: срок страхования', kk:'Төртінші қадам: сақтандыру мерзімі' },
    { t:'p',
      ru:'Обычный полис оформляется на год. Но бывают ситуации, когда нужен срок короче: машина куплена под перепродажу, человек уезжает надолго, техника используется сезонно. Для коротких сроков есть свой коэффициент, и он устроен не пропорционально.',
      kk:'Әдеттегі полис бір жылға рәсімделеді. Бірақ мерзімі қысқа керек жағдайлар да болады: көлік қайта сатуға алынған, адам ұзақ уақытқа кетіп бара жатыр, техника маусымдық пайдаланылады. Қысқа мерзімдер үшін өз коэффициенті бар, ол пропорционалды емес.' },
    { t:'p',
      ru:'Проще говоря: полис на полгода стоит **не половину** годового, а заметно больше половины. Полис на месяц — не одну двенадцатую, а гораздо больше. Годовой полис почти всегда выгоднее в пересчёте на месяц. Это надо сказать клиенту до оформления, а не после.',
      kk:'Қарапайым тілмен: жарты жылдық полис жылдықтың **жартысы емес**, жартысынан едәуір қымбат тұрады. Бір айлық полис — он екіден бірі емес, әлдеқайда көп. Жылдық полис айға шаққанда әрдайым дерлік тиімдірек. Мұны клиентке рәсімдегеннен кейін емес, рәсімдегенге дейін айту керек.' },

    { t:'h', ru:'Соберём всё вместе на живом примере', kk:'Бәрін тірі мысалда жинақтайық' },
    { t:'p',
      ru:'Дальше идёт расчёт с условными коэффициентами. Цифры взяты для тренировки, а не как действующий тариф. Ваша задача сейчас — понять порядок действий, а не запомнить числа.',
      kk:'Әрі қарай шартты коэффициенттермен есептеу келеді. Сандар қолданыстағы тариф ретінде емес, жаттығу үшін алынған. Қазіргі міндетіңіз — сандарды жаттау емес, әрекеттер ретін түсіну.' },
    { t:'formula',
      ru:'Шаг 1. МРП × базовая премия = базовая сумма в тенге\nШаг 2. × коэффициент региона\nШаг 3. × коэффициент типа ТС\nШаг 4. × коэффициент возраста и стажа\nШаг 5. × коэффициент бонус-малус\nШаг 6. × коэффициент срока\n= итоговая цена полиса',
      kk:'1-қадам. АЕК × базалық сыйлықақы = теңгедегі базалық сома\n2-қадам. × өңір коэффициенті\n3-қадам. × көлік түрінің коэффициенті\n4-қадам. × жас пен өтіл коэффициенті\n5-қадам. × бонус-малус коэффициенті\n6-қадам. × мерзім коэффициенті\n= полистің қорытынды бағасы' },
    { t:'example',
      ru:'Условно: базовая сумма получилась 20 000 тенге. Машина зарегистрирована в крупном городе, коэффициент региона 2,2. Легковая, коэффициент типа 1,0. Водителю 35 лет, стаж 10 лет, коэффициент 1,0. Аварий не было, бонус-малус 0,95. Полис на год, коэффициент срока 1,0. Считаем: 20 000 × 2,2 × 1,0 × 1,0 × 0,95 × 1,0 = 41 800 тенге. Теперь возьмите тот же расчёт, но с водителем 22 лет со стажем полгода — и увидите, как одна строчка меняет всё.',
      kk:'Шартты түрде: базалық сома 20 000 теңге болды делік. Көлік ірі қалада тіркелген, өңір коэффициенті 2,2. Жеңіл көлік, түр коэффициенті 1,0. Жүргізуші 35 жаста, өтілі 10 жыл, коэффициенті 1,0. Апат болмаған, бонус-малус 0,95. Полис бір жылға, мерзім коэффициенті 1,0. Есептейміз: 20 000 × 2,2 × 1,0 × 1,0 × 0,95 × 1,0 = 41 800 теңге. Енді дәл сол есептеуді 22 жастағы, өтілі жарты жыл жүргізушімен алыңыз — сонда бір жол бәрін қалай өзгертетінін көресіз.' },
    { t:'note',
      ru:'Два коэффициента, которые вы ещё не разобрали — возраст со стажем и бонус-малус — самые интересные и самые спорные для клиентов. Им целиком посвящён следующий урок.',
      kk:'Әлі талдамаған екі коэффициент — жас пен өтіл және бонус-малус — клиенттер үшін ең қызықты әрі ең даулы. Оларға келесі сабақ толығымен арналған.' },
    { t:'h', ru:'Кто платит меньше', kk:'Кім аз төлейді' },
    { t:'p',
      ru:'В законе предусмотрены льготные категории — для отдельных групп граждан размер премии снижен. К таким категориям обычно относят участников и инвалидов войны, инвалидов отдельных групп, пенсионеров по возрасту. Условия и размер льготы уточняйте в страховой компании: список категорий и порядок подтверждения меняются.',
      kk:'Заңда жеңілдікті санаттар қарастырылған — азаматтардың жекелеген топтары үшін сыйлықақы мөлшері төмендетілген. Мұндай санаттарға әдетте соғысқа қатысушылар мен мүгедектер, жекелеген топтағы мүгедектер, жасына байланысты зейнеткерлер жатады. Жеңілдіктің шарттары мен мөлшерін сақтандыру компаниясынан нақтылаңыз: санаттар тізімі мен растау тәртібі өзгеріп отырады.' },
    { t:'check',
      ru:'Про льготу всегда спрашивайте сами: «Вы пенсионер? У вас есть инвалидность?» Люди стесняются об этом говорить и переплачивают. Актуальный перечень льгот и размер скидки уточняйте в компании перед расчётом.',
      kk:'Жеңілдік туралы әрқашан өзіңіз сұраңыз: «Сіз зейнеткерсіз бе? Мүгедектігіңіз бар ма?» Адамдар бұл туралы айтуға ұялып, артық төлейді. Жеңілдіктердің өзекті тізімі мен шегерім мөлшерін есептеу алдында компаниядан нақтылаңыз.' }
  ],
  quiz:[
    { q:{ ru:'Как связаны между собой коэффициенты в формуле ОГПО?', kk:'ОГПО формуласындағы коэффициенттер өзара қалай байланысқан?' },
      opts:{ ru:['Они складываются','Они перемножаются','Берётся самый большой из них','Берётся среднее значение'], kk:['Олар қосылады','Олар көбейтіледі','Олардың ең үлкені алынады','Орташа мәні алынады'] },
      correct:1,
      why:{ ru:'Все коэффициенты умножаются на базовую премию и друг на друга. Поэтому два «плохих» коэффициента дают резкий скачок цены, а не просто небольшую прибавку.', kk:'Барлық коэффициент базалық сыйлықақыға және бір-біріне көбейтіледі. Сондықтан екі «нашар» коэффициент бағаны аздап қана емес, күрт өсіреді.' } },
    { q:{ ru:'Клиент живёт и ездит в Шымкенте, но машина зарегистрирована в районном центре. По какому региону считается коэффициент?', kk:'Клиент Шымкентте тұрып, сонда жүреді, бірақ көлігі аудан орталығында тіркелген. Коэффициент қай өңір бойынша есептеледі?' },
      opts:{ ru:['По месту фактического проживания','По месту регистрации транспортного средства','По выбору клиента','По месту прописки водителя'], kk:['Нақты тұратын жері бойынша','Көлік құралының тіркелген жері бойынша','Клиенттің таңдауы бойынша','Жүргізушінің тіркелген мекенжайы бойынша'] },
      correct:1,
      why:{ ru:'Коэффициент привязан к регистрации автомобиля, а не к прописке человека и не к тому, где он реально ездит. Это частая причина удивления клиентов — предупреждайте заранее.', kk:'Коэффициент адамның тіркелген мекенжайына да, оның шын мәнінде қайда жүретініне де емес, көліктің тіркеуіне байланысты. Бұл клиенттердің таңғалуының жиі себебі — алдын ала ескертіңіз.' } },
    { q:{ ru:'Почему базовая премия установлена в МРП, а не в тенге?', kk:'Базалық сыйлықақы неге теңгемен емес, АЕК-пен белгіленген?' },
      opts:{ ru:['Чтобы запутать клиентов','Чтобы суммы обновлялись автоматически при пересмотре МРП, без переписывания закона','Так требует банк','Чтобы страховые могли менять цену сами'], kk:['Клиенттерді шатастыру үшін','АЕК қайта қаралғанда заңды қайта жазбай, сомалар автоматты түрде жаңарып отыруы үшін','Мұны банк талап етеді','Сақтандырушылар бағаны өздері өзгерте алуы үшін'] },
      correct:1,
      why:{ ru:'МРП — государственная расчётная единица. Меняется МРП в бюджете — автоматически меняются все привязанные к нему суммы: штрафы, пошлины, страховые тарифы. Закон при этом не трогают.', kk:'АЕК — мемлекеттік есептік бірлік. Бюджетте АЕК өзгереді — соған байланған барлық сома автоматты түрде өзгереді: айыппұлдар, баждар, сақтандыру тарифтері. Заңға өзгеріс енгізілмейді.' } },
    { q:{ ru:'Клиент просит оформить полис на 6 месяцев. Сколько это будет стоить относительно годового?', kk:'Клиент полисті 6 айға рәсімдеуді сұрайды. Бұл жылдық полиске қатысты қанша тұрады?' },
      opts:{ ru:['Ровно половину','Заметно больше половины','Меньше половины','Столько же'], kk:['Дәл жартысы','Жартысынан едәуір көп','Жартысынан аз','Сол сомадай'] },

    { t:'warn',
      ru:'Стаж считается от даты первой выдачи водительского удостоверения, а не от даты последнего обмена прав. Люди путаются постоянно: обменял права в прошлом году и уверен, что стаж у него год. На самом деле в удостоверении есть отдельная графа с датой первой выдачи — смотрите именно на неё.',
      kk:'Өтіл жүргізуші куәлігінің соңғы ауыстырылған күнінен емес, алғаш берілген күнінен есептеледі. Адамдар үнемі шатасады: былтыр куәлікті ауыстырып, өтілі бір жыл деп ойлайды. Шын мәнінде куәлікте алғаш берілген күні жазылатын бөлек баған бар — дәл соған қараңыз.' },
    { t:'example',
      ru:'Гульнаре 42 года, права она получила в 2005 году, но потеряла и восстановила в прошлом году. В новом удостоверении дата выдачи прошлогодняя — и новичок-агент посчитает ей стаж один год и завысит цену. Правильно смотреть на графу с датой первой выдачи: стаж у Гульнары почти двадцать лет, и коэффициент у неё самый низкий.',
      kk:'Гүлнәр 42 жаста, куәлікті 2005 жылы алған, бірақ жоғалтып алып, былтыр қалпына келтірген. Жаңа куәлікте берілген күні былтырғы — сонда тәжірибесіз агент оған бір жыл өтіл есептеп, бағаны асырып жібереді. Дұрысы — алғаш берілген күні жазылған бағанға қарау: Гүлнәрдің өтілі жиырма жылға жуық, коэффициенті ең төмен.' },

    { t:'h', ru:'Правило худшего коэффициента', kk:'Ең нашар коэффициент ережесі' },
    { t:'p',
      ru:'Теперь самое важное правило этого урока. Если в полис вписано несколько водителей, коэффициент по возрасту и стажу берётся **не средний и не по владельцу, а самый высокий среди всех вписанных**. То есть по худшему водителю.',
      kk:'Енді осы сабақтың ең маңызды ережесі. Егер полиске бірнеше жүргізуші жазылса, жас пен өтіл бойынша коэффициент **орташа да, иесі бойынша да емес, жазылғандардың ішіндегі ең жоғарысы** алынады. Яғни ең нашар жүргізуші бойынша.' },
    { t:'p',
      ru:'Причина понятна: страховая не знает, кто из вписанных сядет за руль в момент аварии, поэтому закладывает риск по самому неопытному. Одна строчка в полисе может поднять цену в разы.',
      kk:'Себебі түсінікті: сақтандырушы апат болған сәтте жазылғандардың қайсысы рөлде отыратынын білмейді, сондықтан тәуекелді ең тәжірибесізі бойынша есептейді. Полистегі бір жол бағаны бірнеше есе өсіріп жіберуі мүмкін.' },
    { t:'example',
      ru:'Семья Жанны. Сама Жанна — 40 лет, стаж 15 лет, коэффициент самый низкий. Муж — 44 года, стаж 20 лет, тоже самый низкий. И сын, 19 лет, права получил три месяца назад. Если вписать сына, весь полис посчитается по его коэффициенту — самому высокому из четырёх групп. Цена вырастет не на треть, а в разы, хотя мама с папой ездят каждый день, а сын раз в месяц.',
      kk:'Жанна отбасы. Жаннаның өзі — 40 жаста, өтілі 15 жыл, коэффициенті ең төмен. Күйеуі — 44 жаста, өтілі 20 жыл, ол да ең төмен. Және ұлы, 19 жаста, куәлікті үш ай бұрын алған. Егер ұлын жазса, бүкіл полис оның коэффициенті бойынша — төрт топтың ішіндегі ең жоғарысы бойынша есептеледі. Баға үштен бірге емес, бірнеше есе өседі, ал әке-шеше күн сайын, ұлы айына бір рет жүрсе де.' },
    { t:'note',
      ru:'Отсюда рождается ваш самый ценный вопрос при оформлении: «Кто ещё будет садиться за руль этой машины, хотя бы иногда?» Спросите до расчёта, а не после. Иначе вы назовёте одну цену, а при оформлении окажется другая — и клиент решит, что вы его обманули.',
      kk:'Осыдан рәсімдеу кезіндегі ең құнды сұрағыңыз туады: «Бұл көліктің рөліне тағы кім отырады, тіпті анда-санда болса да?» Есептеуден кейін емес, есептеуге дейін сұраңыз. Әйтпесе бір бағаны айтасыз да, рәсімдеу кезінде басқасы шығады — сонда клиент сізді алдады деп ойлайды.' },
    { t:'p',
      ru:'Дальше идёт разговор про выбор. Вписывать молодого водителя или нет — решает клиент, а не вы. Ваше дело — честно показать обе стороны. Если сына не вписать, полис дешевле, но когда сын сядет за руль, это будет нарушением, и при аварии страховая имеет полное право предъявить требование к нему лично: то есть она заплатит потерпевшему, а потом взыщет эти деньги с семьи. Экономия обернётся долгом.',
      kk:'Әрі қарай таңдау туралы әңгіме келеді. Жас жүргізушіні жазу-жазбауды сіз емес, клиент шешеді. Сіздің ісіңіз — екі жағын да шыншыл көрсету. Егер ұлын жазбаса, полис арзан, бірақ ұл рөлге отырғанда, бұл бұзушылық болады, ал апат кезінде сақтандырушының оған жеке талап қоюға толық құқығы бар: яғни ол зардап шеккенге төлейді, сосын осы ақшаны отбасынан өндіріп алады. Үнемдеу қарызға айналады.' },
    { t:'warn',
      ru:'Никогда не советуйте клиенту «не вписывать, чтобы дешевле». Это совет, за который отвечаете вы своей репутацией, а расплачивается семья. Показывайте два расчёта и оставляйте решение человеку.',
      kk:'Клиентке «арзан болу үшін жазбай-ақ қойыңыз» деп ешқашан кеңес бермеңіз. Бұл — өз беделіңізбен жауап беретін кеңес, ал есесін отбасы төлейді. Екі есептеуді көрсетіп, шешімді адамның өзіне қалдырыңыз.' },

    { t:'h', ru:'Бонус-малус: история вашей езды', kk:'Бонус-малус: жүру тарихыңыз' },
    { t:'p',
      ru:'Последний множитель — самый интересный. Бонус-малус это система классов, в которой аккуратные водители платят меньше, а те, из-за кого страховая платила, — больше. Слово состоит из двух частей: бонус — награда, малус — наказание.',
      kk:'Соңғы көбейткіш — ең қызықтысы. Бонус-малус — ұқыпты жүргізушілер аз, ал сақтандырушы кесірінен төлегендер көп төлейтін сыныптар жүйесі. Сөз екі бөліктен тұрады: бонус — марапат, малус — жаза.' },
    { t:'p',
      ru:'Работает это так. Каждому водителю присвоен класс. Новичок, который страхуется впервые, получает стартовый класс с коэффициентом ровно 1 — то есть ни скидки, ни надбавки. Дальше всё зависит от того, что происходило в течение года.',
      kk:'Ол былай жұмыс істейді. Әр жүргізушіге сынып берілген. Алғаш рет сақтандырылатын жаңадан бастаушы коэффициенті дәл 1 болатын бастапқы сыныпты алады — яғни жеңілдік те, үстеме де жоқ. Әрі қарайғысы жыл ішінде не болғанына байланысты.' },
    { t:'list',
      ru: [
        'Год прошёл без страховых выплат по вашей вине — класс повышается на одну ступень, коэффициент снижается. Полис дешевеет.',
        'В течение года страховая платила из-за вас — класс падает, причём сразу на несколько ступеней, коэффициент растёт. Полис дорожает.',
        'Чем дольше человек ездит без аварий, тем ниже его коэффициент, и так до самого выгодного класса.'
      ],
      kk: [
        'Жыл сіздің кінәңізден болған сақтандыру төлемдерінсіз өтті — сынып бір сатыға көтеріледі, коэффициент төмендейді. Полис арзандайды.',
        'Жыл ішінде сақтандырушы сіздің кесіріңізден төледі — сынып төмендейді, оның үстіне бірден бірнеше сатыға, коэффициент өседі. Полис қымбаттайды.',
        'Адам апатсыз неғұрлым ұзақ жүрсе, коэффициенті соғұрлым төмен, ең тиімді сыныпқа дейін.'
      ] },
    { t:'note',
      ru:'Ключевое, что путают все: класс понижается не за факт аварии, а за факт **выплаты** страховой компанией по вашей вине. Если вы попали в аварию и виноват был другой, ваш класс не пострадает — платила его страховая, а не ваша.',
      kk:'Бәрі шатастыратын ең маңыздысы: сынып апаттың болғаны үшін емес, сіздің кінәңізден сақтандыру компаниясының **төлем жасағаны** үшін төмендейді. Егер апатқа ұшырасаңыз, бірақ басқа адам кінәлі болса, сіздің сыныбыңыз зардап шекпейді — оның сақтандырушысы төледі, сіздікі емес.' },
    { t:'example',
      ru:'Ерлан десять лет ездит без единой аварии и накопил хороший класс. Однажды в него въехали сзади на светофоре. Ерлан звонит и в панике спрашивает, подорожает ли теперь его страховка. Ответ: нет. Виноват тот, кто въехал, платит его страховая, а класс Ерлана продолжит расти как обычно.',
      kk:'Ерлан он жыл бойы бірде-бір апатсыз жүріп, жақсы сынып жинады. Бірде оны бағдаршамда артынан соғып кетті. Ерлан қоңырау шалып, енді сақтандыруы қымбаттай ма деп үрейленіп сұрайды. Жауабы: жоқ. Соғып кеткен адам кінәлі, оның сақтандырушысы төлейді, ал Ерланның сыныбы бұрынғыдай өсе береді.' },
    { t:'p',
      ru:'Класс хранится в единой страховой базе данных и привязан к человеку, а не к машине. Продал машину, купил новую — класс поехал с вами. Сменил страховую компанию — класс всё равно ваш, новая компания увидит его в базе.',
      kk:'Сынып бірыңғай сақтандыру дерекқорында сақталады және көлікке емес, адамға байланған. Көлікті сатып, жаңасын алдыңыз — сынып сізбен бірге жүреді. Сақтандыру компаниясын ауыстырдыңыз — сынып бәрібір сіздікі, жаңа компания оны базадан көреді.' },
    { t:'p',
      ru:'Ещё одна деталь, о которой мало кто знает: если человек долго не страховался вообще, накопленный класс может обнулиться и вернуться к стартовому значению. Перерыв в страховании — это потеря скидки. Клиентам с продажей машины стоит об этом сказать заранее.',
      kk:'Аз адам білетін тағы бір нәрсе: егер адам ұзақ уақыт мүлдем сақтандырылмаса, жинақталған сынып нөлденіп, бастапқы мәніне қайта оралуы мүмкін. Сақтандырудағы үзіліс — жеңілдіктен айырылу. Көлігін сатқан клиенттерге бұны алдын ала айтқан жөн.' },
    { t:'check',
      ru:'Точное количество классов, стартовый класс и значение каждого коэффициента установлены законом и могут пересматриваться. Смотрите действующую таблицу на сайте страховой компании, а класс конкретного клиента — в единой страховой базе данных при расчёте.',
      kk:'Сыныптардың нақты саны, бастапқы сынып және әр коэффициенттің мәні заңмен белгіленген және қайта қаралуы мүмкін. Қолданыстағы кестені сақтандыру компаниясының сайтынан, ал нақты клиенттің сыныбын есептеу кезінде бірыңғай сақтандыру дерекқорынан қараңыз.' },

    { t:'h', ru:'Как объяснить всё это за одну минуту', kk:'Мұның бәрін бір минутта қалай түсіндіруге болады' },
    { t:'p',
      ru:'Соберите объяснение из трёх коротких фраз. Первая: цена зависит от того, кто за рулём, — возраст и стаж. Вторая: если водителей несколько, считают по самому неопытному. Третья: если год прошёл без выплат по вашей вине, в следующий раз будет дешевле. Больше клиенту в первый разговор не нужно.',
      kk:'Түсіндірмені үш қысқа сөйлемнен құраңыз. Біріншісі: баға рөлде кім отырғанына — жасы мен өтіліне байланысты. Екіншісі: жүргізуші бірнешеу болса, ең тәжірибесізі бойынша есептейді. Үшіншісі: жыл сіздің кінәңізден төлемсіз өтсе, келесі жолы арзанырақ болады. Алғашқы әңгімеде клиентке бұдан артық керек емес.' }
  ],
  quiz:[
    { q:{ ru:'В полис вписаны мама 45 лет со стажем 20 лет, папа 47 лет со стажем 25 лет и сын 19 лет со стажем полгода. Какой коэффициент по возрасту и стажу применят?', kk:'Полиске өтілі 20 жыл 45 жастағы ана, өтілі 25 жыл 47 жастағы әке және өтілі жарты жыл 19 жастағы ұл жазылған. Жас пен өтіл бойынша қандай коэффициент қолданылады?' },
      opts:{ ru:['Средний по всем троим','По владельцу машины','Самый высокий — по сыну','Самый низкий — по папе'], kk:['Үшеуі бойынша орташа','Көлік иесі бойынша','Ең жоғарысы — ұлы бойынша','Ең төмені — әкесі бойынша'] },
      correct:2,
      why:{ ru:'Применяется правило худшего коэффициента: берётся самый высокий среди всех вписанных водителей. Поэтому один молодой водитель поднимает цену всего полиса. Всегда спрашивайте состав водителей до расчёта.', kk:'Ең нашар коэффициент ережесі қолданылады: жазылған жүргізушілердің ішіндегі ең жоғарысы алынады. Сондықтан бір жас жүргізуші бүкіл полистің бағасын өсіреді. Жүргізушілер құрамын есептеуге дейін әрқашан сұраңыз.' } },
    { q:{ ru:'От какой даты считается водительский стаж?', kk:'Жүргізуші өтілі қай күннен есептеледі?' },
      opts:{ ru:['От даты последнего обмена прав','От даты первой выдачи водительского удостоверения','От даты покупки первой машины','От восемнадцатилетия'], kk:['Куәлікті соңғы ауыстырған күннен','Жүргізуші куәлігі алғаш берілген күннен','Алғашқы көлікті сатып алған күннен','Он сегіз жасқа толғаннан'] },
      correct:1,
      why:{ ru:'В удостоверении есть отдельная графа с датой первой выдачи. Если смотреть на дату последнего обмена, у опытного водителя стаж получится нулевой, и цена будет завышена в разы. Это одна из самых частых ошибок новичков.', kk:'Куәлікте алғаш берілген күні жазылатын бөлек баған бар. Соңғы ауыстырылған күнге қарасаңыз, тәжірибелі жүргізушінің өтілі нөл болып шығады да, баға бірнеше есе асып кетеді. Бұл — жаңадан бастаушылардың ең жиі қателерінің бірі.' } },
    { q:{ ru:'В машину клиента въехали сзади, виноват другой водитель. Что будет с классом бонус-малус клиента?', kk:'Клиенттің көлігіне артынан соғып кетті, басқа жүргізуші кінәлі. Клиенттің бонус-малус сыныбы не болады?' },
      opts:{ ru:['Понизится, потому что была авария','Не изменится: выплата шла не по его вине','Обнулится','Понизится на одну ступень'], kk:['Апат болғандықтан төмендейді','Өзгермейді: төлем оның кінәсінен болған жоқ','Нөлденеді','Бір сатыға төмендейді'] },
      correct:1,

    { t:'note',

    { t:'h', ru:'Семь ошибок, которые вы будете находить чаще всего', kk:'Сіз жиі кездестіретін жеті қате' },

    { t:'steps',

    { t:'example',
      ru:'Асем вышла замуж и сменила фамилию. Через месяц приходит оформлять страховку. Удостоверение новое, а техпаспорт на машину старый, на девичью фамилию. Помощник, который этого не заметил, оформил полис — и при первой же проверке возникли вопросы, а при аварии страховая начала долгие разбирательства. Помощник, который заметил, потратил две минуты, объяснил Асем порядок и отправил её сначала обновить документы на машину. Второй помощник получил клиента навсегда.',
      kk:'Әсем тұрмысқа шығып, тегін өзгертті. Бір айдан кейін сақтандыру рәсімдеуге келеді. Жеке куәлігі жаңа, ал көліктің техпаспорты ескі, қыз кезіндегі тегімен. Мұны байқамаған көмекші полисті рәсімдеді — алғашқы тексерістің өзінде сұрақ туды, ал апат кезінде сақтандырушы ұзақ тексеруді бастады. Байқаған көмекші екі минут жұмсап, Әсемге тәртіпті түсіндіріп, алдымен көлікке құжаттарын жаңартуға жіберді. Екінші көмекші клиентті мәңгілікке иеленді.' },

        '**Назвать клиенту цену и объяснить, из чего она сложилась.** Не просто сумму, а две-три причины: город, тип машины, самый молодой водитель. Человек, который понимает цену, не торгуется.',
        '**Заполнить анкету на сайте или в приложении.** Вводите данные с фотографий, а не по памяти. Не спешите — поля можно перепроверить до оплаты, после оплаты это уже другая процедура.',
        '**Оплатить.** Оплату делает клиент со своей карты, либо вы через агентский кабинет, если так устроена работа в вашей компании. Никогда не просите перевести деньги вам на личную карту, пока это не оговорено официально в вашем договоре.',
        '**Получить полис.** Он придёт на электронную почту и появится в приложении. Сохраните файл и отправьте клиенту в мессенджер.',
        '**Проверить полис в единой страховой базе данных.** Обязательный шаг, а не по желанию. Пока полиса нет в базе — работы нет.'
      ],
      kk:[
        '**Құжаттарды жинау.** Клиентке жазбалардан дайын хабарлама жіберіңіз: жеке куәліктің фотосы, техпаспорттың екі жағының фотосы, барлық жүргізушінің куәлігінің фотосы. Бәрі келмейінше бастамаңыз.',
        '**Жүргізушілер мен тіркеме туралы сұрау.** Рөлге тағы кім, тіпті анда-санда болса да, отырады? Тіркеме бар ма? Осы екі сұрақ бағаны да, полис құрамын да өзгертеді.',
        '**Құжаттарды тексеру парағы бойынша тексеру.** Өткен сабақтағы үш өтпе: өрістерді салыстыру, сандарды дауыстап оқу, клиенттен растау алу.',
        '**Калькуляторда есептеу.** Компанияның ресми калькуляторын ашып, деректерді енгізіңіз. Есептеудің скриншотын жасаңыз — ол керек болады.',
        '**Клиентке бағаны айтып, оның неден құралғанын түсіндіру.** Жай ғана соманы емес, екі-үш себебін: қаласы, көлік түрі, ең жас жүргізушісі. Бағаны түсінген адам саудаласпайды.',
        '**Сайтта немесе қосымшада сауалнаманы толтыру.** Деректерді жадыңыздан емес, фотосуреттерден енгізіңіз. Асықпаңыз — өрістерді төлемге дейін қайта тексеруге болады, төлемнен кейін бұл басқа рәсім.',
        '**Төлеу.** Төлемді клиент өз картасынан жасайды, немесе компанияңыздағы жұмыс солай ұйымдастырылса, сіз агенттік кабинет арқылы. Шартыңызда ресми келісілмейінше, ақшаны жеке картаңызға аударуды ешқашан сұрамаңыз.',
        '**Полисті алу.** Ол электрондық поштаға келеді және қосымшада пайда болады. Файлды сақтап, клиентке мессенджерге жіберіңіз.',
        '**Полисті бірыңғай сақтандыру дерекқорынан тексеру.** Бұл — қалауыңыз емес, міндетті қадам. Полис базада жоқ болса — жұмыс та жоқ.'
      ] },

    { t:'h', ru:'Как проверить полис в базе', kk:'Полисті базадан қалай тексеру керек' },
    { t:'p',
      ru:'Проверка делается по государственному номеру автомобиля или по ИИН владельца. Сервис проверки доступен через сайт единой страховой базы данных, через egov.kz и через приложения самих страховых компаний. Достаточно ввести номер и посмотреть, есть ли действующий полис и на какой срок.',
      kk:'Тексеру көліктің мемлекеттік нөмірі немесе иесінің ЖСН бойынша жасалады. Тексеру сервисі бірыңғай сақтандыру дерекқорының сайты, egov.kz және сақтандыру компанияларының қосымшалары арқылы қолжетімді. Нөмірді енгізіп, қолданыстағы полистің бар-жоғын және мерзімін қарасаңыз жеткілікті.' },
    { t:'p',
      ru:'Проверяйте три вещи, а не одну. Первое: полис вообще существует. Второе: даты начала и окончания те, которые вы оформляли. Третье: марка и номер машины совпадают. Скриншот результата отправьте клиенту — это ваш способ закрыть вопрос навсегда.',
      kk:'Бір емес, үш нәрсені тексеріңіз. Біріншісі: полис жалпы бар ма. Екіншісі: басталу және аяқталу күндері сіз рәсімдегендей ме. Үшіншісі: көліктің маркасы мен нөмірі сәйкес пе. Нәтиженің скриншотын клиентке жіберіңіз — бұл мәселені мәңгі жабудың тәсілі.' },
    { t:'example',
      ru:'Динара оформила клиенту полис в пятницу вечером, оплата прошла, файл пришёл. Она по привычке зашла в базу — полиса там не было. Оказалось, платёж завис на стороне банка. Динара написала в поддержку компании в тот же вечер, к утру запись появилась. Клиент об этой истории даже не узнал. Если бы она не проверила, узнал бы — при первой встрече с патрулём.',
      kk:'Динара клиентке полисті жұма кеші рәсімдеді, төлем өтті, файл келді. Ол әдетінше базаға кірді — полис онда жоқ болып шықты. Төлем банк жағында тұрып қалыпты. Динара сол кеші компанияның қолдау қызметіне жазды, таңға қарай жазба пайда болды. Клиент бұл оқиғаны білген де жоқ. Егер ол тексермегенде, клиент патрульмен алғаш кездескенде білер еді.' },
    { t:'note',
      ru:'Проверка в базе — это ритуал, который отличает надёжного помощника. Заведите правило: пока не увидела полис в базе своими глазами, работа не закончена и деньги не заработаны.',
      kk:'Базадан тексеру — сенімді көмекшіні ерекшелейтін ырым. Ереже қалыптастырыңыз: полисті базадан өз көзіммен көрмейінше, жұмыс аяқталған жоқ, ақша да табылған жоқ.' },

    { t:'h', ru:'Что отдать клиенту в конце', kk:'Соңында клиентке нені беру керек' },

    { t:'p',
      ru:'Последний пункт — ваш главный источник дохода в будущем. Полис заканчивается ровно через год. Если вы напишете клиенту за месяц, он продлит через вас. Если не напишете — он вспомнит о страховке в день, когда его остановят, и оформит там, где быстрее. Заведите календарь напоминаний с первого же клиента.',
      kk:'Соңғы тармақ — болашақтағы басты табыс көзіңіз. Полис дәл бір жылдан кейін бітеді. Клиентке бір ай бұрын жазсаңыз, ол сіз арқылы ұзартады. Жазбасаңыз — сақтандыруды тоқтатылған күні есіне алып, қайда тез болса, сол жерден рәсімдейді. Бірінші клиенттен бастап еске салу күнтізбесін жүргізіңіз.' },
    { t:'h', ru:'Простая система напоминаний с телефона', kk:'Телефондағы қарапайым еске салу жүйесі' },

      kk:'Сайттардың нақты мекенжайлары, бөлім атаулары мен төлем тәртібі әр компанияда өзінше және мезгіл-мезгіл өзгеріп отырады. Басу тізбегін жаттап алмаңыз — өз сақтандыру компанияңыздан агенттерге арналған өзекті нұсқаулықты сұраңыз, ол бәрінде бар.' }

  quiz:[
    { q:{ ru:'Какой шаг завершает оформление полиса?', kk:'Полисті рәсімдеуді қай қадам аяқтайды?' },
      opts:{ ru:['Оплата','Получение файла на почту','Проверка полиса в единой страховой базе данных','Отправка полиса клиенту'], kk:['Төлем','Файлды поштаға алу','Полисті бірыңғай сақтандыру дерекқорынан тексеру','Полисті клиентке жіберу'] },
      correct:2,
      why:{ ru:'Оплата может зависнуть, файл может прийти, а записи в базе не быть. Именно база определяет, застрахован человек или нет. Проверка занимает минуту и должна быть обязательным ритуалом.', kk:'Төлем тұрып қалуы мүмкін, файл келуі мүмкін, ал базада жазба болмауы мүмкін. Адамның сақтандырылған-сақтандырылмағанын дәл база анықтайды. Тексеру бір минут алады және міндетті ырым болуы тиіс.' } },
    { q:{ ru:'Что нужно проверить в базе, кроме самого факта наличия полиса?', kk:'Базадан полистің бар-жоғынан бөлек тағы нені тексеру керек?' },
      opts:{ ru:['Только номер полиса','Даты действия и совпадение машины','Фамилию агента','Сумму оплаты'], kk:['Тек полис нөмірін','Қолданылу мерзімін және көліктің сәйкестігін','Агенттің тегін','Төлем сомасын'] },

    { q:{ ru:'Клиент просит перевести деньги за полис на вашу личную карту. Что делать?', kk:'Клиент полис ақшасын жеке картаңызға аударуды сұрайды. Не істеу керек?' },
      opts:{ ru:['Согласиться, так быстрее','Оплатить должен клиент со своей карты или вы через агентский кабинет, если это оговорено в договоре','Попросить наличные','Отправить его в другую компанию'], kk:['Келісу, солай тезірек','Төлемді клиент өз картасынан жасауы керек немесе шартта келісілсе, сіз агенттік кабинет арқылы','Қолма-қол ақша сұрау','Оны басқа компанияға жіберу'] },

    { q:{ ru:'Зачем сразу после оформления ставить напоминание в календарь?', kk:'Рәсімдеп болған соң күнтізбеге еске салуды бірден не үшін қою керек?' },
      opts:{ ru:['Чтобы не забыть про клиента','Чтобы за месяц до окончания полиса написать клиенту и продлить через вас','Так требует страховая','Чтобы посчитать доход'], kk:['Клиентті ұмытпау үшін','Полис аяқталуына бір ай қалғанда клиентке жазып, сіз арқылы ұзарту үшін','Мұны сақтандырушы талап етеді','Табысты есептеу үшін'] },
      correct:1,
      why:{ ru:'Продление — основа стабильного дохода помощника. Клиент, которому напомнили вовремя, продлевает через вас. Клиент, о котором забыли, оформляет там, где ближе.', kk:'Ұзарту — көмекшінің тұрақты табысының негізі. Уақытында еске салынған клиент сіз арқылы ұзартады. Ұмыт қалған клиент қай жер жақын болса, сол жерден рәсімдейді.' } },
    { q:{ ru:'Где законно оформлять полис?', kk:'Полисті қайда рәсімдеу заңды?' },
      opts:{ ru:['На любом сайте, где дешевле','На официальном сайте или в приложении страховой компании, в приложении банка-партнёра, в агентском кабинете','У знакомого, который делает быстро','По объявлению в социальных сетях'], kk:['Қайда арзан болса, сол сайтта','Сақтандыру компаниясының ресми сайтында немесе қосымшасында, әріптес банк қосымшасында, агенттік кабинетте','Тез жасайтын таныс арқылы','Әлеуметтік желідегі хабарландыру бойынша'] },
      correct:1,

      ru:'В Казахстане есть случаи, когда допускается упрощённое оформление без выезда сотрудников полиции, но условия ограничены и периодически меняются. Не решайте это за клиента по памяти: уточните действующий порядок в своей страховой компании и на egov.kz, а по умолчанию советуйте дождаться полицию.',
      kk:'Қазақстанда полиция қызметкерлері келмей-ақ, оңайлатылған рәсімдеуге жол берілетін жағдайлар бар, бірақ шарттары шектеулі және мезгіл-мезгіл өзгеріп отырады. Мұны клиент үшін жадыңыздан шешпеңіз: қолданыстағы тәртіпті өз сақтандыру компанияңыздан және egov.kz сайтынан нақтылаңыз, ал әдепкі жағдайда полицияны күтуге кеңес беріңіз.' },

    { t:'h', ru:'Как получить выплату', kk:'Төлемді қалай алуға болады' },
    { t:'p',
      ru:'Выплату получает пострадавший, и обращается он в страховую компанию виновника. Это первое, что нужно объяснить: не в свою, а в ту, где застрахован тот, кто в вас въехал. Номер полиса виновника вы записали на месте — вот зачем.',
      kk:'Төлемді зардап шеккен алады және ол кінәлінің сақтандыру компаниясына жүгінеді. Ең алдымен түсіндіру керегі осы: өзінің емес, өзіне соғып кеткен адам сақтандырылған компанияға. Кінәлінің полис нөмірін оқиға орнында жазып алдыңыз — міне, не үшін.' },
    { t:'p',
      ru:'Сообщить о случившемся в страховую нужно быстро, в срок, установленный законом и договором — обычно это несколько рабочих дней. Пропустили срок — компания может отказать или снизить выплату. Поэтому первый звонок делайте прямо с места аварии, ещё до того, как уедете домой.',
      kk:'Болған жағдай туралы сақтандырушыға тез, заң мен шартта белгіленген мерзімде хабарлау керек — әдетте бұл бірнеше жұмыс күні. Мерзімді өткізіп алсаңыз — компания бас тартуы немесе төлемді азайтуы мүмкін. Сондықтан бірінші қоңырауды үйге кетпей тұрып, апат болған жерден шалыңыз.' },
    { t:'list',
      ru:[
        'Заявление в страховую компанию виновника.',
        'Документы из полиции по факту происшествия — они подтверждают, кто виноват.',
        'Удостоверение личности пострадавшего и документы на его машину.',
        'Фотографии с места аварии.',
        'Реквизиты банковского счёта для перечисления денег.'
      ],
      kk:[
        'Кінәлінің сақтандыру компаниясына өтініш.',
        'Оқиға бойынша полициядан алынған құжаттар — олар кімнің кінәлі екенін растайды.',
        'Зардап шеккеннің жеке куәлігі және оның көлігіне арналған құжаттар.',
        'Апат орнынан түсірілген фотосуреттер.',
        'Ақша аудару үшін банк шотының деректемелері.'
      ] },
    { t:'p',
      ru:'Дальше страховая осматривает машину и оценивает ущерб. Если пострадавший не согласен с суммой, он вправе провести независимую оценку и спорить, вплоть до суда. Вы как помощник в этот спор не лезете, но можете объяснить человеку, что такое право у него есть.',
      kk:'Әрі қарай сақтандырушы көлікті қарап, зиянды бағалайды. Егер зардап шеккен сомамен келіспесе, ол тәуелсіз бағалау жүргізіп, сотқа дейін дауласуға құқылы. Сіз көмекші ретінде бұл дауға араласпайсыз, бірақ адамға мұндай құқығы бар екенін түсіндіре аласыз.' },
    { t:'note',
      ru:'Помните про потолок выплаты: он установлен законом в МРП. Если ремонт стоит дороже потолка, разницу пострадавший взыскивает с виновника лично. Проговорите это клиенту заранее, чтобы у него не было ложных ожиданий.',
      kk:'Төлем шегін ұмытпаңыз: ол заңда АЕК-пен белгіленген. Егер жөндеу шектен қымбат болса, айырманы зардап шеккен кінәліден жеке өндіріп алады. Клиентте жалған үміт болмауы үшін мұны алдын ала айтып қойыңыз.' },
    { t:'h', ru:'Когда страховая может отказать или потребовать деньги обратно', kk:'Сақтандырушы қашан бас тартады немесе ақшаны қайтаруды талап етеді' },
    { t:'list',
      ru:[
        'За рулём был человек, не вписанный в полис.',
        'Водитель был в состоянии опьянения.',
        'У водителя не было права управления — прав нет или они просрочены.',
        'Виновник скрылся с места происшествия.',
        'Ущерб причинён умышленно.'
      ],
      kk:[
        'Рөлде полиске жазылмаған адам отырды.',
        'Жүргізуші мас күйде болды.',
        'Жүргізушінің көлік жүргізу құқығы болмады — куәлігі жоқ немесе мерзімі өткен.',
        'Кінәлі оқиға болған жерден қашып кетті.',
        'Зиян қасақана келтірілді.'

    { t:'p',
      ru:'В этих случаях пострадавший чаще всего деньги всё равно получает — закон защищает его. А вот дальше страховая идёт к виновнику и требует вернуть выплаченное. Именно поэтому мы в третьем уроке так подробно говорили про вписанных водителей: экономия на одной строчке превращается в долг на всю сумму ремонта.',
      kk:'Мұндай жағдайларда зардап шеккен көбіне ақшаны бәрібір алады — оны заң қорғайды. Ал әрі қарай сақтандырушы кінәліге барып, төленген ақшаны қайтаруды талап етеді. Дәл сондықтан үшінші сабақта жазылған жүргізушілер туралы соншалықты егжей-тегжейлі айттық: бір жолға үнемдеу бүкіл жөндеу сомасындағы қарызға айналады.' },

    { t:'h', ru:'Штраф за езду без полиса', kk:'Полиссіз жүргені үшін айыппұл' },
    { t:'term', abbr:'КоАП',
      ru:'Кодекс Республики Казахстан об административных правонарушениях. Именно в нём прописаны все штрафы за нарушения на дороге, включая отсутствие обязательной страховки.',
      kk:'Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексі (ӘҚБтК). Жолдағы бұзушылықтар үшін барлық айыппұл, оның ішінде міндетті сақтандырудың болмағаны үшін айыппұл да, дәл сонда жазылған.' },
    { t:'p',
      ru:'Ездить без действующего полиса ОГПО — административное правонарушение. Штраф установлен в МРП, а значит, его размер в тенге меняется вместе с МРП каждый год. Отдельно наказывается управление машиной, если водитель не вписан в полис, — это тоже нарушение, хотя полис на машину есть.',
      kk:'Қолданыстағы ОГПО полисінсіз жүру — әкімшілік құқық бұзушылық. Айыппұл АЕК-пен белгіленген, яғни оның теңгедегі мөлшері жыл сайын АЕК-пен бірге өзгереді. Полис көлікке бар болса да, жүргізуші полиске жазылмаған болса, көлікті басқару да бөлек жазаланады.' },
    { t:'check',
      ru:'Точную сумму штрафа за отсутствие полиса не называйте по памяти: она привязана к МРП и статьи КоАП пересматриваются. Проверяйте актуальный размер на egov.kz или в приложении банка при проверке штрафов.',
      kk:'Полистің болмағаны үшін айыппұлдың нақты сомасын жадыңыздан айтпаңыз: ол АЕК-ке байланған, ал ӘҚБтК баптары қайта қаралып отырады. Өзекті мөлшерді egov.kz сайтынан немесе айыппұлдарды тексеру кезінде банк қосымшасынан тексеріңіз.' },
    { t:'p',
      ru:'Есть важная деталь, которая почти всегда радует клиентов: по многим штрафам действует скидка при быстрой оплате — если заплатить в первые семь суток, сумма снижается вдвое. Подробно этот механизм мы разберём во втором модуле, но упомянуть его при разговоре о страховке полезно.',
      kk:'Клиенттерді әрдайым дерлік қуантатын маңызды бір нәрсе бар: көптеген айыппұл бойынша тез төлегенде жеңілдік қолданылады — алғашқы жеті тәулікте төлесе, сома екі есе азаяды. Бұл тетікті екінші модульде егжей-тегжейлі талдаймыз, бірақ сақтандыру туралы әңгімеде айта кету пайдалы.' },
    { t:'p',
      ru:'И главный аргумент, который работает лучше любых цифр: штраф платится каждый раз, когда вас остановили. Полис оплачивается один раз в год. Два-три штрафа за год почти всегда обходятся дороже полиса, а при аварии без страховки человек платит за чужой ремонт целиком из своего кармана.',
      kk:'Кез келген саннан жақсы жұмыс істейтін басты дәлел: айыппұл сізді тоқтатқан сайын төленеді. Полис жылына бір рет төленеді. Жылына екі-үш айыппұл полистен әрдайым дерлік қымбатқа түседі, ал сақтандырусыз апатқа ұшыраса, адам өзгенің жөндеу ақысын түгелдей өз қалтасынан төлейді.' },

    { t:'h', ru:'Памятка, которую вы отдаёте каждому клиенту', kk:'Әр клиентке беретін жаднама' },
    { t:'p',
      ru:'Напишите этот текст один раз в заметках телефона и отправляйте вместе с полисом. Он короткий специально: в стрессе длинное не читают.',
      kk:'Бұл мәтінді телефон жазбаларына бір рет жазып, полиспен бірге жіберіп отырыңыз. Ол әдейі қысқа: стресс кезінде ұзақ мәтінді оқымайды.' },
    { t:'formula',
      ru:'ЕСЛИ АВАРИЯ:\n1. Остановиться, не уезжать\n2. Аварийка и знак\n3. Есть пострадавшие — скорая\n4. Вызвать полицию\n5. Снять всё на телефон до того, как сдвинули машины\n6. Записать данные и полис второго участника\n7. Позвонить в страховую и мне',
      kk:'ЕГЕР АПАТ БОЛСА:\n1. Тоқтау, кетпеу\n2. Апаттық сигнал және белгі\n3. Зардап шеккендер болса — жедел жәрдем\n4. Полиция шақыру\n5. Көліктерді жылжытқанға дейін бәрін телефонға түсіру\n6. Екінші қатысушының деректері мен полисін жазып алу\n7. Сақтандырушыға және маған қоңырау шалу' },
    { t:'note',
      ru:'Эта памятка — самая частая причина, по которой клиенты рекомендуют помощника знакомым. Не потому, что она гениальная, а потому что о ней вспоминают в тот момент, когда человеку страшно и он один на дороге.',
      kk:'Бұл жаднама — клиенттердің көмекшіні таныстарына ұсынуының ең жиі себебі. Ол керемет болғандықтан емес, адам қорқып, жолда жалғыз тұрған сәтте есіне түскендіктен.' }
  ],
  quiz:[
    { q:{ ru:'Клиент слегка задел чужую машину на парковке, хозяина рядом нет. Что посоветовать?', kk:'Клиент тұрақта өзге көлікке аздап соғып кетті, иесі жоқ. Не кеңес беру керек?' },
      opts:{ ru:['Уехать, ущерб мелкий','Оставить записку, всё сфотографировать и вызвать полицию','Дождаться хозяина и договориться наличными','Написать в страховую через неделю'], kk:['Кетіп қалу, зиян ұсақ','Хабарлама қалдырып, бәрін суретке түсіріп, полиция шақыру','Иесін күтіп, қолма-қол ақшамен келісу','Бір аптадан кейін сақтандырушыға жазу'] },
      correct:1,
      why:{ ru:'Оставление места ДТП — самостоятельное и гораздо более тяжёлое нарушение, чем сама царапина. Ущерб от зеркала покроет ОГПО, а последствия отъезда не покроет ничто.', kk:'ЖКО орнын тастап кету — сызаттың өзінен әлдеқайда ауыр, дербес бұзушылық. Айнаның зиянын ОГПО өтейді, ал кетіп қалудың салдарын ештеңе өтемейді.' } },
    { q:{ ru:'В какую страховую компанию обращается пострадавший за выплатой?', kk:'Зардап шеккен төлем үшін қай сақтандыру компаниясына жүгінеді?' },
      opts:{ ru:['В свою','В страховую компанию виновника','В любую','В ту, где дешевле'], kk:['Өзінің компаниясына','Кінәлінің сақтандыру компаниясына','Кез келгеніне','Қайсысы арзан болса, соған'] },
      correct:1,
      why:{ ru:'ОГПО — страхование ответственности виновника, поэтому платит его компания. Вот почему на месте аварии обязательно записывают название страховой и номер полиса второго участника.', kk:'ОГПО — кінәлінің жауапкершілігін сақтандыру, сондықтан оның компаниясы төлейді. Апат орнында екінші қатысушының сақтандырушысының атауы мен полис нөмірін міндетті түрде жазып алудың себебі осы.' } },
    { q:{ ru:'За рулём был человек, не вписанный в полис, и он стал виновником аварии. Что произойдёт?', kk:'Рөлде полиске жазылмаған адам отырды және ол апатқа кінәлі болды. Не болады?' },
      opts:{ ru:['Пострадавшему никто не заплатит','Страховая заплатит пострадавшему, а затем потребует эти деньги с виновника','Полис просто аннулируют','Заплатит страховая пострадавшего'], kk:['Зардап шеккенге ешкім төлемейді','Сақтандырушы зардап шеккенге төлейді, содан кейін бұл ақшаны кінәліден талап етеді','Полис жай ғана жойылады','Зардап шеккеннің сақтандырушысы төлейді'] },
      correct:1,
      why:{ ru:'Закон защищает пострадавшего, поэтому выплата идёт. Но страховая имеет право взыскать выплаченное с того, кто вёл машину без права на это. Экономия на вписанном водителе оборачивается долгом.', kk:'Заң зардап шеккенді қорғайды, сондықтан төлем жүреді. Бірақ сақтандырушының көлікті құқығы жоқ күйде жүргізген адамнан төленген ақшаны өндіріп алуға құқығы бар. Жазылған жүргізушіге үнемдеу қарызға айналады.' } },
    { q:{ ru:'Почему первый звонок в страховую нужно делать прямо с места аварии?', kk:'Сақтандырушыға бірінші қоңырауды неге дәл апат болған жерден шалу керек?' },
      opts:{ ru:['Так принято','Есть установленный срок уведомления, при его пропуске возможен отказ или снижение выплаты','Чтобы страховая приехала','Чтобы полиция не выписала штраф'], kk:['Солай қабылданған','Хабарлаудың белгіленген мерзімі бар, оны өткізіп алса, бас тарту немесе төлемді азайту мүмкін','Сақтандырушы келуі үшін','Полиция айыппұл жазбауы үшін'] },
      correct:1,
      why:{ ru:'Срок уведомления установлен законом и договором и обычно составляет несколько рабочих дней. Звонок с места аварии закрывает этот вопрос сразу, пока человек не забыл в суете.', kk:'Хабарлау мерзімі заң мен шартта белгіленген және әдетте бірнеше жұмыс күнін құрайды. Апат орнынан шалынған қоңырау адам аласапыранда ұмытып кетпей тұрып, бұл мәселені бірден жабады.' } },
    { q:{ ru:'Как правильно ответить клиенту, который спрашивает точный размер штрафа за отсутствие полиса?', kk:'Полистің болмағаны үшін айыппұлдың нақты мөлшерін сұраған клиентке қалай дұрыс жауап беру керек?' },
