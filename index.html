  scripts:[
    { q:{ ru:'Я попала в аварию, что мне делать?!', kk:'Мен апатқа ұшырадым, не істеуім керек?!' },
      a:{ ru:'Так, спокойно. Вы живы, всё остальное решаемо. Первое: вы стоите на месте, никуда не отъезжайте. Второе: включите аварийку и поставьте знак. Третье: люди целы? Если кому-то плохо — сразу вызывайте скорую. Дальше вызывайте полицию и, пока едут, снимайте на телефон машины со всех сторон и оба номера. Я на связи, никуда не уйду.',
        kk:'Жақсы, сабыр сақтаңыз. Сіз амансыз, қалғанының бәрі шешіледі. Біріншісі: тұрған жеріңізде тұрыңыз, ешқайда жылжымаңыз. Екіншісі: апаттық сигналды қосып, белгіні қойыңыз. Үшіншісі: адамдар аман ба? Біреуге жаман болса — бірден жедел жәрдем шақырыңыз. Одан кейін полиция шақырыңыз, олар келгенше көліктерді жан-жағынан және екі нөмірді телефонға түсіріңіз. Мен байланыстамын, ешқайда кетпеймін.' } },

        kk:'Келіспеңізші. Полициядан алынған құжаттарсыз сақтандырушы кімнің кінәлі екенін анықтай алмайды, төлем де болмайды. Ал ол кейін ойын өзгертіп, сіз кетіп қалдыңыз десе, кері дәлелдеу өте қиын болады. Қызметкерлерді күтіңіз, бұл уақыт алады, бірақ сізді қорғайды. Ол қысым жасаса — сақтандыру көмекшім солай деді деп қана айтыңыз.' } },

      a:{ ru:'Штраф установлен в МРП, а МРП меняется каждый год, поэтому точную сумму я вам сейчас проверю, чтобы не сказать устаревшую цифру. Но важнее другое: штраф вы платите каждый раз, когда вас остановили, а полис — один раз в год. И если случится авария, без полиса чужой ремонт вы оплачиваете полностью сами.',

    { q:{ ru:'В меня въехали, а у виновника нет страховки. Что теперь?', kk:'Маған соғып кетті, ал кінәліде сақтандыру жоқ. Енді не болады?' },
      a:{ ru:'Плохая новость: страховой компании, которая бы заплатила, у него нет. Хорошая: ваше право на возмещение никуда не делось, ущерб взыскивается с виновника лично, через требование и при необходимости через суд. Обязательно возьмите в полиции документы о происшествии и сохраните все фотографии — это ваша доказательная база. Дальше вам понадобится юрист, и это уже не моя часть работы, но я подскажу, куда обратиться.',
        kk:'Жаман жаңалық: төлейтін сақтандыру компаниясы онда жоқ. Жақсы жаңалық: өтем алу құқығыңыз еш жерге кеткен жоқ, зиян кінәліден жеке, талап арқылы, қажет болса сот арқылы өндіріледі. Полициядан оқиға туралы құжаттарды міндетті түрде алыңыз және барлық фотосуретті сақтаңыз — бұл сіздің дәлелдемелік базаңыз. Әрі қарай сізге заңгер керек болады, бұл менің жұмысымның бөлігі емес, бірақ қайда жүгінуді айтып беремін.' } }

      kk:'Агент сақтандыру ұйымымен жасалған тапсырма шарты негізінде жұмыс істейді. Бұл — сіз қол қоятын ресми құжат. Онда қандай өнімдерді рәсімдей алатыныңыз, қандай сыйақы алатыныңыз, қалай есеп беретініңіз және сізге не істеуге болмайтыны жазылады.' },

    { t:'steps',
      ru:[
        '**Выбрать компанию.** Посмотрите, какие страховые работают в вашем регионе и у каких есть удобное приложение и агентский кабинет. Позвоните в две-три и спросите про условия для агентов. Это обычный звонок, вас никто не будет отговаривать — компаниям нужны агенты.',
        '**Пройти обучение.** Компании обучают будущих агентов бесплатно, это в их интересах. Обучение обычно короткое, часто онлайн, с итоговой проверкой знаний. По его результатам выдают свидетельство или сертификат.',
        '**Подписать договор поручения.** Внимательно прочитайте раздел про вознаграждение и про порядок расчётов. Не стесняйтесь спрашивать — нормальная компания объясняет спокойно.',
        '**Попасть в реестр агентов компании.** Страховая ведёт учёт своих агентов. После включения в реестр вы официально можете работать от её имени.',
        '**Получить доступ в агентский кабинет.** Это ваш рабочий инструмент: там вы считаете, оформляете и видите свои начисления.',
        '**Оформить первый полис.** Начните с семьи или соседей — с тех, кому не страшно сказать «я делаю это впервые, поэтому проверю всё дважды».'
      ],
      kk:[
        '**Компанияны таңдау.** Өңіріңізде қандай сақтандырушылар жұмыс істейтінін, қайсысында ыңғайлы қосымша және агенттік кабинет бар екенін қараңыз. Екі-үшеуіне қоңырау шалып, агенттерге қойылатын шарттарды сұраңыз. Бұл — қарапайым қоңырау, сізді ешкім бас тартқызбайды — компанияларға агенттер керек.',
        '**Оқудан өту.** Компаниялар болашақ агенттерді тегін оқытады, бұл олардың мүддесіне сай. Оқу әдетте қысқа, көбіне онлайн, соңында білім тексерілуімен өтеді. Нәтижесі бойынша куәлік немесе сертификат беріледі.',
        '**Тапсырма шартына қол қою.** Сыйақы және есеп айырысу тәртібі туралы бөлімді мұқият оқыңыз. Сұрақ қоюдан именбеңіз — қалыпты компания байсалды түсіндіреді.',
        '**Компанияның агенттер тізіліміне ену.** Сақтандырушы өз агенттерінің есебін жүргізеді. Тізілімге енгеннен кейін оның атынан ресми жұмыс істей аласыз.',
        '**Агенттік кабинетке қолжетімділік алу.** Бұл — сіздің жұмыс құралыңыз: онда есептейсіз, рәсімдейсіз және есептелген сыйақыңызды көресіз.',
        '**Бірінші полисті рәсімдеу.** Отбасыдан немесе көршілерден бастаңыз — «мен мұны алғаш рет жасап тұрмын, сондықтан бәрін екі рет тексеремін» деп айтуға қорықпайтын адамдардан.'
      ] },
    { t:'check',
      ru:'Конкретные требования к агентам, программа и продолжительность обучения, форма свидетельства и порядок включения в реестр устанавливаются законодательством о страховой деятельности и внутренними правилами компании. Уточняйте их в самой компании — там дадут актуальный список документов.',
      kk:'Агенттерге қойылатын нақты талаптар, оқу бағдарламасы мен ұзақтығы, куәлік нысаны және тізілімге енгізу тәртібі сақтандыру қызметі туралы заңнамамен және компанияның ішкі ережелерімен белгіленеді. Оларды компанияның өзінен нақтылаңыз — онда құжаттардың өзекті тізімін береді.' },

    { t:'h', ru:'Откуда берутся деньги', kk:'Ақша қайдан келеді' },
    { t:'p',
      ru:'Агент получает комиссионное вознаграждение — процент от страховой премии, которую заплатил клиент. Клиент при этом не платит вам ничего сверху: комиссия идёт из той же суммы, которую он в любом случае отдал бы страховой компании. Это важно проговаривать вслух, потому что люди часто думают, что через агента дороже.',
      kk:'Агент комиссиялық сыйақы алады — клиент төлеген сақтандыру сыйлықақысының пайызын. Клиент бұл кезде сізге үстінен ештеңе төлемейді: комиссия ол қалай болғанда да сақтандыру компаниясына беретін сол сомадан шығады. Мұны дауыстап айтып отыру маңызды, өйткені адамдар агент арқылы қымбат деп жиі ойлайды.' },
    { t:'p',
      ru:'Размер комиссии зависит от продукта и от компании. По обязательным видам страхования он ограничен нормативами регулятора, по добровольным — обычно выше, потому что там компания свободнее в тарифах. Поэтому у опытных агентов доход от КАСКО и других добровольных продуктов часто больше, чем от ОГПО, хотя ОГПО оформляют чаще.',
      kk:'Комиссияның мөлшері өнімге және компанияға байланысты. Міндетті сақтандыру түрлері бойынша ол реттеушінің нормативтерімен шектелген, ерікті түрлер бойынша — әдетте жоғарырақ, өйткені онда компания тарифте еркінірек. Сондықтан тәжірибелі агенттерде КАСКО және басқа ерікті өнімдерден түсетін табыс ОГПО-дан гөрі жиі көбірек болады, ОГПО жиірек рәсімделсе де.' },
    { t:'check',
      ru:'Точный процент комиссии по каждому продукту спрашивайте в компании до подписания договора и просите показать, где это написано. Предельные размеры комиссионного вознаграждения по обязательным видам устанавливаются нормативными актами и могут пересматриваться.',
      kk:'Әр өнім бойынша комиссияның нақты пайызын шартқа қол қояр алдында компаниядан сұраңыз және оның қайда жазылғанын көрсетуін өтініңіз. Міндетті түрлер бойынша комиссиялық сыйақының шекті мөлшері нормативтік актілермен белгіленеді және қайта қаралуы мүмкін.' },
    { t:'example',
      ru:'Посчитайте на пальцах, не заглядывая в чужие обещания. Возьмите среднюю стоимость полиса в вашем регионе, умножьте на процент комиссии, который назвала компания, и умножьте на количество полисов, которые вы реально успеете оформить за месяц. Не на желаемое, а на реальное: с детьми дома это, скорее всего, два-три полиса в первую неделю и больше — когда появится поток. Эта цифра честнее любых рекламных обещаний.',
      kk:'Өзгенің уәделеріне қарамай, саусақпен санап көріңіз. Өңіріңіздегі полистің орташа құнын алыңыз, компания айтқан комиссия пайызына көбейтіңіз және бір айда шынымен рәсімдеп үлгеретін полис санына көбейтіңіз. Қалағаныңызға емес, шындығына: балалар үйде болғанда бұл алғашқы аптада екі-үш полис, ағын пайда болғанда — көбірек. Бұл сан кез келген жарнамалық уәдеден шыншыл.' },

      kk:'Сізде кеңсе де, маңдайша да жоқ, бұл — мәселе емес. Сізде кеңседе жоқ нәрсе бар: сізге жеке сенетін адамдар. Сақтандыру жарнама арқылы емес, сенім арқылы сатылады.' },

    { t:'note',

    { t:'h', ru:'Что дальше', kk:'Одан әрі не болады' },
    { t:'p',
      ru:'Автострахование — самая понятная и самая массовая точка входа: машина есть почти в каждой семье, полис нужен ежегодно, клиент возвращается сам. Но человек, который пришёл к вам за полисом, часто задаёт следующий вопрос: а со штрафами поможете? А что делать с долгами? А как открыть ИП? Именно поэтому в курсе есть ещё три модуля.',
      kk:'Автосақтандыру — ең түсінікті әрі ең жаппай кіру нүктесі: көлік әр отбасында дерлік бар, полис жыл сайын керек, клиент өзі оралады. Бірақ сізге полиске келген адам көбіне келесі сұрақты қояды: айыппұлдарға көмектесесіз бе? Қарыздарды не істеу керек? ЖК қалай ашуға болады? Курста тағы үш модуль болуының себебі осы.' },
    { t:'p',

  quiz:[
    { q:{ ru:'На основании какого документа работает страховой агент?', kk:'Сақтандыру агенті қандай құжат негізінде жұмыс істейді?' },
      opts:{ ru:['Трудового договора со страховой','Договора поручения со страховой организацией','Лицензии, выданной государством лично агенту','Свидетельства ИП, без договора'], kk:['Сақтандырушымен жасалған еңбек шарты','Сақтандыру ұйымымен жасалған тапсырма шарты','Мемлекет агентке жеке берген лицензия','Шартсыз, ЖК куәлігі'] },
      correct:1,
      why:{ ru:'Агент действует по поручению страховой компании на основании договора поручения. Это не трудовой договор: у вас нет оклада и графика, но нет и начальника — вы работаете на себя.', kk:'Агент сақтандыру компаниясының тапсырмасы бойынша, тапсырма шарты негізінде әрекет етеді. Бұл — еңбек шарты емес: сізде жалақы да, кесте де жоқ, бірақ бастық та жоқ — өзіңізге жұмыс істейсіз.' } },
    { q:{ ru:'Клиент спрашивает, не дороже ли оформлять через агента. Что верно?', kk:'Клиент агент арқылы рәсімдеу қымбат емес пе деп сұрайды. Не дұрыс?' },

  scripts:[
    { q:{ ru:'А через вас не дороже получится?', kk:'Сіз арқылы қымбат болып кетпей ме?' },

        kk:'Жоқ, баға дәл сол. Міндетті сақтандыру бойынша ол мемлекеттік формула бойынша есептеледі және барлық жерде бірдей, мен оған әсер ете алмаймын. Менің сыйақымды сақтандыру компаниясы сол сомадан төлейді, сіз үстінен төлемейсіз. Сіз дәл соны аласыз, тек сауалнаманы түсінудің және полисті базадан тексерудің қажеті жоқ — мұны мен жасаймын.' } },

      a:{ ru:'Конечно, посчитаю бесплатно и без всяких условий. Пришлите документы, я скажу сумму и объясню, из чего она сложилась. Оформите вы у меня или нет — ваше дело. Скажите только, когда у вас заканчивается текущий полис, я напомню вам за месяц, чтобы вы не остались без страховки случайно.',

    { q:{ ru:'А вы вообще кто по образованию? Юрист?', kk:'Сіз мамандығыңыз бойынша кімсіз? Заңгерсіз бе?' },

        kk:'Жоқ, мен заңгер емеспін және өзімді солай көрсетпеймін. Мен — сақтандыру көмекшісімін: компанияда оқудан өттім, шарт бойынша жұмыс істеймін, полистерді рәсімдеймін және әрекет тәртібін түсіндіремін. Заңгер қажет жерде — мысалы, апатқа кінәлімен сотта — мен бұны шыншыл айтып, қайда жүгінуді айтамын. Менің күшті жағым — сіздің жағдайыңызды қадаммен талдап, ештеңені ұмытпайтындығым.' } },

        kk:'Міндетті сақтандыру бойынша жеңілдік ешкімде жоқ — баға мемлекеттің формуласы бойынша есептеледі. Бірақ мен шынымен ақша үнемдейтін нәрсені жасай аламын: өтіліңіздің дұрыс есептелгенін тексеремін, артық жүргізушінің кесірінен есептеу асып кетпегенін қараймын және сізге жеңілдік тиесілі емес пе, соны нақтылаймын. Кейде осылай айтарлықтай сома табылады.' } }

    { t:'p',
      ru:'Штрафы — самая частая причина, по которой к помощнику приходят люди. И самая опасная тема для новичка, потому что вокруг неё больше всего слухов: «можно стереть», «можно договориться», «через год само сгорит». Часть этих слухов — правда, но не та, которую люди себе представляют. Наша задача за этот модуль — разложить всё по полкам и научиться отвечать точно.',
      kk:'Айыппұл — адамдардың көмекшіге келуінің ең жиі себебі. Әрі жаңадан бастаушы үшін ең қауіпті тақырып, өйткені оның төңірегінде қауесет көп: «өшіріп тастауға болады», «келісуге болады», «бір жылдан кейін өзі жанып кетеді». Бұл қауесеттердің бір бөлігі — рас, бірақ адамдар елестеткендей емес. Осы модульдегі міндетіміз — бәрін сөреге қойып, дәл жауап беруді үйрену.' },
    { t:'term', abbr:'ПДД',
      ru:'правила дорожного движения. Свод правил, за нарушение которых и выписывают штрафы: скорость, разметка, ремень, телефон, парковка и всё остальное.',
      kk:'жол қозғалысы ережелері (ЖҚЕ). Бұзғаны үшін айыппұл салынатын ережелер жинағы: жылдамдық, таңба, белдік, телефон, тұрақ және қалғанының бәрі.' },
    { t:'term', abbr:'КоАП',
      ru:'Кодекс Республики Казахстан об административных правонарушениях. Главный документ по нашей теме: в нём написано, за что штрафуют, в каком размере, как обжаловать и что происходит, если не платить.',
      kk:'Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексі (ӘҚБтК). Тақырыбымыз бойынша басты құжат: онда не үшін айыппұл салынатыны, мөлшері қандай екені, қалай шағымдану керектігі және төлемесе не болатыны жазылған.' },

    { t:'h', ru:'Как рождается штраф: путь от нарушения до долга', kk:'Айыппұл қалай туады: бұзушылықтан қарызға дейінгі жол' },
    { t:'steps',
      ru:[
        '**Нарушение.** Человек превысил скорость, проехал на красный, встал под знаком. Это просто событие, штрафа ещё нет.',
        '**Фиксация.** Нарушение фиксирует инспектор на дороге или камера автоматически. Это тоже ещё не штраф.',
        '**Постановление.** Уполномоченный орган выносит постановление по делу об административном правонарушении. Вот теперь штраф появился как документ, и у него есть номер и дата.',
        '**Вручение или направление копии.** Человеку вручают копию постановления на месте либо направляют её — по почте, в личный кабинет, в приложение. С этого дня пошёл отсчёт срока на обжалование.',
        '**Срок на обжалование.** У человека есть десять суток со дня вручения копии, чтобы подать жалобу.',
        '**Вступление в законную силу.** Если жалобу не подали и срок прошёл — постановление вступает в силу. Это самая важная дата во всём модуле, запомните её.',
        '**Срок на добровольную уплату.** После вступления в силу закон даёт тридцать суток, чтобы заплатить самому.',
        '**Принудительное исполнение.** Не заплатил — дело уходит к судебному исполнителю, и начинается совсем другая история. О ней отдельный урок.'
      ],
      kk:[
        '**Бұзушылық.** Адам жылдамдықтан асты, қызыл жарықпен өтті, белгінің астына тұрды. Бұл — жай оқиға, айыппұл әлі жоқ.',
        '**Тіркеу.** Бұзушылықты жолдағы инспектор немесе камера автоматты түрде тіркейді. Бұл да әлі айыппұл емес.',
        '**Қаулы.** Уәкілетті орган әкімшілік құқық бұзушылық туралы іс бойынша қаулы шығарады. Міне, енді айыппұл құжат ретінде пайда болды, оның нөмірі мен күні бар.',
        '**Көшірмені тапсыру немесе жіберу.** Адамға қаулының көшірмесін орнында тапсырады не жібереді — пошта арқылы, жеке кабинетке, қосымшаға. Осы күннен бастап шағымдану мерзімі басталды.',
        '**Шағымдану мерзімі.** Адамда шағым беру үшін көшірме тапсырылған күннен бастап он тәулік бар.',
        '**Заңды күшіне енуі.** Шағым берілмесе және мерзім өтсе — қаулы күшіне енеді. Бұл — бүкіл модульдегі ең маңызды күн, оны есте сақтаңыз.',
        '**Ерікті түрде төлеу мерзімі.** Күшіне енгеннен кейін заң өзі төлеуге отыз тәулік береді.',
        '**Мәжбүрлеп орындау.** Төлемесе — іс сот орындаушысына кетеді, сонда мүлдем басқа әңгіме басталады. Ол туралы бөлек сабақ бар.'
      ] },
    { t:'note',
      ru:'В любом штрафе есть три разные даты, и люди их постоянно смешивают: дата нарушения, дата вынесения постановления и дата вступления постановления в силу. Почти все сроки в законе считаются от третьей. Приучите себя спрашивать именно её.',
      kk:'Кез келген айыппұлда үш бөлек күн бар, адамдар оларды үнемі шатастырады: бұзушылық күні, қаулы шығарылған күн және қаулының күшіне енген күні. Заңдағы мерзімдердің барлығы дерлік үшіншісінен есептеледі. Дәл соны сұрауды әдетке айналдырыңыз.' },
    { t:'example',
      ru:'Камера сняла превышение 3 марта. Постановление вынесли 12 марта. Копию человек получил 18 марта. Значит, десять суток на обжалование идут от 18 марта, а в силу постановление вступит примерно в конце марта. И вот от этой последней даты, а не от 3 марта, считаются и тридцать суток на оплату, и годичный срок, о котором мы поговорим в шестом уроке.',
      kk:'Камера жылдамдықтан асқанды 3 наурызда түсірді. Қаулы 12 наурызда шығарылды. Көшірмені адам 18 наурызда алды. Демек, шағымдануға берілген он тәулік 18 наурыздан басталады, ал қаулы наурыз соңында күшіне енеді. Міне, төлеуге берілген отыз тәулік те, алтыншы сабақта әңгімелейтін бір жылдық мерзім де 3 наурыздан емес, дәл осы соңғы күннен есептеледі.' },

    { t:'h', ru:'Почему суммы штрафов всё время разные', kk:'Айыппұл сомалары неге әрдайым әртүрлі' },
    { t:'term', abbr:'МРП',
      ru:'месячный расчётный показатель. Штрафы в КоАП записаны не в тенге, а в МРП, а размер МРП государство утверждает каждый год. Поэтому за одно и то же нарушение в разные годы платят разные суммы.',
      kk:'айлық есептік көрсеткіш (АЕК). ӘҚБтК-де айыппұлдар теңгемен емес, АЕК-пен жазылған, ал АЕК мөлшерін мемлекет жыл сайын бекітеді. Сондықтан бір бұзушылық үшін әр жылы әртүрлі сома төленеді.' },
    { t:'check',
      ru:'Никогда не называйте сумму штрафа по памяти и не берите её из старых постов в социальных сетях. Открывайте карточку конкретного штрафа на egov.kz или в приложении банка — там указана точная сумма именно по этому постановлению.',
      kk:'Айыппұл сомасын ешқашан жадыңыздан айтпаңыз және оны әлеуметтік желідегі ескі жазбалардан алмаңыз. Нақты айыппұлдың карточкасын egov.kz сайтынан немесе банк қосымшасынан ашыңыз — онда дәл осы қаулы бойынша нақты сома көрсетілген.' },

    { t:'h', ru:'Три законных механизма — карта всего модуля', kk:'Үш заңды тетік — бүкіл модульдің картасы' },
    { t:'p',
      ru:'Дальше весь модуль строится вокруг трёх разных вещей. Их постоянно путают между собой, и именно из этой путаницы рождаются обещания, за которые помощники потом получают проблемы. Разведите их у себя в голове раз и навсегда.',
      kk:'Әрі қарай бүкіл модуль үш бөлек нәрсенің төңірегінде құрылады. Оларды үнемі бір-бірімен шатастырады, дәл осы шатасудан кейін көмекшілер қиындыққа тап болатын уәделер туады. Оларды басыңызда бір жолата ажыратып алыңыз.' },

          ['Шағымдану','Айыппұл заңсыз немесе қателесіп салынған','Қаулыны мүлдем жою'],

    { t:'p',
      ru:'Обратите внимание: механизмы работают в разных ситуациях и не заменяют друг друга. Обжалование — про «штраф незаконный». Давность — про «штраф законный, но время ушло». Если перепутать, вы дадите клиенту совет, который ему навредит: например, посоветуете ждать год там, где надо было подавать жалобу в десять суток.',
      kk:'Назар аударыңыз: тетіктер әртүрлі жағдайда жұмыс істейді және бірін-бірі алмастырмайды. Шағымдану — «айыппұл заңсыз» дегені. Мерзімнің өтуі — «айыппұл заңды, бірақ уақыт кетті» дегені. Шатастырсаңыз, клиентке зиян келтіретін кеңес бересіз: мысалы, он тәулікте шағым беру керек жерде бір жыл күтуге кеңес бересіз.' },
    { t:'warn',
      ru:'Четвёртого механизма не существует. Нельзя «удалить» штраф из базы, нельзя «договориться, чтобы убрали», нельзя «стереть по знакомству». Любой, кто обещает такое за деньги, либо мошенник, либо предлагает вам совершить преступление. Помощник, который повторит это обещание клиенту, отвечает уже сам.',
      kk:'Төртінші тетік жоқ. Айыппұлды базадан «өшіруге» болмайды, «алып тастауға келісуге» болмайды, «таныстық арқылы жоюға» болмайды. Мұны ақшаға уәде ететін кез келген адам не алаяқ, не сізге қылмыс жасауды ұсынып тұр. Бұл уәдені клиентке қайталаған көмекші өзі жауап береді.' },
    { t:'p',
      ru:'Что вы законно можете предложить человеку прямо сегодня: проверить все штрафы по его номеру, объяснить, какие даты у каждого, посчитать, попадает ли он под скидку, посмотреть, не пора ли обжаловать, и проверить по реестру, не ушло ли дело к судебному исполнителю. Этого достаточно, чтобы быть очень полезной. И этого никто, кроме вас, за клиента не сделает.',
      kk:'Адамға дәл бүгін заңды түрде не ұсына аласыз: нөмірі бойынша барлық айыппұлын тексеру, әрқайсысының күндерін түсіндіру, жеңілдікке ілігетінін есептеу, шағымдану уақыты келмегенін қарау және іс сот орындаушысына кетпегенін тізілімнен тексеру. Өте пайдалы болу үшін осы жеткілікті. Ал мұны клиент үшін сізден басқа ешкім жасамайды.' }

  quiz:[
    { q:{ ru:'От какой даты в законе считается большинство сроков по штрафу?', kk:'Айыппұл бойынша заңдағы мерзімдердің көбі қай күннен есептеледі?' },

      correct:2,
      why:{ ru:'Дата нарушения и дата постановления — промежуточные. Ключевая дата, от которой считаются и тридцать суток на уплату, и годичный срок давности исполнения, — день вступления постановления в законную силу. Приучитесь спрашивать именно её.', kk:'Бұзушылық күні мен қаулы күні — аралық күндер. Төлеуге берілген отыз тәулік те, орындау мерзімінің бір жылы да есептелетін негізгі күн — қаулының заңды күшіне енген күні. Дәл соны сұрауды әдетке айналдырыңыз.' } },
    { q:{ ru:'Сколько суток даётся на обжалование постановления со дня вручения его копии?', kk:'Қаулының көшірмесі тапсырылған күннен бастап шағымдануға қанша тәулік беріледі?' },
      opts:{ ru:['Трое суток','Десять суток','Тридцать суток','Один год'], kk:['Үш тәулік','Он тәулік','Отыз тәулік','Бір жыл'] },
      correct:1,
      why:{ ru:'Десять суток со дня вручения копии постановления. Это очень короткий срок, и именно поэтому вопрос «когда вам вручили копию» надо задавать первым, ещё до всех остальных.', kk:'Қаулының көшірмесі тапсырылған күннен бастап он тәулік. Бұл — өте қысқа мерзім, сондықтан «көшірмені сізге қашан тапсырды» деген сұрақты бәрінен бұрын, бірінші қою керек.' } },
    { q:{ ru:'Клиент говорит: «Мне обещали за деньги удалить штраф из базы». Что это?', kk:'Клиент: «Маған ақшаға айыппұлды базадан өшіріп берем деді» дейді. Бұл не?' },
      opts:{ ru:['Законная услуга помощника','Мошенничество либо предложение совершить преступление','Обычная практика','Ускоренное обжалование'], kk:['Көмекшінің заңды қызметі','Алаяқтық немесе қылмыс жасауды ұсыну','Әдеттегі тәжірибе','Жеделдетілген шағымдану'] },
      correct:1,
      why:{ ru:'Законных механизмов ровно три: оплата, обжалование и истечение срока давности исполнения. Никакого «удаления из базы» среди них нет. Помощник, повторивший такое обещание, отвечает наравне с тем, кто его придумал.', kk:'Заңды тетік дәл үшеу: төлеу, шағымдану және орындау мерзімінің өтуі. Олардың арасында ешқандай «базадан өшіру» жоқ. Мұндай уәдені қайталаған көмекші оны ойлап тапқанмен бірдей жауап береді.' } },
    { q:{ ru:'Почему за одно и то же нарушение в разные годы платят разные суммы?', kk:'Бір бұзушылық үшін әр жылы неге әртүрлі сома төленеді?' },

      kk:'Egov неге банк қосымшаларынан маңызды: мұнда сіз соманы ғана емес, қаулының деректемелерін де көресіз — нөмірін, күнін, ӘҚБтК бабын. Дәл осы деректер шағымдануға да, мерзімнің өтуі туралы әңгімеге де қажет. Банк «қанша төлеу керегін» көрсетеді, ал egov «бұл жалпы қандай айыппұл екенін» көрсетеді.' },
    { t:'note',
      ru:'Для простой проверки штрафов регистрация и электронная подпись обычно не нужны — сервис работает по номеру. Подпись понадобится позже, когда дело дойдёт до подачи жалобы или заявлений. Об этом отдельно в пятом уроке.',
      kk:'Айыппұлды қарапайым тексеру үшін тіркелу де, электрондық қолтаңба да әдетте қажет емес — сервис нөмір бойынша жұмыс істейді. Қолтаңба кейінірек, шағым немесе өтініш беруге келгенде керек болады. Ол туралы бесінші сабақта бөлек айтылады.' },

    { t:'h', ru:'Источник второй: реестр должников и исполнительных производств', kk:'Екінші дереккөз: борышкерлер мен атқарушылық іс жүргізулер тізілімі' },
    { t:'p',
      ru:'Это отдельная база, и она отвечает на совсем другой вопрос. Сервис проверки штрафов говорит: «есть неоплаченное постановление». Реестр должников и исполнительных производств говорит: «по этому долгу уже возбуждено исполнительное производство, им занимается судебный исполнитель».',
      kk:'Бұл — бөлек база және ол мүлдем басқа сұраққа жауап береді. Айыппұлды тексеру сервисі: «төленбеген қаулы бар» дейді. Борышкерлер мен атқарушылық іс жүргізулер тізілімі: «бұл қарыз бойынша атқарушылық іс жүргізу қозғалған, онымен сот орындаушысы айналысады» дейді.' },
    { t:'p',
      ru:'Разница между этими двумя ответами определяет всё. Пока штраф просто висит неоплаченным — работают обычные правила, включая срок давности исполнения. Как только по нему заведено исполнительное производство, включается совсем другой закон и другие последствия. Именно поэтому проверка по реестру обязательна, а не по желанию.',
      kk:'Осы екі жауаптың айырмашылығы бәрін айқындайды. Айыппұл жай ғана төленбей тұрғанда — әдеттегі ережелер, оның ішінде орындау мерзімінің өтуі де жұмыс істейді. Ол бойынша атқарушылық іс жүргізу қозғалған бойда мүлдем басқа заң және басқа салдар қосылады. Дәл сондықтан тізілімнен тексеру қалауыңыз емес, міндет.' },
    { t:'list',
      ru:[
        'Реестр доступен через портал egov.kz и через сайт органов юстиции.',
        'Ищут в нём по ИИН должника.',
        'В карточке видно, есть ли производство, кто исполнитель — государственный или частный, и по какому долгу оно возбуждено.',
        'Там же обычно видны ограничения: например, временный запрет на выезд за пределы страны.'
      ],
      kk:[
        'Тізілім egov.kz порталы және әділет органдарының сайты арқылы қолжетімді.',
        'Онда борышкердің ЖСН бойынша іздейді.',
        'Карточкада іс жүргізудің бар-жоғы, орындаушының кім екені — мемлекеттік па, жеке ме — және қандай қарыз бойынша қозғалғаны көрінеді.',
        'Сол жерде әдетте шектеулер де көрінеді: мысалы, ел шегінен шығуға уақытша тыйым.'
      ] },
    { t:'example',
      ru:'Клиент собирается лететь с детьми на отдых и заранее просит проверить, всё ли в порядке. По штрафам у него чисто, а вот в реестре — открытое производство по старому долгу и ограничение на выезд. Помощник, который проверил оба источника, спас человеку отпуск. Помощник, который посмотрел только штрафы, сказал бы «всё чисто» — и семья узнала бы правду в аэропорту.',
      kk:'Клиент балаларымен демалысқа ұшпақ және бәрі дұрыс па деп алдын ала тексертеді. Айыппұлдары таза, ал тізілімде — ескі қарыз бойынша ашық іс жүргізу және шетке шығуға шектеу. Екі дереккөзді де тексерген көмекші адамның демалысын құтқарды. Тек айыппұлды қараған көмекші «бәрі таза» дер еді — ал отбасы шындықты әуежайда білер еді.' },
    { t:'note',
      ru:'Возьмите за правило проверять оба источника всегда, даже если клиент спросил только про штрафы. Это занимает лишние две минуты и регулярно спасает людей от очень неприятных сюрпризов.',
      kk:'Клиент тек айыппұл туралы сұраса да, екі дереккөзді де әрқашан тексеруді ереже етіп алыңыз. Бұл қосымша екі минут алады және адамдарды өте жағымсыз тосынсыйдан үнемі құтқарады.' },

    { t:'h', ru:'Источник третий: приложения банков', kk:'Үшінші дереккөз: банк қосымшалары' },
    { t:'p',
      ru:'Почти все крупные казахстанские банки показывают штрафы в своих приложениях — обычно в разделе платежей или государственных услуг. Это самый удобный способ для клиента: он видит список и платит в два касания.',
      kk:'Қазақстанның ірі банктерінің барлығы дерлік айыппұлдарды өз қосымшаларында көрсетеді — әдетте төлемдер немесе мемлекеттік қызметтер бөлімінде. Бұл — клиент үшін ең ыңғайлы тәсіл: ол тізімді көріп, екі рет басып төлейді.' },
    { t:'p',
      ru:'Но у банковских приложений есть два ограничения, о которых надо знать. Первое: они показывают не всегда всё и не всегда мгновенно — данные подтягиваются из государственных баз с задержкой. Второе: они обычно не показывают полные реквизиты постановления, а значит, для обжалования и разбора сроков вам всё равно понадобится egov.',
      kk:'Бірақ банк қосымшаларының білу керек екі шектеуі бар. Біріншісі: олар әрқашан бәрін және әрқашан бірден көрсетпейді — деректер мемлекеттік базалардан кешігіп тартылады. Екіншісі: олар әдетте қаулының толық деректемелерін көрсетпейді, демек, шағымдану және мерзімдерді талдау үшін сізге бәрібір egov керек.' },
    { t:'warn',
      ru:'Отсюда важное правило: «в приложении банка ничего нет» не означает «штрафов нет». Проверяйте на egov, прежде чем сказать клиенту, что он чист. Обратное тоже верно: свежеоплаченный штраф может ещё несколько дней висеть как неоплаченный. Не паникуйте и не заставляйте клиента платить дважды — сохраните чек и подождите.',
      kk:'Осыдан маңызды ереже туады: «банк қосымшасында ештеңе жоқ» дегені «айыппұл жоқ» дегенді білдірмейді. Клиентке таза екенін айтпас бұрын egov-тан тексеріңіз. Керісінше де солай: жаңа төленген айыппұл бірнеше күн бойы төленбеген болып тұруы мүмкін. Дүрлікпеңіз және клиентті екі рет төлеуге мәжбүрлемеңіз — чекті сақтап, күте тұрыңыз.' },

    { t:'h', ru:'Как читать карточку штрафа', kk:'Айыппұл карточкасын қалай оқу керек' },
    { t:'p',
      ru:'Открыв карточку, вы должны за минуту вытащить из неё пять вещей. Выпишите их сразу в заметку, потому что дальше весь разговор строится именно на них.',
      kk:'Карточканы ашқанда одан бір минутта бес нәрсені шығарып алуыңыз керек. Оларды бірден жазбаға түсіріңіз, өйткені әрі қарайғы бүкіл әңгіме дәл соларға құрылады.' },
    { t:'table',
      head:{ ru:['Что смотрим','Зачем это нужно'], kk:['Нені қараймыз','Бұл не үшін керек'] },

          ['ӘҚБтК бабы','Айыппұл нақты не үшін салынғанын және оның ауырлығын көрсетеді'],
          ['Сома','Жадтан емес, осы қаулы бойынша нақты сан'],

    { t:'p',
      ru:'Если в карточке нет прямого поля с датой вступления в силу, восстановите её по логике из первого урока: дата вручения копии плюс десять суток на обжалование. Если дата вручения неизвестна, так и скажите клиенту: «эту дату надо уточнить, без неё вывод будет гаданием».',
      kk:'Егер карточкада күшіне ену күні тікелей көрсетілмесе, оны бірінші сабақтағы логика бойынша қалпына келтіріңіз: көшірме тапсырылған күн плюс шағымдануға он тәулік. Тапсырылған күн белгісіз болса, клиентке солай айтыңыз: «бұл күнді нақтылау керек, онсыз қорытынды болжам болады».' },
    { t:'check',
      ru:'Названия разделов, набор полей и адреса сервисов периодически меняются. Не заучивайте путь по кнопкам — запомните, что именно вы ищете. Актуальный маршрут всегда есть в справке самого портала egov.kz.',
      kk:'Бөлім атаулары, өрістер жиынтығы және сервистердің мекенжайлары мезгіл-мезгіл өзгереді. Түймелер бойынша жолды жаттамаңыз — нақты нені іздеп жүргеніңізді есте сақтаңыз. Өзекті жол әрқашан egov.kz порталының анықтамасында болады.' },

    { t:'h', ru:'Личные данные: короткое, но важное', kk:'Дербес деректер: қысқа, бірақ маңызды' },
    { t:'p',
      ru:'Чтобы проверить штрафы, вам нужен ИИН клиента — это чувствительные данные. Просите их напрямую у самого человека, а не у родственников и не в общих чатах. Результат проверки отправляйте лично ему. Не публикуйте скриншоты чужих карточек нигде, даже без фамилии: по номеру машины человека узнают.',
      kk:'Айыппұлды тексеру үшін сізге клиенттің ЖСН қажет — бұл құпия дерек. Оны туыстарынан немесе ортақ чаттардан емес, адамның өзінен тікелей сұраңыз. Тексеру нәтижесін жеке өзіне жіберіңіз. Өзгенің карточкасының скриншотын ешқайда, тіпті тегісіз де жарияламаңыз: көлік нөмірі бойынша адамды таниды.' }
  ],
  quiz:[
    { q:{ ru:'Чем реестр должников и исполнительных производств отличается от обычной проверки штрафов?', kk:'Борышкерлер мен атқарушылық іс жүргізулер тізілімі әдеттегі айыппұл тексеруден несімен ерекшеленеді?' },
      opts:{ ru:['Ничем, это одно и то же','Он показывает, возбуждено ли по долгу исполнительное производство и кто им занимается','Он показывает только оплаченные штрафы','Он доступен только юристам'], kk:['Ештеңемен, бұл — бір нәрсе','Ол қарыз бойынша атқарушылық іс жүргізудің қозғалғанын және онымен кім айналысатынын көрсетеді','Ол тек төленген айыппұлдарды көрсетеді','Ол тек заңгерлерге қолжетімді'] },
      correct:1,
      why:{ ru:'Проверка штрафов отвечает на вопрос «есть ли неоплаченное постановление», а реестр — на вопрос «дошло ли дело до судебного исполнителя». Второй ответ меняет всю дальнейшую тактику, поэтому проверять надо оба источника.', kk:'Айыппұлды тексеру «төленбеген қаулы бар ма» деген сұраққа, ал тізілім «іс сот орындаушысына жетті ме» деген сұраққа жауап береді. Екінші жауап әрі қарайғы тактиканы толық өзгертеді, сондықтан екі дереккөзді де тексеру керек.' } },
    { q:{ ru:'В приложении банка у клиента штрафов не видно. Что можно сказать?', kk:'Клиенттің банк қосымшасында айыппұл көрінбейді. Не деуге болады?' },
      opts:{ ru:['Штрафов точно нет','Данные в банк подтягиваются с задержкой, нужно проверить на egov','Значит, они уже оплачены','Значит, они переданы судебному исполнителю'], kk:['Айыппұл нақты жоқ','Деректер банкке кешігіп түседі, egov-тан тексеру керек','Демек, олар төленіп қойған','Демек, олар сот орындаушысына берілген'] },
      correct:1,
      why:{ ru:'Банковское приложение удобно для оплаты, но это не первоисточник. Прежде чем сказать клиенту «вы чисты», проверьте на egov — иначе однажды ошибётесь именно там, где это дорого стоит.', kk:'Банк қосымшасы төлеуге ыңғайлы, бірақ ол — бастапқы дереккөз емес. Клиентке «сіз тазасыз» дер алдында egov-тан тексеріңіз — әйтпесе бір күні дәл қымбат тұратын жерде қателесесіз.' } },
    { q:{ ru:'Какое поле в карточке штрафа самое важное для дальнейшего разговора?', kk:'Айыппұл карточкасындағы қай өріс әрі қарайғы әңгіме үшін ең маңызды?' },
      opts:{ ru:['Сумма','Марка автомобиля','Дата вступления постановления в законную силу','Название органа'], kk:['Сома','Көлік маркасы','Қаулының заңды күшіне енген күні','Орган атауы'] },
      correct:2,
      why:{ ru:'От даты вступления в силу считаются и тридцать суток на добровольную уплату, и годичный срок давности исполнения. Без неё любой вывод о сроках — гадание.', kk:'Ерікті түрде төлеуге берілген отыз тәулік те, орындау мерзімінің бір жылы да күшіне ену күнінен есептеледі. Онсыз мерзімдер туралы кез келген қорытынды — болжам.' } },
    { q:{ ru:'Клиент оплатил штраф вчера, а сегодня он всё ещё висит как неоплаченный. Что делать?', kk:'Клиент айыппұлды кеше төледі, ал бүгін ол әлі төленбеген болып тұр. Не істеу керек?' },
      opts:{ ru:['Оплатить ещё раз','Сохранить чек и подождать: базы обновляются не мгновенно','Подать жалобу','Обратиться к судебному исполнителю'], kk:['Тағы бір рет төлеу','Чекті сақтап, күте тұру: базалар бірден жаңармайды','Шағым беру','Сот орындаушысына жүгіну'] },

      kk:'Жеңілдік қолданылмайтын баптардың тізбесі және оны қолданудың нақты тәртібі ӘҚБтК-де белгіленген және қайта қаралуы мүмкін. Нақты қаулы бойынша egov.kz сайтынан тексеріңіз: онда қазір қандай сома төленуге тиіс екені көрінеді.' },

    { t:'h', ru:'Как считать семь суток на практике', kk:'Жеті тәулікті іс жүзінде қалай санау керек' },
    { t:'p',
      ru:'В разговоре с клиентом считайте вслух и по календарю, а не в уме. Возьмите дату вручения копии, отметьте её в телефоне и отсчитайте семь дней вперёд. Полученную дату скажите клиенту словами и продублируйте сообщением: «оплатить нужно до такого-то числа включительно, иначе сумма удвоится».',
      kk:'Клиентпен әңгімеде ойша емес, дауыстап әрі күнтізбемен санаңыз. Көшірме тапсырылған күнді алып, оны телефонға белгілеңіз де, жеті күн алға санаңыз. Шыққан күнді клиентке сөзбен айтыңыз және хабарламамен қайталаңыз: «пәлен күнді қоса алғанда төлеу керек, әйтпесе сома екі есе өседі».' },
    { t:'steps',
      ru:[
        'Спросите: когда вам вручили или пришла копия постановления? Это единственная точка отсчёта.',
        'Если человек не помнит — ищите вместе: сообщение, письмо, уведомление в приложении, отметка в личном кабинете.',
        'Отсчитайте семь суток от этой даты и назовите последний день.',
        'Откройте карточку штрафа и проверьте, какая сумма указана к оплате сейчас. Если там уже полная — скидка истекла или не применяется к этой статье.',
        'Если срок ещё идёт — не откладывайте на завтра. Помогите оплатить сегодня, пока клиент рядом и настроен.'
      ],
      kk:[
        'Сұраңыз: қаулының көшірмесі сізге қашан тапсырылды немесе келді? Бұл — жалғыз бастау нүктесі.',
        'Адам есіне түсіре алмаса — бірге іздеңіз: хабарлама, хат, қосымшадағы ескерту, жеке кабинеттегі белгі.',
        'Осы күннен жеті тәулік санап, соңғы күнді атаңыз.',
        'Айыппұл карточкасын ашып, қазір қандай сома төленуге тиіс екенін тексеріңіз. Онда толық сома тұрса — жеңілдік бітті немесе бұл бапқа қолданылмайды.',
        'Мерзім әлі жүріп жатса — ертеңге қалдырмаңыз. Клиент қасыңызда әрі көңілі бар кезде бүгін төлеуге көмектесіңіз.'
      ] },

    { t:'h', ru:'Где оплатить', kk:'Қайда төлеуге болады' },
    { t:'list',
      ru:[
        'В приложении банка — самый быстрый путь, обычно в разделе платежей или государственных услуг.',
        'Через портал egov.kz — прямо из карточки штрафа.',
        'В отделении банка или через терминал — для тех, кому неудобно в приложении.'
      ],
      kk:[
        'Банк қосымшасында — ең жылдам жол, әдетте төлемдер немесе мемлекеттік қызметтер бөлімінде.',
        'egov.kz порталы арқылы — тікелей айыппұл карточкасынан.',
        'Банк бөлімшесінде немесе терминал арқылы — қосымшаны қолдану ыңғайсыз адамдар үшін.'
      ] },
    { t:'p',
      ru:'Способ оплаты не влияет на скидку. Влияет только дата: деньги должны уйти в течение семи суток. Поэтому если клиент собирается платить в отделении, напомните, что выходные тоже считаются, и лучше не тянуть до последнего дня.',
      kk:'Төлеу тәсілі жеңілдікке әсер етпейді. Тек күн әсер етеді: ақша жеті тәулік ішінде кетуі керек. Сондықтан клиент бөлімшеде төлемек болса, демалыс күндері де есептелетінін еске салыңыз және соңғы күнге дейін создырмаған жөн.' },
    { t:'warn',
      ru:'Чек — обязательно. Скажите клиенту сохранить его, сфотографировать и не удалять минимум год. Именно чек доказывает и факт, и дату оплаты, если в базе что-то не обновится или всплывёт дубль.',
      kk:'Чек — міндетті. Клиентке оны сақтауды, суретке түсіруді және кемінде бір жыл өшірмеуді айтыңыз. Базада бірдеңе жаңармаса немесе қайталама шықса, төлем фактісі мен күнін дәл сол чек дәлелдейді.' },

    { t:'h', ru:'Когда платить не стоит спешить', kk:'Қашан төлеуге асықпаған жөн' },
    { t:'p',
      ru:'Скидка — сильный аргумент, но не единственный. Есть две ситуации, где спешка вредит, и вы должны их узнавать.',
      kk:'Жеңілдік — күшті дәлел, бірақ жалғыз емес. Асығыс зиян келтіретін екі жағдай бар, сіз оларды тани білуіңіз керек.' },
    { t:'p',
      ru:'Первая: клиент уверен, что штраф незаконный — не его машина, он был в другом городе, номер чужой. Оплата в такой ситуации фактически означает согласие с нарушением. Здесь нужно не платить, а обжаловать, и сроки на жалобу такие же короткие. Об этом пятый урок.',
      kk:'Біріншісі: клиент айыппұл заңсыз екеніне сенімді — көлік оныкі емес, ол басқа қалада болған, нөмір бөтен. Мұндай жағдайда төлеу — іс жүзінде бұзушылықпен келісу дегені. Мұнда төлемей, шағымдану керек, ал шағым мерзімдері дәл сондай қысқа. Ол туралы бесінші сабақ.' },
    { t:'p',
      ru:'Вторая: штраф очень старый, и есть шанс, что срок его исполнения уже истёк. Оплатить старый штраф на автомате — значит добровольно погасить то, что уже могло не подлежать исполнению. Прежде чем платить старое, проверьте даты. Об этом шестой урок.',
      kk:'Екіншісі: айыппұл өте ескі және оны орындау мерзімі өтіп кеткен болуы мүмкін. Ескі айыппұлды ойланбай төлеу — орындалуға жатпайтын нәрсені өз еркімен өтеу деген сөз. Ескіні төлер алдында күндерді тексеріңіз. Ол туралы алтыншы сабақ.' },
    { t:'note',
      ru:'Правило простое: свежий и бесспорный штраф — платим сразу и со скидкой. Спорный — обжалуем. Очень старый — сначала считаем даты. Три ситуации, три разных действия, и ни одно нельзя заменить другим.',
      kk:'Ереже қарапайым: жаңа әрі даусыз айыппұлды — бірден, жеңілдікпен төлейміз. Даулысына — шағымданамыз. Өте ескісін — алдымен күндерін санаймыз. Үш жағдай, үш бөлек әрекет, бірде-бірін екіншісімен алмастыруға болмайды.' },
    { t:'p',
      ru:'И последнее, что стоит проговаривать вслух каждому: скидка действует только в самом начале. Через неделю она исчезает навсегда, и никакой помощник, юрист или знакомый вернуть её не сможет. Поэтому если клиент пишет вам вечером про свежий штраф — отвечайте в тот же вечер.',
      kk:'Соңғысы, әркімге дауыстап айтуға тұрарлық нәрсе: жеңілдік тек ең басында ғана қолданылады. Бір аптадан кейін ол мәңгі жоғалады, оны ешбір көмекші, заңгер немесе таныс қайтара алмайды. Сондықтан клиент кешке жаңа айыппұл туралы жазса — сол кеші жауап беріңіз.' }
  ],
  quiz:[
    { q:{ ru:'От какой даты считаются семь суток для скидки 50 процентов?', kk:'50 пайыз жеңілдікке берілетін жеті тәулік қай күннен есептеледі?' },
      opts:{ ru:['От даты нарушения','От даты вынесения постановления','От даты вручения или получения копии постановления','От даты появления штрафа в приложении банка'], kk:['Бұзушылық күнінен','Қаулы шығарылған күннен','Қаулының көшірмесі тапсырылған немесе алынған күннен','Айыппұлдың банк қосымшасында пайда болған күнінен'] },
      correct:2,
      why:{ ru:'Отсчёт идёт со дня, когда человек официально узнал о штрафе — получил копию постановления. Ошибка в этой точке либо лишает клиента скидки, либо создаёт ложное впечатление, что она ещё действует.', kk:'Есеп адам айыппұл туралы ресми білген — қаулының көшірмесін алған күннен басталады. Осы нүктедегі қате клиентті не жеңілдіктен айырады, не ол әлі күшінде деген жалған әсер қалдырады.' } },
    { q:{ ru:'Клиент уверен, что штраф выписан на чужую машину. Стоит ли платить со скидкой, чтобы сэкономить?', kk:'Клиент айыппұл бөтен көлікке салынғанына сенімді. Үнемдеу үшін жеңілдікпен төлеген жөн бе?' },
      opts:{ ru:['Да, скидка важнее','Нет: оплата фактически означает согласие с нарушением, здесь нужно обжалование','Да, потом можно вернуть деньги','Не имеет значения'], kk:['Иә, жеңілдік маңыздырақ','Жоқ: төлеу іс жүзінде бұзушылықпен келісу дегені, мұнда шағымдану керек','Иә, кейін ақшаны қайтаруға болады','Маңызы жоқ'] },
      correct:1,
      why:{ ru:'Скидка — инструмент для бесспорных штрафов. Если человек считает постановление незаконным, ему нужен другой механизм, и срок на жалобу тоже короткий. Совет «заплати, так дешевле» здесь лишает его защиты.', kk:'Жеңілдік — даусыз айыппұлдарға арналған құрал. Адам қаулыны заңсыз деп санаса, оған басқа тетік керек, ал шағым мерзімі де қысқа. Мұнда «төле, солай арзан» деген кеңес оны қорғаныссыз қалдырады.' } },
    { q:{ ru:'Клиент собирается заплатить в отделении банка на седьмой день, а он выпадает на воскресенье. Что сказать?', kk:'Клиент жетінші күні банк бөлімшесінде төлемек, ал ол жексенбіге түседі. Не деу керек?' },
      opts:{ ru:['Выходные не считаются, можно в понедельник','Выходные считаются, лучше оплатить заранее или через приложение','Скидка продлевается автоматически','Нужно подать заявление о продлении'], kk:['Демалыс күндері есептелмейді, дүйсенбіде болады','Демалыс күндері есептеледі, алдын ала немесе қосымша арқылы төлеген жөн','Жеңілдік автоматты түрде ұзартылады','Ұзарту туралы өтініш беру керек'] },
      correct:1,
      why:{ ru:'Срок считается в сутках, а не в рабочих днях. Приложение банка и портал работают круглосуточно, поэтому не тяните до последнего дня и предупреждайте клиента заранее.', kk:'Мерзім жұмыс күнімен емес, тәулікпен есептеледі. Банк қосымшасы мен портал тәулік бойы жұмыс істейді, сондықтан соңғы күнге дейін создырмаңыз және клиентті алдын ала ескертіңіз.' } },
    { q:{ ru:'Можно ли обещать клиенту скидку 50 процентов сразу, до проверки карточки штрафа?', kk:'Айыппұл карточкасын тексерместен, клиентке 50 пайыз жеңілдікті бірден уәде етуге бола ма?' },
      opts:{ ru:['Да, она действует всегда','Нет: по ряду статей скидка не применяется, нужно смотреть карточку','Да, если штраф свежий','Только если клиент платит через приложение'], kk:['Иә, ол әрқашан қолданылады','Жоқ: бірқатар бап бойынша жеңілдік қолданылмайды, карточканы қарау керек','Иә, айыппұл жаңа болса','Тек клиент қосымша арқылы төлесе'] },
      correct:1,
      why:{ ru:'Скидка распространяется не на все составы, и перечень может меняться. Открывайте карточку и смотрите, какая сумма подлежит уплате сейчас, — это и точный ответ, и защита от обещания, которое вы не сдержите.', kk:'Жеңілдік барлық құрамға қолданылмайды, тізбе өзгеруі мүмкін. Карточканы ашып, қазір қандай сома төленуге тиіс екенін қараңыз — бұл әрі нақты жауап, әрі орындай алмайтын уәдеден қорғау.' } },
    { q:{ ru:'Почему клиенту нужно обязательно сохранить чек об оплате?', kk:'Клиентке төлем чегін неге міндетті түрде сақтау керек?' },
      opts:{ ru:['Для налоговой','Он доказывает факт и дату оплаты, если база не обновится или всплывёт дубль','Чтобы получить скидку','Для страховой компании'], kk:['Салық үшін','База жаңармаса немесе қайталама шықса, ол төлем фактісі мен күнін дәлелдейді','Жеңілдік алу үшін','Сақтандыру компаниясы үшін'] },
      correct:1,
      why:{ ru:'Базы обновляются с задержкой, и иногда платёж теряется на стыке систем. Чек снимает вопрос за минуту, а без него доказывать оплату долго и неприятно.', kk:'Базалар кешігіп жаңарады, кейде төлем жүйелер түйіскен жерде жоғалып кетеді. Чек мәселені бір минутта жабады, ал онсыз төлемді дәлелдеу ұзақ әрі жағымсыз.' } }
  ],
  practice:[
    { t:'p',
      ru:'Задание на скорость реакции — потому что в скидке всё решает скорость.',
      kk:'Реакция жылдамдығына арналған тапсырма — өйткені жеңілдікте бәрін жылдамдық шешеді.' },
    { t:'steps',
      ru:[
        'Напишите в заметках телефона короткий текст-заготовку: «У вас свежий штраф. Скажите, когда вам вручили копию постановления — от этой даты идут семь суток, в которые сумма платится пополам».',
        'Придумайте три условные даты вручения копии и для каждой посчитайте по календарю последний день скидки. Проверьте себя дважды.',
        'Возьмите один реальный штраф — свой или знакомого — и откройте его карточку. Найдите, какая сумма подлежит уплате сейчас: полная или льготная.',
        'Если льготной суммы в карточке нет, запишите, по какой статье этот штраф. Так вы начнёте собирать свой список статей без скидки.',
        'Поставьте в телефоне правило для себя: сообщения про свежие штрафы вы отвечаете в тот же день, даже одной строкой.'
      ],
      kk:[
        'Телефон жазбаларына қысқа дайын мәтін жазыңыз: «Сізде жаңа айыппұл бар. Қаулының көшірмесі қашан тапсырылғанын айтыңыз — жеті тәулік сол күннен басталады, сол мерзімде сома жартылай төленеді».',
        'Көшірме тапсырылған үш шартты күн ойлап тауып, әрқайсысы үшін жеңілдіктің соңғы күнін күнтізбемен санаңыз. Өзіңізді екі рет тексеріңіз.',

        'Іс жүргізу жоқ болса — әдеттегі логикамен жұмыс істейміз: төлеу, шағымдану немесе мерзімдерді талдау.',
        'Іс жүргізу бар болса — орындаушының кім екенін және байланысын, сондай-ақ дәл қандай қарыз бойынша іс қозғалғанын жазып аламыз.',
        'Шектеулердің қойылған-қойылмағанын қараймыз: шетке шығу, шоттар, тіркеу әрекеттері.',
        'Әрі қарай адам орындаушымен тікелей байланысады. Өтелетін өзекті соманы тек орындаушы айта алады және төлемнен кейін шектеулерді де сол алып тастайды.'
      ] },
    { t:'note',
      ru:'После оплаты ограничения снимаются не мгновенно. Если человек собирается за границу, закладывайте запас времени и просите его подтвердить у исполнителя, что производство окончено. «Я вчера заплатил» — не гарантия того, что завтра выпустят.',
      kk:'Төлемнен кейін шектеулер бірден алынбайды. Адам шетелге бармақ болса, уақыт қорын қалдырыңыз және іс жүргізудің аяқталғанын орындаушыдан растатуын сұраңыз. «Мен кеше төледім» деген — ертең жіберетінінің кепілі емес.' },

    { t:'h', ru:'Отсрочка и рассрочка: законный выход, если платить нечем', kk:'Кейінге қалдыру және бөліп төлеу: төлейтін ақша болмағандағы заңды жол' },
    { t:'p',
      ru:'Есть ситуация, о которой мало кто знает: если человеку действительно нечем заплатить сразу, закон допускает отсрочку или рассрочку исполнения. Это не «прощение» штрафа, а перенос или разбивка платежа. Решается это обращением в орган или суд, вынесший постановление.',
      kk:'Аз адам білетін бір жағдай бар: адамда бірден төлейтін ақша шынымен болмаса, заң орындауды кейінге қалдыруға немесе бөліп төлеуге жол береді. Бұл — айыппұлды «кешіру» емес, төлемді жылжыту немесе бөлу. Ол қаулы шығарған органға немесе сотқа жүгіну арқылы шешіледі.' },
    { t:'p',
      ru:'Здесь есть тонкость, о которой вы обязаны предупредить заранее, — и она пригодится в следующем уроке. Отсрочка и рассрочка приостанавливают течение срока давности исполнения. То есть человек, который взял рассрочку в надежде «дотянуть до года», не дотянет: часы на это время останавливаются.',
      kk:'Мұнда алдын ала ескертуге міндетті бір нәзік тұс бар — ол келесі сабақта керек болады. Кейінге қалдыру мен бөліп төлеу орындау мерзімінің өтуін тоқтатады. Яғни «бір жылға дейін созамын» деп бөліп төлеуді алған адам созбайды: сағат сол уақытқа тоқтап тұрады.' },
    { t:'check',
      ru:'Основания, порядок и сроки предоставления отсрочки или рассрочки установлены КоАП и могут пересматриваться. Точный порядок обращения уточняйте на egov.kz или в органе, вынесшем постановление.',
      kk:'Кейінге қалдыру немесе бөліп төлеуді берудің негіздері, тәртібі мен мерзімдері ӘҚБтК-де белгіленген және қайта қаралуы мүмкін. Жүгінудің нақты тәртібін egov.kz сайтынан немесе қаулы шығарған органнан нақтылаңыз.' },

    { t:'h', ru:'Что из этого следует для вашей работы', kk:'Бұдан жұмысыңызға не шығады' },
    { t:'p',
      ru:'Первое: молчание никогда не выгодно. Каждый месяц бездействия увеличивает и сумму, и количество ограничений. Совет «не обращай внимания, забудется» — самый дорогой из всех, что можно дать человеку.',
      kk:'Біріншісі: үнсіздік ешқашан тиімді емес. Әрекетсіздіктің әр айы соманы да, шектеулер санын да көбейтеді. «Мән бермей-ақ қой, ұмытылады» деген кеңес — адамға беруге болатын ең қымбат кеңес.' },
    { t:'p',
      ru:'Второе: проверка по реестру должна идти в самом начале, а не в конце разговора. Если производство уже возбуждено, весь дальнейший разговор строится вокруг исполнителя, а не вокруг сроков и скидок.',
      kk:'Екіншісі: тізілімнен тексеру әңгіменің соңында емес, ең басында жүруі керек. Іс жүргізу қозғалып қойған болса, әрі қарайғы бүкіл әңгіме мерзімдер мен жеңілдіктердің емес, орындаушының төңірегінде құрылады.' },
    { t:'p',
      ru:'Третье: ваша роль здесь — проводник, а не переговорщик. Вы находите производство, объясняете человеку, что происходит и к кому обращаться, помогаете подготовиться к разговору. Вести переговоры с исполнителем от чужого имени и обещать снятие ограничений вы не можете.',
      kk:'Үшіншісі: мұндағы рөліңіз — келіссөз жүргізуші емес, бағыттаушы. Сіз іс жүргізуді табасыз, адамға не болып жатқанын және кімге жүгіну керегін түсіндіресіз, әңгімеге дайындалуға көмектесесіз. Орындаушымен өзгенің атынан келіссөз жүргізіп, шектеулерді алып тастауды уәде ете алмайсыз.' }
  ],
  quiz:[
    { q:{ ru:'Что означает возбуждение исполнительного производства по штрафу?', kk:'Айыппұл бойынша атқарушылық іс жүргізудің қозғалуы нені білдіреді?' },
      opts:{ ru:['Штраф аннулирован','Дело перешло к судебному исполнителю и живёт уже по законодательству об исполнительном производстве','Сумма штрафа уменьшилась','Начался срок обжалования'], kk:['Айыппұл жойылды','Іс сот орындаушысына өтті және атқарушылық іс жүргізу туралы заңнама бойынша өмір сүреді','Айыппұл сомасы азайды','Шағымдану мерзімі басталды'] },
      correct:1,
      why:{ ru:'Это ключевая граница модуля. Пока производства нет — работает обычная логика КоАП. После возбуждения включается другой закон, другие последствия и другой собеседник — сам исполнитель.', kk:'Бұл — модульдің негізгі шекарасы. Іс жүргізу жоқ кезде ӘҚБтК-нің әдеттегі логикасы жұмыс істейді. Қозғалғаннан кейін басқа заң, басқа салдар және басқа әңгімелесуші — орындаушының өзі қосылады.' } },
    { q:{ ru:'Что из перечисленного судебный исполнитель делать вправе?', kk:'Аталғанның қайсысын сот орындаушысы жасауға құқылы?' },
      opts:{ ru:['Только звонить должнику','Наложить временное ограничение на выезд и обратить взыскание на счета','Изменить статью КоАП','Отменить постановление'], kk:['Тек борышкерге қоңырау шалу','Шетке шығуға уақытша шектеу қою және шоттарға өндіріп алуды қолдану','ӘҚБтК бабын өзгерту','Қаулының күшін жою'] },
      correct:1,
      why:{ ru:'У исполнителя реальные полномочия: счета, ограничение выезда, регистрационные действия с имуществом. Отменить постановление он не может — это делает орган или суд по жалобе.', kk:'Орындаушының нақты өкілеттігі бар: шоттар, шетке шығуға шектеу, мүлікпен тіркеу әрекеттері. Қаулының күшін жоя алмайды — оны шағым бойынша орган немесе сот жасайды.' } },
    { q:{ ru:'Почему затягивание с оплатой всегда невыгодно?', kk:'Төлемді созу неге әрқашан тиімсіз?' },
      opts:{ ru:['Сумма индексируется по инфляции','Сверх штрафа взыскиваются расходы по исполнительному производству и оплата деятельности исполнителя','Начисляются проценты банка','Увеличивается статья КоАП'], kk:['Сома инфляцияға қарай индекстеледі','Айыппұлдың үстіне атқарушылық іс жүргізу шығыстары мен орындаушы қызметінің ақысы өндіріледі','Банк пайызы есептеледі','ӘҚБтК бабы ауырлайды'] },
      correct:1,
      why:{ ru:'К моменту, когда дело у исполнителя, человек платит сумму постановления плюс расходы. Именно поэтому совет «не обращай внимания» — самый дорогой из возможных.', kk:'Іс орындаушыға жеткен кезде адам қаулы сомасына қоса шығыстарды төлейді. Дәл сондықтан «мән бермей-ақ қой» деген кеңес — мүмкін болғандардың ең қымбаты.' } },
    { q:{ ru:'Клиент взял рассрочку исполнения, чтобы «дотянуть до года» и не платить. Что произойдёт?', kk:'Клиент «бір жылға дейін созып», төлемеу үшін бөліп төлеуді алды. Не болады?' },
      opts:{ ru:['План сработает','Рассрочка приостанавливает течение срока давности исполнения, план не сработает','Срок давности сократится','Штраф удвоится'], kk:['Жоспар жүзеге асады','Бөліп төлеу орындау мерзімінің өтуін тоқтатады, жоспар жүзеге аспайды','Мерзім қысқарады','Айыппұл екі есе өседі'] },
      correct:1,
      why:{ ru:'Отсрочка и рассрочка останавливают часы срока давности. Об этом обязательно предупреждайте заранее: человек, который рассчитывал переждать, будет неприятно удивлён.', kk:'Кейінге қалдыру мен бөліп төлеу мерзім сағатын тоқтатады. Бұл туралы міндетті түрде алдын ала ескертіңіз: күтіп отырмақ болған адам жағымсыз таңғалады.' } },
    { q:{ ru:'Клиент оплатил долг у исполнителя вчера и завтра летит за границу. Что сказать?', kk:'Клиент кеше орындаушыдағы қарызын төледі, ертең шетелге ұшады. Не деу керек?' },
      opts:{ ru:['Всё в порядке, можно лететь','Ограничения снимаются не мгновенно, нужно подтвердить у исполнителя окончание производства','Нужно оплатить ещё раз','Ограничение снимается автоматически в день оплаты'], kk:['Бәрі дұрыс, ұшуға болады','Шектеулер бірден алынбайды, іс жүргізудің аяқталғанын орындаушыдан растату керек','Тағы бір рет төлеу керек','Шектеу төлеген күні автоматты түрде алынады'] },
      correct:1,
      why:{ ru:'Между оплатой и снятием ограничения проходит время. Единственный надёжный ответ даёт сам исполнитель. Обещание «всё в порядке» может закончиться сорванной поездкой всей семьи.', kk:'Төлем мен шектеудің алынуы арасында уақыт өтеді. Жалғыз сенімді жауапты орындаушының өзі береді. «Бәрі дұрыс» деген уәде бүкіл отбасының сапарының бұзылуымен аяқталуы мүмкін.' } }
  ],
  practice:[
    { t:'p',
      ru:'Задание на понимание границы. Оно короткое, но именно оно защитит вас от самого опасного совета в этой профессии.',
      kk:'Шекараны түсінуге арналған тапсырма. Ол қысқа, бірақ дәл сол сізді осы кәсіптегі ең қауіпті кеңестен қорғайды.' },
    { t:'steps',
      ru:[
        'Откройте свой лист с тремя колонками из первого урока модуля.',
        'Проведите поперёк листа жирную линию и подпишите её: «Дело у судебного исполнителя».',
        'Над линией напишите: работают оплата, обжалование, срок давности. Под линией: работает только погашение через исполнителя.',
        'Проверьте себя или близкого человека по реестру должников и исполнительных производств. Посмотрите, как выглядит ответ, когда производств нет.',
        'Напишите себе в заметки готовую фразу для клиента: «Сначала я проверю, не передано ли дело судебному исполнителю — от этого зависит всё остальное».'
      ],
      kk:[
        'Модульдің бірінші сабағындағы үш бағаны бар парағыңызды ашыңыз.',
        'Парақты көлденең жуан сызықпен бөліп, оны «Іс сот орындаушысында» деп қолтаңбалаңыз.',
        'Сызықтың үстіне жазыңыз: төлеу, шағымдану, мерзімнің өтуі жұмыс істейді. Астына: тек орындаушы арқылы өтеу жұмыс істейді.',
        'Өзіңізді немесе жақын адамды борышкерлер мен атқарушылық іс жүргізулер тізілімінен тексеріңіз. Іс жүргізу жоқ кезде жауап қалай көрінетінін қараңыз.',
        'Жазбаларыңызға клиентке арналған дайын сөйлем жазыңыз: «Алдымен іс сот орындаушысына берілмегенін тексеремін — қалғанының бәрі соған байланысты».'
      ] },
    { t:'note',
      ru:'Эта фраза должна звучать в начале каждого разговора о старых штрафах. Она экономит время, задаёт вам роль профессионала и, главное, не даёт пообещать лишнего.',
      kk:'Бұл сөйлем ескі айыппұлдар туралы әр әңгіменің басында айтылуы тиіс. Ол уақытты үнемдейді, сізге кәсіпқой рөлін береді және ең бастысы — артық уәде беруге жол бермейді.' }
  ],
  scripts:[
    { q:{ ru:'У меня арестовали счёт, а я даже не знал за что', kk:'Шотыма тыйым салыпты, ал мен не үшін екенін білмеймін де' },
      a:{ ru:'Разберёмся по порядку. Скорее всего, по вашему долгу возбуждено исполнительное производство — тогда арест накладывает судебный исполнитель. Сейчас я проверю вас по реестру должников: там будет видно, кто исполнитель, по какому долгу и какие ограничения стоят. Дальше вам нужно связаться с ним напрямую — только он назовёт актуальную сумму и снимет арест после погашения. Я помогу подготовиться к этому разговору.',
        kk:'Ретімен анықтайық. Сірә, қарызыңыз бойынша атқарушылық іс жүргізу қозғалған — онда тыйымды сот орындаушысы салады. Қазір мен сізді борышкерлер тізілімінен тексеремін: онда орындаушының кім екені, қандай қарыз бойынша және қандай шектеулер тұрғаны көрінеді. Әрі қарай сіз онымен тікелей байланысуыңыз керек — өзекті соманы тек ол айтады және өтелгеннен кейін тыйымды да сол алады. Мен осы әңгімеге дайындалуға көмектесемін.' } },
    { q:{ ru:'Мне сказали, если не платить, оно само пропадёт', kk:'Маған төлемесең, ол өзі жоғалады деді' },
      a:{ ru:'Такое правило есть, но у него жёсткое условие: оно не работает, если дело успели передать судебному исполнителю. А передают его как раз тем, кто не платил. Получается, что стратегия «просто не платить» чаще всего приводит ровно к тому исходу, при котором правило и не срабатывает. Давайте я проверю по реестру, где сейчас ваше дело, и тогда уже будем считать сроки.',
        kk:'Мұндай ереже бар, бірақ оның қатаң шарты бар: іс сот орындаушысына берілуге үлгерсе, ол жұмыс істемейді. Ал оны дәл төлемегендерге береді. Сонда «жай ғана төлемеу» стратегиясы көбіне ереже жұмыс істемейтін нәтижеге әкеледі. Келіңіз, ісіңіздің қазір қайда екенін тізілімнен тексерейін, содан кейін мерзімдерді санаймыз.' } },
    { q:{ ru:'Мне сейчас правда нечем заплатить', kk:'Қазір шынымен төлейтін ақшам жоқ' },

      kk:'Пошта арқылы берсеңіз — тек тапсырылғаны туралы хабарламасы бар тапсырыс хатпен, түбіртекті сақтаңыз. Ол жіберілген күнді, демек, он тәулікке үлгергеніңізді дәлелдейді. Жеке бергенде өз данаңызға қабылданғаны туралы белгі қоюын сұраңыз.' },

    { t:'h', ru:'Из чего состоит жалоба', kk:'Шағым неден тұрады' },
    { t:'p',
      ru:'Жалоба пишется простым языком, без юридических украшений. Главное — чтобы в ней было пять вещей: кому, от кого, что обжалуется, почему это неправильно и что вы просите.',
      kk:'Шағым заңдық әшекейсіз, қарапайым тілмен жазылады. Ең бастысы — онда бес нәрсе болуы: кімге, кімнен, не шағымданылады, бұл неге дұрыс емес және не сұрайсыз.' },
    { t:'formula',
      ru:'Кому: (наименование органа или суда)\nОт кого: ФИО полностью, ИИН,\n  адрес, номер телефона\n\nЖАЛОБА\nна постановление по делу об административном\nправонарушении № ______ от __.__.____\n\nПостановлением № ______ от __.__.____,\nвынесенным (кем), я привлечён к\nадминистративной ответственности по статье ____\nКоАП РК с наложением штрафа в размере ______.\nКопия постановления вручена мне __.__.____.\n\nС постановлением не согласен по следующим\nоснованиям:\n1. (что именно неверно — фактами, без эмоций)\n2. (чем это подтверждается)\n\nНа основании изложенного\nПРОШУ:\nпостановление № ______ от __.__.____ отменить,\nпроизводство по делу прекратить.\n\nПриложения:\n1. Копия постановления.\n2. (документы, подтверждающие доводы)\n\nДата __.__.____        Подпись ________',
      kk:'Кімге: (орган немесе сот атауы)\nКімнен: Аты-жөні толық, ЖСН,\n  мекенжайы, телефон нөмірі\n\nШАҒЫМ\nәкімшілік құқық бұзушылық туралы іс бойынша\n№ ______, __.__.____ қаулыға\n\n(Кім) шығарған __.__.____ күнгі № ______ қаулымен\nмен ҚР ӘҚБтК-нің ____ бабы бойынша әкімшілік\nжауапкершілікке тартылып, ______ мөлшерінде\nайыппұл салынды.\nҚаулының көшірмесі маған __.__.____ тапсырылды.\n\nҚаулымен мынадай негіздер бойынша келіспеймін:\n1. (нақты не дұрыс емес — эмоциясыз, фактілермен)\n2. (бұл немен расталады)\n\nБаяндалғанның негізінде\nСҰРАЙМЫН:\n__.__.____ күнгі № ______ қаулының күшін жоюды,\nіс бойынша іс жүргізуді тоқтатуды.\n\nҚосымшалар:\n1. Қаулының көшірмесі.\n2. (дәлелдерді растайтын құжаттар)\n\nКүні __.__.____        Қолы ________' },
    { t:'p',
      ru:'Обратите внимание на две вещи в этом образце. Первая: дата вручения копии указывается прямо в тексте — это сразу показывает, что вы в сроке. Вторая: доводы пишутся фактами, а не чувствами. «Я честный человек и никогда не нарушаю» — это не довод. «В указанное время автомобиль находился в другом городе, что подтверждается путевым листом» — довод.',
      kk:'Осы үлгідегі екі нәрсеге назар аударыңыз. Біріншісі: көшірме тапсырылған күн мәтінде тікелей көрсетіледі — бұл мерзімде екеніңізді бірден көрсетеді. Екіншісі: дәлелдер сезіммен емес, фактілермен жазылады. «Мен адал адаммын және ешқашан бұзбаймын» — бұл дәлел емес. «Көрсетілген уақытта көлік басқа қалада болды, оны жол парағы растайды» — дәлел.' },
    { t:'note',
      ru:'Жалобу подписывает и подаёт сам клиент. Вы помогаете собрать факты, разложить их по пунктам и оформить документ, но подписывать чужую жалобу и подавать её от своего имени нельзя. Это граница вашей роли.',
      kk:'Шағымға клиенттің өзі қол қояды және өзі береді. Сіз фактілерді жинауға, оларды тармақтарға бөлуге және құжатты ресімдеуге көмектесесіз, бірақ өзгенің шағымына қол қоюға және оны өз атыңыздан беруге болмайды. Бұл — рөліңіздің шекарасы.' },
    { t:'h', ru:'Что происходит после подачи', kk:'Бергеннен кейін не болады' },
    { t:'p',
      ru:'Жалобу рассматривают и выносят решение: оставить постановление без изменения, изменить его или отменить и прекратить производство. Решение тоже можно обжаловать дальше по инстанциям. Пока идёт обжалование, исполнение постановления приостанавливается — а вместе с ним, как мы увидим в следующем уроке, приостанавливается и течение срока давности исполнения.',
      kk:'Шағым қаралып, шешім шығарылады: қаулыны өзгеріссіз қалдыру, өзгерту немесе күшін жойып, іс жүргізуді тоқтату. Шешімге де сатылар бойынша әрі қарай шағымдануға болады. Шағымдану жүріп жатқанда қаулының орындалуы тоқтатыла тұрады — ал онымен бірге, келесі сабақта көретініміздей, орындау мерзімінің өтуі де тоқтайды.' },
    { t:'p',
      ru:'Об этом надо предупреждать сразу, потому что клиенты часто рассчитывают на обратное: подать жалобу «для затяжки» и параллельно ждать, пока пройдёт год. Так не работает. Жалоба — инструмент отмены, а не инструмент выигрыша времени.',
      kk:'Бұл туралы бірден ескерту керек, өйткені клиенттер жиі керісінше есептейді: «созу үшін» шағым беріп, қатарынан бір жылдың өтуін күту. Бұлай жұмыс істемейді. Шағым — уақыт ұту құралы емес, күшін жою құралы.' }
  ],
  quiz:[
    { q:{ ru:'В какой срок подаётся жалоба на постановление?', kk:'Қаулыға шағым қандай мерзімде беріледі?' },
      opts:{ ru:['В течение трёх суток со дня нарушения','В течение десяти суток со дня вручения копии постановления','В течение тридцати суток со дня вступления в силу','В течение года'], kk:['Бұзушылық күнінен бастап үш тәулікте','Қаулының көшірмесі тапсырылған күннен бастап он тәулікте','Күшіне енген күннен бастап отыз тәулікте','Бір жыл ішінде'] },
      correct:1,
      why:{ ru:'Десять суток со дня вручения копии. Это очень короткий срок, поэтому в любом разговоре про спорный штраф первым делом выясняйте дату вручения, а не обстоятельства нарушения.', kk:'Көшірме тапсырылған күннен бастап он тәулік. Бұл — өте қысқа мерзім, сондықтан даулы айыппұл туралы кез келген әңгімеде алдымен бұзушылық жағдайын емес, тапсырылған күнді анықтаңыз.' } },
    { q:{ ru:'Клиент узнал о штрафе через двадцать дней, потому что был в командировке. Что можно сделать?', kk:'Клиент іссапарда болғандықтан айыппұл туралы жиырма күннен кейін білді. Не істеуге болады?' },
      opts:{ ru:['Ничего, срок пропущен окончательно','Подать жалобу вместе с ходатайством о восстановлении срока и приложить подтверждение причины','Подать жалобу без объяснений','Обратиться к судебному исполнителю'], kk:['Ештеңе, мерзім біржола өтті','Шағымды мерзімді қалпына келтіру туралы өтінішпен бірге беріп, себептің растамасын тіркеу','Түсініктемесіз шағым беру','Сот орындаушысына жүгіну'] },
      correct:1,
      why:{ ru:'Пропущенный по уважительной причине срок можно просить восстановить, приложив подтверждение — например, документы о командировке. Гарантии нет, но шанс реальный. «Я забыл» уважительной причиной обычно не считается.', kk:'Дәлелді себеппен өткізілген мерзімді растама тіркей отырып, қалпына келтіруді сұрауға болады — мысалы, іссапар құжаттарын. Кепілдік жоқ, бірақ мүмкіндік нақты. «Ұмытып кетіппін» әдетте дәлелді себеп саналмайды.' } },
    { q:{ ru:'Что является доводом в жалобе?', kk:'Шағымдағы дәлел деген не?' },
      opts:{ ru:['«Я честный человек и никогда не нарушаю»','«В указанное время автомобиль был в другом городе, что подтверждается документом»','«Штраф слишком большой для моей зарплаты»','«Меня раньше никогда не штрафовали»'], kk:['«Мен адал адаммын және ешқашан бұзбаймын»','«Көрсетілген уақытта көлік басқа қалада болды, оны құжат растайды»','«Айыппұл менің жалақыма тым үлкен»','«Маған бұрын ешқашан айыппұл салынбаған»'] },
      correct:1,
      why:{ ru:'Довод — это факт плюс подтверждение. Эмоции и оценки собственной честности жалобу не усиливают. Перед подачей всегда спрашивайте клиента: чем именно мы это докажем?', kk:'Дәлел — бұл факт және растама. Эмоция мен өз адалдығын бағалау шағымды күшейтпейді. Беруден бұрын клиенттен әрқашан сұраңыз: мұны нақты немен дәлелдейміз?' } },
    { q:{ ru:'Клиент хочет подать жалобу, чтобы затянуть время и дождаться истечения срока давности. Что ему сказать?', kk:'Клиент уақыт создырып, мерзімнің өтуін күту үшін шағым бермек. Оған не деу керек?' },
      opts:{ ru:['Хорошая идея','На время обжалования течение срока давности исполнения приостанавливается, выиграть время так не получится','Срок давности при этом сокращается','Жалоба ускоряет исполнение'], kk:['Жақсы идея','Шағымдану кезінде орындау мерзімінің өтуі тоқтатылады, бұлайша уақыт ұту мүмкін емес','Бұл кезде мерзім қысқарады','Шағым орындауды жеделдетеді'] },
      correct:1,
      why:{ ru:'Жалоба — инструмент отмены незаконного постановления, а не способ выиграть время. Пока идёт обжалование, часы срока давности остановлены. Предупреждайте об этом сразу, чтобы клиент не строил ложных планов.', kk:'Шағым — заңсыз қаулының күшін жою құралы, уақыт ұту тәсілі емес. Шағымдану жүріп жатқанда мерзім сағаты тоқтап тұрады. Клиент жалған жоспар құрмауы үшін бұл туралы бірден ескертіңіз.' } },
    { q:{ ru:'Кто подписывает и подаёт жалобу?', kk:'Шағымға кім қол қояды және оны кім береді?' },
      opts:{ ru:['Помощник от своего имени','Сам клиент; помощник помогает собрать факты и оформить документ','Страховая компания','Судебный исполнитель'], kk:['Көмекші өз атынан','Клиенттің өзі; көмекші фактілерді жинауға және құжатты ресімдеуге көмектеседі','Сақтандыру компаниясы','Сот орындаушысы'] },
      correct:1,
      why:{ ru:'Это граница роли помощника. Вы собираете факты, раскладываете доводы по пунктам и помогаете оформить документ, но подписывает и подаёт его человек сам. Представительство — работа юриста.', kk:'Бұл — көмекші рөлінің шекарасы. Сіз фактілерді жинайсыз, дәлелдерді тармақтарға бөлесіз және құжатты ресімдеуге көмектесесіз, бірақ оған адам өзі қол қойып, өзі береді. Өкілдік ету — заңгердің жұмысы.' } }
  ],
  practice:[
    { t:'p',
      ru:'Сегодня вы делаете заготовку, которой будете пользоваться годами. Один раз потратите час — дальше будете заполнять за десять минут.',
      kk:'Бүгін жылдар бойы қолданатын дайындама жасайсыз. Бір рет бір сағат жұмсайсыз — әрі қарай он минутта толтырасыз.' },
    { t:'steps',
      ru:[
        'Перепишите образец жалобы из этого урока в заметки телефона или в документ. Оставьте пропуски там, где подставляются данные.',
        'Сделайте вторую версию — на казахском языке. Клиенты бывают разные, и возможность подать документ на любом из двух языков — ваше преимущество.',
        'Придумайте условную ситуацию: штраф на проданную машину. Заполните образец полностью, выдумав даты и номера.',
        'Выпишите отдельным списком, какие документы вы приложили бы к такой жалобе.',
        'Проверьте себя: указана ли в тексте дата вручения копии постановления? Если нет — добавьте, это ключевая строка.'
      ],
      kk:[
        'Осы сабақтағы шағым үлгісін телефон жазбаларына немесе құжатқа көшіріп жазыңыз. Деректер қойылатын жерде бос орын қалдырыңыз.',
        'Екінші нұсқасын жасаңыз — қазақ тілінде. Клиенттер әртүрлі болады, ал құжатты екі тілдің кез келгенінде бере алу — сіздің артықшылығыңыз.',
        'Шартты жағдай ойлап табыңыз: сатылған көлікке келген айыппұл. Күндер мен нөмірлерді ойдан құрап, үлгіні толық толтырыңыз.',
        'Мұндай шағымға қандай құжат тіркейтініңізді бөлек тізіммен жазыңыз.',
        'Өзіңізді тексеріңіз: мәтінде қаулының көшірмесі тапсырылған күн көрсетілген бе? Жоқ болса — қосыңыз, бұл — негізгі жол.'
      ] },
    { t:'note',
      ru:'Готовый шаблон на двух языках — редкая вещь в маленьком городе. Именно за такие мелочи вас будут рекомендовать: не за знание закона, а за то, что у вас всё готово, когда у человека горит срок.',
      kk:'Екі тілдегі дайын үлгі — шағын қалада сирек кездесетін нәрсе. Дәл осындай ұсақ-түйек үшін сізді ұсынады: заң білгеніңіз үшін емес, адамның мерзімі бітіп бара жатқанда сізде бәрі дайын тұрғаны үшін.' }
  ],
  scripts:[
    { q:{ ru:'Мне пришёл штраф на машину, которую я продал год назад', kk:'Бір жыл бұрын сатқан көлігіме айыппұл келді' },
      a:{ ru:'Это как раз случай для жалобы. Нам нужны две вещи: дата, когда вам вручили копию постановления, и документы о продаже — договор, отметка о снятии с учёта, всё, что подтверждает, что машина уже не ваша. Срок на жалобу десять суток с даты вручения, поэтому давайте не откладывать: пришлите документы сегодня, я помогу составить текст, а подпишете и подадите вы сами.',
        kk:'Бұл — дәл шағымға арналған жағдай. Бізге екі нәрсе керек: қаулының көшірмесі сізге тапсырылған күн және сату құжаттары — шарт, есептен шығару белгісі, көліктің енді сіздікі емес екенін растайтын бәрі. Шағым мерзімі тапсырылған күннен он тәулік, сондықтан созбайық: құжаттарды бүгін жіберіңіз, мен мәтінді құрастыруға көмектесемін, ал қол қойып, беретін өзіңіз боласыз.' } },
    { q:{ ru:'Я просто не согласен, штраф несправедливый', kk:'Мен жай ғана келіспеймін, айыппұл әділетсіз' },
