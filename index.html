        '**Шағымдану.** Шағым қаралып жатқанда орындау тоқтатылады, мерзім сағаты тұрады. «Уақыт созу үшін» шағым берген адам мерзімді өзі ұзартады.',
        '**Орындауды кейінге қалдыру.** Органның немесе соттың шешімімен төлемді жылжыту да сағатты тоқтатады.',
        '**Бөліп төлеу.** Бөліктерге бөлу — сол сияқты. Бөліп төлеу қолданылып тұрғанда мерзім жүрмейді.',
        '**Заңда көзделген орындауды тоқтатудың өзге де жағдайлары.**'
      ] },
    { t:'p',
      ru:'Объясняйте это клиенту через образ секундомера. Год — это секундомер, который включился в день вступления постановления в силу. Каждый раз, когда человек что-то предпринимает — жалуется, просит отсрочку, берёт рассрочку, — секундомер ставят на паузу. Потом он идёт дальше, но время, проведённое на паузе, не засчитывается.',
      kk:'Мұны клиентке секундомер бейнесі арқылы түсіндіріңіз. Жыл — қаулы күшіне енген күні қосылған секундомер. Адам бірдеңе істеген сайын — шағымданса, кейінге қалдыруды сұраса, бөліп төлеуді алса — секундомер кідіртіледі. Содан кейін ол әрі қарай жүреді, бірақ кідірісте өткен уақыт есептелмейді.' },

    { t:'h', ru:'Главное исключение: дело у судебного исполнителя', kk:'Басты ерекшелік: іс сот орындаушысында' },
    { t:'p',
      ru:'Здесь самое важное, что вы должны запомнить из всего модуля. **Механизм давности не спасает, если постановление успели обратить к принудительному исполнению и по нему возбуждено исполнительное производство.**',
      kk:'Бүкіл модульден есте сақтауыңыз керек ең маңызды нәрсе осында. **Қаулыны мәжбүрлеп орындауға жіберіп үлгерсе және ол бойынша атқарушылық іс жүргізу қозғалса, мерзімнің өтуі тетігі құтқармайды.**' },
    { t:'p',
      ru:'Как только дело попадает к судебному исполнителю — государственному или частному, — оно живёт уже по законодательству об исполнительном производстве, а не по КоАП. Там свои правила и свои сроки. Расчёты по статье 890 к такому делу просто не применяются, и никакое ожидание не поможет: долг никуда не денется, а сверху добавятся расходы по исполнительному производству.',
      kk:'Іс сот орындаушысына — мемлекеттік немесе жеке — түскен бойда ол ӘҚБтК бойынша емес, атқарушылық іс жүргізу туралы заңнама бойынша өмір сүреді. Онда өз ережелері мен өз мерзімдері бар. 890-бап бойынша есептеулер мұндай іске мүлдем қолданылмайды, ешқандай күту көмектеспейді: қарыз еш жерге кетпейді, үстіне атқарушылық іс жүргізу шығыстары қосылады.' },
    { t:'p',
      ru:'В этом и заключается ловушка народного совета «просто не плати, само сгорит». Именно тех, кто не платит, и передают исполнителю. То есть стратегия ожидания сама создаёт условие, при котором ожидание перестаёт работать.',
      kk:'«Жай ғана төлеме, өзі жанып кетеді» деген халықтық кеңестің тұзағы да осында. Дәл төлемегендерді орындаушыға береді. Яғни күту стратегиясы күтудің жұмыс істеуін тоқтататын шартты өзі жасайды.' },
    { t:'note',
      ru:'Поэтому порядок действий всегда один: сначала проверка по реестру должников и исполнительных производств, и только потом любые разговоры о сроках. Если производство есть — тема давности закрыта, работаем с исполнителем.',
      kk:'Сондықтан әрекет тәртібі әрқашан бір: алдымен борышкерлер мен атқарушылық іс жүргізулер тізілімінен тексеру, содан кейін ғана мерзімдер туралы кез келген әңгіме. Іс жүргізу бар болса — мерзім тақырыбы жабылады, орындаушымен жұмыс істейміз.' },

    { t:'h', ru:'Что вы можете обещать клиенту, а что — категорически нет', kk:'Клиентке нені уәде етуге болады, ал нені — мүлдем болмайды' },
    { t:'warn',
      ru:'Никогда не говорите клиенту «я удалю ваш штраф», «я сотру его из базы», «у меня есть выход, штраф уберут». Такой возможности не существует ни у помощника, ни у юриста, ни у кого бы то ни было. Человек, который берёт за это деньги, совершает обман, а тот, кто повторяет обещание, отвечает вместе с ним. Одна такая фраза перечёркивает вашу репутацию в маленьком городе навсегда.',
      kk:'Клиентке ешқашан «айыппұлыңызды өшіремін», «оны базадан жоямын», «менде жол бар, айыппұлды алып тастайды» демеңіз. Мұндай мүмкіндік көмекшіде де, заңгерде де, ешкімде де жоқ. Бұған ақша алған адам алдау жасайды, ал уәдені қайталаған онымен бірге жауап береді. Мұндай бір сөйлем шағын қаладағы беделіңізді мәңгі жоққа шығарады.' },
    { t:'p',
      ru:'А теперь то, что вы можете и должны делать — и это, между прочим, реальная и полезная работа. Проверить человека по ИИН в реестре должников и исполнительных производств. Посмотреть по каждому штрафу дату вступления постановления в силу. Сопоставить эту дату с сегодняшним днём. Выяснить, были ли обжалования, отсрочки, рассрочки, которые останавливали срок. И на основании всего этого объяснить человеку, попадает ли его штраф под правило статьи 890 и что из этого следует.',
      kk:'Ал енді істей алатын және істеуге тиіс ісіңіз — айтпақшы, бұл нақты әрі пайдалы жұмыс. Адамды ЖСН бойынша борышкерлер мен атқарушылық іс жүргізулер тізілімінен тексеру. Әр айыппұл бойынша қаулының күшіне енген күнін қарау. Бұл күнді бүгінгі күнмен салыстыру. Мерзімді тоқтатқан шағымдану, кейінге қалдыру, бөліп төлеу болған-болмағанын анықтау. Осының бәрінің негізінде адамға айыппұлы 890-баптың ережесіне ілігетінін және бұдан не шығатынын түсіндіру.' },
    { t:'p',
      ru:'Разница между этими двумя вещами огромная. Первое — обещание результата, которого вы не контролируете. Второе — проверка фактов и объяснение порядка. Первое незаконно и опасно. Второе законно, полезно и именно за это вам платят.',
      kk:'Осы екі нәрсенің арасындағы айырма зор. Біріншісі — өзіңіз бақыламайтын нәтижені уәде ету. Екіншісі — фактілерді тексеру және тәртіпті түсіндіру. Біріншісі — заңсыз әрі қауіпті. Екіншісі — заңды, пайдалы, ал ақы дәл соған төленеді.' },
    { t:'check',
      ru:'Редакция статьи 890 и перечень оснований для приостановления срока могут изменяться. Перед серьёзным разговором с клиентом сверяйтесь с действующей редакцией КоАП, а по конкретному делу опирайтесь на даты из карточки штрафа и данные реестра, а не на пересказы.',
      kk:'890-баптың редакциясы және мерзімді тоқтату негіздерінің тізбесі өзгеруі мүмкін. Клиентпен маңызды әңгімеден бұрын ӘҚБтК-нің қолданыстағы редакциясымен салыстырыңыз, ал нақты іс бойынша айтылған әңгімелерге емес, айыппұл карточкасындағы күндер мен тізілім деректеріне сүйеніңіз.' },
    { t:'h', ru:'Ваш алгоритм в четыре шага', kk:'Төрт қадамдық алгоритміңіз' },
    { t:'steps',
      ru:[
        'Проверить по реестру, нет ли исполнительного производства. Есть — тема давности закрыта, идём к исполнителю.',
        'Найти дату вступления постановления в законную силу. Нет её в карточке — восстановить по дате вручения копии плюс десять суток.',
        'Спросить, были ли обжалования, отсрочки или рассрочки. Каждое из них останавливало часы.',
        'Сопоставить всё это с сегодняшним днём и объяснить человеку выводы, не обещая результата.'
      ],
      kk:[
        'Атқарушылық іс жүргізудің жоқтығын тізілімнен тексеру. Бар болса — мерзім тақырыбы жабылады, орындаушыға барамыз.',
        'Қаулының заңды күшіне енген күнін табу. Карточкада ол болмаса — көшірме тапсырылған күн плюс он тәулік бойынша қалпына келтіру.',
        'Шағымдану, кейінге қалдыру немесе бөліп төлеу болған-болмағанын сұрау. Олардың әрқайсысы сағатты тоқтатқан.',
        'Осының бәрін бүгінгі күнмен салыстырып, нәтижені уәде етпей, адамға қорытындыны түсіндіру.'
      ] }

  quiz:[
    { q:{ ru:'С какого дня отсчитывается годичный срок по статье 890 КоАП РК?', kk:'ҚР ӘҚБтК-нің 890-бабы бойынша бір жылдық мерзім қай күннен есептеледі?' },
      opts:{ ru:['Со дня нарушения','Со дня вынесения постановления','Со дня вступления постановления в законную силу','Со дня, когда штраф появился в приложении банка'], kk:['Бұзушылық күнінен','Қаулы шығарылған күннен','Қаулының заңды күшіне енген күнінен','Айыппұл банк қосымшасында пайда болған күннен'] },
      correct:2,
      why:{ ru:'Именно со дня вступления в законную силу. Между нарушением и этой датой проходит время на вынесение постановления, вручение копии и десять суток на обжалование — отсюда и народная прикидка «год и двадцать пять суток».', kk:'Дәл заңды күшіне енген күннен. Бұзушылық пен осы күн арасында қаулы шығаруға, көшірмені тапсыруға және шағымдануға берілген он тәулікке уақыт кетеді — «бір жыл жиырма бес тәулік» деген халықтық болжам осыдан.' } },
    { q:{ ru:'Что означает выражение «год и двадцать пять суток»?', kk:'«Бір жыл және жиырма бес тәулік» деген тіркес нені білдіреді?' },
      opts:{ ru:['Норму закона','Житейскую прикидку: год давности плюс время от нарушения до вступления постановления в силу','Срок обжалования','Срок исполнительного производства'], kk:['Заң нормасын','Тұрмыстық болжамды: бір жыл мерзім және бұзушылықтан қаулының күшіне енуіне дейінгі уақыт','Шағымдану мерзімін','Атқарушылық іс жүргізу мерзімін'] },
      correct:1,
      why:{ ru:'В законе такой формулы нет. Это бытовое объяснение того, почему от даты нарушения проходит больше года. Для разговора она годится, для расчёта — нет: у каждого штрафа промежуток свой.', kk:'Заңда мұндай формула жоқ. Бұл — бұзушылық күнінен неге бір жылдан көп өтетінін тұрмыстық түсіндіру. Әңгімеге жарайды, есептеуге — жоқ: әр айыппұлда аралық өзінше.' } },
    { q:{ ru:'Клиент подал жалобу, её рассматривали три месяца и отказали. Что произошло со сроком давности?', kk:'Клиент шағым берді, оны үш ай қарап, бас тартты. Мерзімнің өтуіне не болды?' },
      opts:{ ru:['Срок продолжал идти как обычно','На время обжалования течение срока было приостановлено','Срок сократился на три месяца','Срок начался заново'], kk:['Мерзім әдеттегідей жүре берді','Шағымдану кезінде мерзімнің өтуі тоқтатылды','Мерзім үш айға қысқарды','Мерзім қайтадан басталды'] },
      correct:1,
      why:{ ru:'Обжалование, отсрочка и рассрочка останавливают часы. Клиент, подавший жалобу «для затяжки», фактически отодвинул для себя окончание срока на время рассмотрения.', kk:'Шағымдану, кейінге қалдыру және бөліп төлеу сағатты тоқтатады. «Созу үшін» шағым берген клиент іс жүзінде мерзімнің аяқталуын қарау уақытына жылжытты.' } },
    { q:{ ru:'По штрафу возбуждено исполнительное производство, прошло два года. Работает ли правило статьи 890?', kk:'Айыппұл бойынша атқарушылық іс жүргізу қозғалған, екі жыл өтті. 890-баптың ережесі жұмыс істей ме?' },
      opts:{ ru:['Да, два года больше года','Нет: дело живёт по законодательству об исполнительном производстве, механизм давности здесь не применяется','Да, если исполнитель частный','Только если сумма небольшая'], kk:['Иә, екі жыл бір жылдан көп','Жоқ: іс атқарушылық іс жүргізу туралы заңнама бойынша өмір сүреді, мерзімнің өтуі тетігі мұнда қолданылмайды','Иә, орындаушы жеке болса','Тек сома аз болса'] },
      correct:1,
      why:{ ru:'Это главное исключение всего модуля. Как только дело обращено к принудительному исполнению, расчёты по статье 890 к нему не применяются. Поэтому проверка реестра всегда идёт первой, до любых разговоров о сроках.', kk:'Бұл — бүкіл модульдің басты ерекшелігі. Іс мәжбүрлеп орындауға жіберілген бойда 890-бап бойынша есептеулер оған қолданылмайды. Сондықтан тізілімді тексеру мерзімдер туралы кез келген әңгімеден бұрын, әрқашан бірінші жүреді.' } },
    { q:{ ru:'Что помощник имеет право предложить клиенту по этой теме?', kk:'Осы тақырып бойынша көмекші клиентке нені ұсынуға құқылы?' },
      opts:{ ru:['Удалить штраф из базы за вознаграждение','Проверить по ИИН в реестре, посмотреть даты и объяснить, попадает ли штраф под правило и что из этого следует','Договориться, чтобы штраф убрали','Гарантировать, что платить не придётся'], kk:['Сыйақыға айыппұлды базадан өшіру','ЖСН бойынша тізілімнен тексеру, күндерді қарау және айыппұл ережеге ілігетінін әрі бұдан не шығатынын түсіндіру','Айыппұлды алып тастауға келісу','Төлемейтініне кепілдік беру'] },
      correct:1,
      why:{ ru:'Законная работа — это проверка фактов и объяснение порядка. Обещание результата, который вы не контролируете, — обман, даже если вы искренне верите, что всё получится.', kk:'Заңды жұмыс — фактілерді тексеру және тәртіпті түсіндіру. Өзіңіз бақыламайтын нәтижені уәде ету — бәрі болады деп шын сенсеңіз де, алдау болып саналады.' } }

  practice:[
    { t:'p',
      ru:'Самое важное практическое задание модуля. Вы тренируете не расчёт, а честную формулировку — ту, которую будете произносить десятки раз.',
      kk:'Модульдің ең маңызды практикалық тапсырмасы. Сіз есептеуді емес, ондаған рет айтатын шыншыл тұжырымды жаттықтырасыз.' },
    { t:'steps',
      ru:[

    { t:'warn',
      ru:'Правая колонка — не рекомендации, а условия, при которых вы остаётесь в законе. Нарушить любую строку из неё легко и почти всегда из добрых побуждений: хочется помочь сильнее, чем можно. Перечитывайте эту таблицу раз в месяц.',
      kk:'Оң жақ баған — ұсыныс емес, заң аясында қалуыңыздың шарттары. Ондағы кез келген жолды бұзу оңай, әрі әрдайым дерлік жақсы ниеттен: мүмкін болғаннан артық көмектескің келеді. Бұл кестені айына бір рет қайта оқып отырыңыз.' },

    { t:'h', ru:'Как брать деньги за такую работу', kk:'Мұндай жұмысқа ақыны қалай алу керек' },
    { t:'p',
      ru:'В отличие от страхования, здесь вам не платит компания — платит сам человек. Значит, нужно уметь назвать цену вслух, а это для многих сложнее, чем выучить статью 890.',
      kk:'Сақтандырудан айырмашылығы, мұнда сізге компания емес, адамның өзі төлейді. Демек, бағаны дауыстап айта білу керек, ал көпшілік үшін бұл 890-бапты жаттағаннан қиынырақ.' },
    { t:'p',
      ru:'Берите деньги за работу, а не за результат. Проверка по базам, разбор дат, подготовка жалобы, сопровождение по срокам — это ваша работа, и она имеет ценность независимо от того, отменят штраф или нет. Формулируйте так: «я беру за разбор и подготовку документов, результат зависит не от меня».',
      kk:'Ақыны нәтиже үшін емес, жұмыс үшін алыңыз. Базалардан тексеру, күндерді талдау, шағым дайындау, мерзімдер бойынша сүйемелдеу — бұл сіздің жұмысыңыз, айыппұл жойылса да, жойылмаса да оның құндылығы бар. Былай тұжырымдаңыз: «мен талдау мен құжат дайындау үшін аламын, нәтиже маған байланысты емес».' },
    { t:'list',
      ru:[
        'Проверку по базам многие делают бесплатно — это ваш способ познакомиться и показать себя.',
        'За подготовку жалобы берите фиксированную сумму и говорите её до начала работы, а не после.',
        'Никогда не берите процент от «сэкономленного» — это прямая дорога к обещанию результата.',
        'Не берите деньги за заведомо безнадёжную жалобу. Скажите честно, что шансов нет, и вам поверят в следующий раз.',
        'Деньги принимайте так, чтобы оставался след: перевод с назначением, а не наличные без единого слова.'
      ],
      kk:[
        'Базалардан тексеруді көбі тегін жасайды — бұл сіздің танысу және өзіңізді көрсету тәсіліңіз.',
        'Шағым дайындағаны үшін тіркелген соманы алыңыз және оны жұмыстан кейін емес, бастар алдында айтыңыз.',
        '«Үнемделгеннен» пайыз ешқашан алмаңыз — бұл нәтижені уәде етуге тура апаратын жол.',
        'Әдейі үмітсіз шағым үшін ақша алмаңыз. Мүмкіндік жоқ екенін шыншыл айтыңыз, сонда келесі жолы сізге сенеді.',
        'Ақшаны із қалатындай қабылдаңыз: тағайындауы жазылған аударыммен, бір ауыз сөзсіз қолма-қол емес.'
      ] },
    { t:'example',
      ru:'К вам приходит человек с обидным, но законным штрафом и просит «сделать что-нибудь». Соблазн взять деньги за жалобу велик: работа есть, оплата есть. Но если доказательств нет, вы возьмёте плату за проигрыш. Правильный ход — сказать прямо: «жалоба здесь не сработает, доказательств нет; давайте я лучше проверю, попадаете ли вы под скидку». Вы заработаете меньше сегодня и получите клиента на годы.',
      kk:'Сізге ренішті, бірақ заңды айыппұлы бар адам келіп, «бірдеңе жасауды» сұрайды. Шағым үшін ақша алу азғырығы үлкен: жұмыс та бар, төлем де бар. Бірақ дәлел жоқ болса, жеңіліс үшін ақы аласыз. Дұрыс қадам — тікелей айту: «мұнда шағым жұмыс істемейді, дәлел жоқ; жақсысы жеңілдікке ілігетініңізді тексерейін». Бүгін аз табасыз, ал клиентті жылдарға аласыз.' },

    { t:'p',
      ru:'Клиент по штрафам почти всегда приходит раздражённым: он считает наказание несправедливым, а систему враждебной. Не спорьте с эмоцией и не поддерживайте её. Сделайте три вещи.',
      kk:'Айыппұл бойынша клиент әрдайым дерлік ашулы келеді: жазаны әділетсіз, жүйені жау деп санайды. Эмоциямен таласпаңыз және оны қолдамаңыз. Үш нәрсе жасаңыз.' },
    { t:'olist',

        'Әңгімені фактілерге бұрыңыз: «келіңіз, күндерді қарайық, бәрі соған байланысты».',
        'Айқын келесі қадам беріңіз: «ЖСН жіберіңіз, кешке қарай сізде не бар екенін айтамын».'

    { t:'p',
      ru:'И отдельно про то, чего делать нельзя: не ругайте вместе с клиентом полицию, камеры и государство. Это кажется способом сблизиться, но на деле подталкивает человека к решению «принципиально не платить», а расплачиваться за это будет он. Ваша роль — холодная голова рядом с горячей.',
      kk:'Бөлек, істеуге болмайтын нәрсе туралы: клиентпен бірге полицияны, камераларды және мемлекетті жамандамаңыз. Бұл жақындасу тәсілі болып көрінеді, ал шын мәнінде адамды «принцип бойынша төлемеу» шешіміне итермелейді, ал есесін өзі төлейді. Сіздің рөліңіз — ыстық бастың қасындағы салқын бас.' },
    { t:'h', ru:'Что делать, если вы ошиблись', kk:'Қателессеңіз не істеу керек' },
    { t:'p',
      ru:'Вы ошибётесь — не в первый месяц, так во второй. Неправильно посчитаете дату, не заметите производство в реестре, поздно ответите и человек потеряет скидку. Правило одно: сказать сразу, самой, до того как это обнаружит клиент. Признанная ошибка стоит извинения и, если она стоила клиенту денег, — вашего отказа от оплаты за эту работу. Скрытая ошибка стоит репутации целиком.',
      kk:'Сіз қателесесіз — бірінші айда болмаса, екіншісінде. Күнді қате санайсыз, тізілімдегі іс жүргізуді байқамай қаласыз, кеш жауап бересіз де, адам жеңілдіктен айырылады. Ереже біреу: клиент байқағанға дейін, өзіңіз бірден айту. Мойындалған қате кешірім сұрауға және, егер ол клиентке ақшаға түссе, осы жұмыс үшін ақыдан бас тартуға тұрады. Жасырылған қате бүкіл беделге тұрады.' },
    { t:'p',
      ru:'На этом модуль про штрафы закончен. Вы умеете проверять, различать три механизма, считать сроки и говорить «нет» там, где другие обещают чудо. Это уже профессия, а не подработка.',
      kk:'Осымен айыппұлдар туралы модуль аяқталды. Сіз тексеруді, үш тетікті ажыратуды, мерзімдерді санауды және басқалар ғажайып уәде ететін жерде «жоқ» деп айтуды білесіз. Бұл — қосымша табыс емес, кәсіп.' }

    { q:{ ru:'Клиент просит взять оплату в виде процента от суммы, которую удастся не платить. Как правильно?', kk:'Клиент төлемей қалатын сомадан пайыз түрінде ақы алуды ұсынады. Қалай дұрыс?' },

    { q:{ ru:'Клиент на эмоциях ругает камеры и полицию. Как лучше ответить?', kk:'Клиент эмоциямен камералар мен полицияны жамандайды. Қалай жауап берген жөн?' },

var S = { lang:'ru', screen:'home', mid:null, lid:null, tab:'lesson', quiz:null, confirmReset:false };
var P = { lang:null, lessons:{}, last:null };
var saveTimer = null;

function L(){ return S.lang; }
function t(key, vars){
  var s = (UI[key] && UI[key][S.lang]) || (UI[key] && UI[key].ru) || key;
  if (vars) for (var k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function tx(obj){
  if (obj == null) return '';
  if (typeof obj === 'string') return obj;
  return obj[S.lang] != null ? obj[S.lang] : (obj.ru != null ? obj.ru : '');
}
function save(){
  P.lang = S.lang;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ Store.write(P); }, 120);
}
function lkey(mid, lid){ return mid + ':' + lid; }
function rec(mid, lid){
  var k = lkey(mid, lid);
  if (!P.lessons[k]) P.lessons[k] = { read:false, best:null, done:false };
  return P.lessons[k];
}
function peek(mid, lid){ return P.lessons[lkey(mid, lid)] || { read:false, best:null, done:false }; }

/* ==================================================================
   5. УТИЛИТЫ
   ================================================================== */
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function md(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<span class="num">$1</span>');
}
function el(id){ return document.getElementById(id); }

function activeModules(){ return MODULES.filter(function(m){ return m.lessons.length > 0; }); }
function findModule(mid){ for (var i=0;i<MODULES.length;i++) if (MODULES[i].id === mid) return MODULES[i]; return null; }
function findLesson(m, lid){ for (var i=0;i<m.lessons.length;i++) if (m.lessons[i].id === lid) return m.lessons[i]; return null; }

function modStats(m){
  var done=0, read=0, sum=0, cnt=0;
  m.lessons.forEach(function(l){
    var r = peek(m.id, l.id);
    if (r.done) done++;
    if (r.read) read++;
    if (r.best != null){ sum += r.best; cnt++; }
  });
  return {
    total:m.lessons.length, done:done, read:read, tests:cnt,
    pct: m.lessons.length ? Math.round(done / m.lessons.length * 100) : 0,
    avg: cnt ? (sum/cnt) : null
  };
}
function courseStats(){
  var mods = activeModules();
  var total=0, done=0, tests=0, sum=0, cnt=0;
  mods.forEach(function(m){
    var s = modStats(m);
    total += s.total; done += s.done; tests += s.tests;
    m.lessons.forEach(function(l){
      var r = peek(m.id, l.id);
      if (r.best != null){ sum += r.best; cnt++; }
    });
  });
  return { total:total, done:done, tests:tests, pct: total ? Math.round(done/total*100) : 0, avg: cnt ? (sum/cnt) : null };
}
function nextTarget(){
  if (P.last){
    var m = findModule(P.last.m);
    if (m && m.lessons.length){
      var l = findLesson(m, P.last.l);
      if (l) return { mid:m.id, lid:l.id };
    }
  }
  var mods = activeModules();
  for (var i=0;i<mods.length;i++){
    for (var j=0;j<mods[i].lessons.length;j++){
      if (!peek(mods[i].id, mods[i].lessons[j].id).done) return { mid:mods[i].id, lid:mods[i].lessons[j].id };
    }
  }
  if (mods.length) return { mid:mods[0].id, lid:mods[0].lessons[0].id };
  return null;
}

function renderBlocks(blocks){
  return blocks.map(function(b){
    switch(b.t){
      case 'h':
        return '<h3>' + esc(tx(b)) + '</h3>';
      case 'p':
        return '<p>' + md(tx(b)) + '</p>';
      case 'list':
        return '<ul>' + (tx(b)||[]).map(function(i){ return '<li>' + md(i) + '</li>'; }).join('') + '</ul>';
      case 'olist':
        return '<ol>' + (tx(b)||[]).map(function(i){ return '<li>' + md(i) + '</li>'; }).join('') + '</ol>';
      case 'steps':
        return '<div class="steps">' + (tx(b)||[]).map(function(i, ix){
          return '<div class="step"><div class="step-n">'+(ix+1)+'</div><div class="step-b">'+md(i)+'</div></div>';
        }).join('') + '</div>';
      case 'term':
        return '<div class="term"><b><span class="ab">' + esc(b.abbr) + '</span> — ' + md(tx(b)) + '</b></div>';
      case 'example':
        return '<div class="callout c-example"><div class="lbl">' + esc(t('exampleLabel')) + '</div><p>' + md(tx(b)) + '</p></div>';
      case 'note':
        return '<div class="callout c-note"><div class="lbl">' + esc(t('noteLabel')) + '</div><p>' + md(tx(b)) + '</p></div>';
      case 'warn':
        return '<div class="callout c-warn"><div class="lbl">' + esc(t('warnLabel')) + '</div><p>' + md(tx(b)) + '</p></div>';
      case 'check':
        return '<div class="callout c-check"><div class="lbl">' + esc(t('checkLabel')) + '</div><p>' + md(tx(b)) + '</p></div>';
      case 'formula':
        return '<div class="formula">' + esc(tx(b)) + '</div>';
      case 'table':
        var head = (b.head && tx(b.head)) || [];
        var rows = (b.rows && tx(b.rows)) || [];
        return '<div class="tablewrap"><table><thead><tr>' +
          head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          rows.map(function(r){
            return '<tr>' + r.map(function(c, ci){
              return '<td' + (ci>0 && /^[\d\s.,×+\-–—%]+$/.test(c) ? ' class="n"' : '') + '>' + md(c) + '</td>';
            }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>';
      default:
        return '';
    }
  }).join('');
}

            '<span class="chip chip-acc">' + s.pct + '%</span>' +
            (s.avg != null ? '<span class="chip chip-gold">' + esc(t('bestScore')) + ' ~ ' + s.avg.toFixed(1) + '</span>' : '') +
          '</div>' +
        '</button>'
      );
    } else {
      h.push(
        '<div class="mod" data-locked="1">' +
          '<div class="mod-head">' +
            '<div class="mod-num">' + m.num + '</div>' +
            '<div><div class="mod-t">' + esc(tx(m.title)) + '</div>' +
            '<div class="mod-s">' + esc(tx(m.subtitle)) + '</div></div>' +
          '</div>' +
          '<div class="chips"><span class="chip">' + esc(t('soon')) + '</span></div>' +
        '</div>'
      );
    }
  });
  if (activeModules().length < MODULES.length){
    h.push('<p class="muted">' + esc(t('soonNote')) + '</p>');
  }
  h.push('</section>');

  h.push(
    '<section class="stack">' +
      '<div class="eyebrow">' + esc(t('settings')) + '</div>' +
      '<div class="card stack">' +
        '<p class="muted">' + esc(t('storageNote')) + '</p>' +
        (S.confirmReset
          ? '<p>' + esc(t('resetAsk')) + '</p>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
              '<button class="btn btn-danger btn-sm" data-act="reset-yes">' + esc(t('resetYes')) + '</button>' +
              '<button class="btn btn-ghost btn-sm" data-act="reset-no">' + esc(t('resetNo')) + '</button>' +
            '</div>'
          : '<button class="btn btn-quiet" data-act="reset-ask">' + esc(t('resetBtn')) + '</button>') +
      '</div>' +
    '</section>'
  );

  h.push('</div>');
  return { html:h.join(''), title:t('appTitleShort'), back:false, action:'' };
}

function viewModule(){
  var m = findModule(S.mid);
  if (!m) return viewHome();
  var s = modStats(m);
  var h = [];
  h.push('<div class="stack-l fade">');
  h.push(
    '<section class="stack">' +
      '<div class="eyebrow">' + esc(t('moduleWord')) + ' ' + m.num + '</div>' +
      '<h1>' + esc(tx(m.title)) + '</h1>' +
      '<p class="lede">' + esc(tx(m.subtitle)) + '</p>' +
      '<div class="card stack-s">' +
        '<div class="rowbetween"><span class="muted">' + s.done + ' / ' + s.total + ' ' + esc(t('lessonsWord')) + '</span><b class="num">' + s.pct + '%</b></div>' +
        '<div class="bar"><i style="width:' + s.pct + '%"></i></div>' +
        (s.pct === 100 ? '<p class="chip chip-ok" style="align-self:flex-start">' + esc(t('moduleDone')) + '</p>' : '') +
      '</div>' +
    '</section>'
  );
  h.push('<section class="stack">');
  m.lessons.forEach(function(l, i){
    var r = peek(m.id, l.id);
    h.push(
      '<button class="lrow" data-act="go" data-m="' + m.id + '" data-l="' + l.id + '" data-done="' + (r.done?1:0) + '" data-read="' + (r.read?1:0) + '">' +
        '<div class="lrow-n">' + (r.done ? '✓' : (i+1)) + '</div>' +
        '<div class="lrow-t">' + esc(tx(l.title)) +
          '<span class="lrow-m">' + l.minutes + ' ' + esc(t('minRead')) +
            (r.best != null ? ' · ' + esc(t('bestScore')) + ' ' + r.best + '/5' : '') +
          '</span>' +
        '</div>' +
        '<div class="lrow-a">›</div>' +
      '</button>'
    );
  });
  h.push('</section>');
  h.push('</div>');
  return { html:h.join(''), title:tx(m.title), back:true, action:'' };
}

function viewLesson(){
  var m = findModule(S.mid);
  var l = m && findLesson(m, S.lid);
  if (!l) return viewHome();
  var r = rec(m.id, l.id);
  var idx = m.lessons.indexOf(l);
  var h = [];

  h.push('<div class="stack-l fade pad-bottom">');
  h.push(
    '<section class="stack-s">' +
      '<div class="eyebrow">' + esc(t('moduleWord')) + ' ' + m.num + ' · ' + esc(t('lessonWord')) + ' ' + (idx+1) + ' ' + esc(S.lang==='ru'?'из':'/') + ' ' + m.lessons.length + '</div>' +
      '<h1>' + esc(tx(l.title)) + '</h1>' +
      '<div class="chips">' +
        '<span class="chip">' + l.minutes + ' ' + esc(t('minRead')) + '</span>' +
        (r.read ? '<span class="chip chip-acc">' + esc(t('readDone')) + '</span>' : '') +
        (r.best != null ? '<span class="chip ' + (r.done?'chip-ok':'chip-gold') + '">' + esc(t('bestScore')) + ' ' + r.best + '/5</span>' : '') +
      '</div>' +
    '</section>'
  );

  h.push(
    '<div class="tabs" role="tablist">' +
      ['lesson','scripts','mistakes','practice'].map(function(k){
        var lab = { lesson:'tabLesson', scripts:'tabScripts', mistakes:'tabMistakes', practice:'tabPractice' }[k];
        return '<button role="tab" aria-selected="' + (S.tab===k) + '" data-act="tab" data-tab="' + k + '">' + esc(t(lab)) + '</button>';
      }).join('') +
    '</div>'
  );

  if (S.tab === 'lesson'){
    h.push('<article class="prose">' + renderBlocks(l.blocks) + '</article>');
  } else if (S.tab === 'scripts'){
    h.push('<section class="stack">' +
      '<h2>' + esc(t('scriptsTitle')) + '</h2>' +
      '<p class="muted">' + esc(t('scriptsLede')) + '</p>' +
      l.scripts.map(function(s, i){
        return '<details class="qa"' + (i===0?' open':'') + '>' +
          '<summary class="qa-q"><span>' + esc(tx(s.q)) + '</span><span class="tw">⌄</span></summary>' +
          '<div class="qa-a">' + (s.note ? '<p>' + md(tx(s.note)) + '</p>' : '') +
            '<div class="say"><div class="eyebrow" style="margin-bottom:6px">' + esc(t('sayThis')) + '</div>' + md(tx(s.a)) + '</div>' +
          '</div>' +
        '</details>';
      }).join('') +
    '</section>');
  } else if (S.tab === 'mistakes'){
    h.push('<section class="stack">' +
      '<h2>' + esc(t('mistakesTitle')) + '</h2>' +
      '<p class="muted">' + esc(t('mistakesLede')) + '</p>' +
      l.mistakes.map(function(x){
        return '<div class="mistake"><div class="x">✕</div><div class="b"><b>' + esc(tx(x.w)) + '</b><span>' + md(tx(x.f)) + '</span></div></div>';
      }).join('') +
    '</section>');
  } else {
    h.push('<section class="stack">' +
      '<h2>' + esc(t('practiceTitle')) + '</h2>' +
      '<p class="muted">' + esc(t('practiceLede')) + '</p>' +
      '<div class="card"><div class="prose">' + renderBlocks(l.practice) + '</div></div>' +
    '</section>');
  }

  h.push('</div>');

  var action =
    '<div class="actionbar-in">' +
      (r.read
        ? ''
        : '<button class="btn btn-ghost" data-act="mark-read">' + esc(t('markRead')) + '</button>') +
      '<button class="btn btn-primary" data-act="quiz">' + esc(r.best!=null ? t('retakeQuiz') : t('toQuiz')) + '</button>' +
    '</div>';

  return { html:h.join(''), title:tx(l.title), back:true, action:action };
}

function viewQuiz(){
  var m = findModule(S.mid);
  var l = m && findLesson(m, S.lid);
  if (!l || !S.quiz) return viewLesson();
  var q = S.quiz;
  var h = [];

  if (q.finished){
    var score = q.answers.filter(function(a){ return a.ok; }).length;
    var pass = score >= 4;
    var idx = m.lessons.indexOf(l);
    var nextL = m.lessons[idx+1];
    h.push('<div class="stack-l fade pad-bottom">');
    h.push(
      '<section class="card stack">' +
        '<div class="score">' +
          '<div class="eyebrow">' + esc(t('yourResult')) + '</div>' +
          '<div class="big" style="color:' + (pass ? 'var(--ok)' : 'var(--gold)') + '">' + score + '/5</div>' +
          '<p class="' + (pass ? '' : 'muted') + '">' + esc(pass ? t('passed') : t('notPassed')) + '</p>' +
        '</div>' +
        '<div class="qprog">' + q.answers.map(function(a){ return '<i class="' + (a.ok?'good':'bad') + '"></i>'; }).join('') + '</div>' +
      '</section>'
    );
    h.push('<section class="stack">');
    l.quiz.forEach(function(item, i){
      var a = q.answers[i];
      h.push(
        '<div class="card stack-s">' +
          '<div class="eyebrow">' + (i+1) + ' · ' + esc(a.ok ? t('right') : t('wrong')) + '</div>' +
          '<p style="font-weight:650">' + md(tx(item.q)) + '</p>' +
          '<p class="muted">' + esc(S.lang==='ru'?'Правильный ответ: ':'Дұрыс жауап: ') + esc(tx(item.opts)[item.correct]) + '</p>' +
          '<p style="font-size:var(--fs-sm);color:var(--ink2)">' + md(tx(item.why)) + '</p>' +
        '</div>'
      );
    });
    h.push('</section>');
    h.push('</div>');
    var act = '<div class="actionbar-in">' +
      '<button class="btn btn-ghost" data-act="quiz">' + esc(t('tryAgain')) + '</button>' +
      (nextL && pass
        ? '<button class="btn btn-primary" data-act="go" data-m="' + m.id + '" data-l="' + nextL.id + '">' + esc(t('nextLesson')) + '</button>'
        : '<button class="btn btn-primary" data-act="module" data-m="' + m.id + '">' + esc(t('backToModule')) + '</button>') +
      '</div>';
    return { html:h.join(''), title:t('quizTitle'), back:true, action:act };
  }

  var item = l.quiz[q.i];
  var answered = q.picked != null;
  h.push('<div class="stack-l fade pad-bottom">');
  h.push(
    '<section class="stack-s">' +
      '<div class="qprog">' + l.quiz.map(function(_, i){
        var a = q.answers[i];
        return '<i class="' + (a ? (a.ok?'good':'bad') : (i===q.i?'on':'')) + '"></i>';
      }).join('') + '</div>' +
      '<div class="eyebrow">' + esc(t('qOf', {a:q.i+1, b:l.quiz.length})) + '</div>' +
      '<h2>' + md(tx(item.q)) + '</h2>' +
    '</section>'
  );
  h.push('<section class="stack">' +
    tx(item.opts).map(function(o, i){
      var state = '';
      if (answered){
        if (i === item.correct) state = 'correct';
        else if (i === q.picked) state = 'wrong';
      }
      return '<button class="opt" data-act="pick" data-i="' + i + '" data-state="' + state + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="mk">' + (state==='correct'?'✓':(state==='wrong'?'✕':String.fromCharCode(65+i))) + '</span>' +
        '<span>' + md(tx(o)) + '</span>' +
      '</button>';
    }).join('') +
  '</section>');

  if (answered){
    var ok = q.picked === item.correct;
    h.push(
      '<div class="callout ' + (ok ? 'c-note' : 'c-warn') + '">' +
        '<div class="lbl">' + esc(ok ? t('right') : t('wrong')) + ' · ' + esc(t('why')) + '</div>' +
        '<p>' + md(tx(item.why)) + '</p>' +
      '</div>'
    );
  }
  h.push('</div>');

  var act = answered
    ? '<div class="actionbar-in"><button class="btn btn-primary" data-act="qnext">' +
        esc(q.i === l.quiz.length-1 ? t('seeResult') : t('nextQ')) + '</button></div>'
    : '';
  return { html:h.join(''), title:t('quizTitle'), back:true, action:act };
}

/* ==================================================================
   8. РОУТЕР
   ================================================================== */
function buildView(){
  if (S.screen === 'module') return viewModule();
  if (S.screen === 'lesson') return viewLesson();
  if (S.screen === 'quiz')   return viewQuiz();
  return viewHome();
}

function render(){
  var v;
  try {
    v = buildView();
  } catch (err) {
    // Страховка: если экран не собрался, не оставляем приложение мёртвым,
    // а возвращаем пользователя на главную. Прогресс при этом не теряется.
    S.screen = 'home'; S.mid = null; S.lid = null; S.quiz = null;
    try { v = viewHome(); }
    catch (err2) { v = { html:'<p class="muted">' + esc(t('oops')) + '</p>', title:t('appTitleShort'), back:false, action:'' }; }
  }

  el('view').innerHTML = v.html;
  el('topTitle').textContent = v.title;
  el('backBtn').style.display = v.back ? 'inline-flex' : 'none';
  el('actionbar').innerHTML = v.action || '';
  document.querySelectorAll('.langsw button').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang));
  });
  window.scrollTo({ top:0, behavior:'auto' });
}

function goHome(){ S.screen='home'; S.mid=null; S.lid=null; S.quiz=null; render(); }
function goModule(mid){ S.screen='module'; S.mid=mid; S.lid=null; S.quiz=null; S.confirmReset=false; render(); }
function goLesson(mid, lid){
  S.screen='lesson'; S.mid=mid; S.lid=lid; S.tab='lesson'; S.quiz=null; S.confirmReset=false;
  P.last = { m:mid, l:lid }; save(); render();
}
function goBack(){
  if (S.screen === 'quiz') { S.screen='lesson'; S.quiz=null; render(); }
  else if (S.screen === 'lesson') goModule(S.mid);
  else goHome();
}

/* ==================================================================
   9. СОБЫТИЯ
   ================================================================== */
document.getElementById('app').addEventListener('click', function(e){
  var lang = e.target.closest('.langsw button');
  if (lang){ S.lang = lang.dataset.lang; save(); render(); return; }

  if (e.target.closest('#backBtn')){ goBack(); return; }

  var btn = e.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.dataset.act;

  if (act === 'module'){ goModule(btn.dataset.m); }
  else if (act === 'go'){ goLesson(btn.dataset.m, btn.dataset.l); }
  else if (act === 'tab'){ S.tab = btn.dataset.tab; render(); }
  else if (act === 'mark-read'){
    var r = rec(S.mid, S.lid); r.read = true; save(); render();
  }
  else if (act === 'quiz'){
    var rr = rec(S.mid, S.lid); rr.read = true; save();
    S.quiz = { i:0, picked:null, answers:[], finished:false };
    S.screen = 'quiz'; render();
  }
  else if (act === 'pick'){
    if (S.quiz.picked != null) return;
    S.quiz.picked = parseInt(btn.dataset.i, 10);
    render();
  }
  else if (act === 'qnext'){
    var m = findModule(S.mid), l = findLesson(m, S.lid), item = l.quiz[S.quiz.i];
    S.quiz.answers[S.quiz.i] = { picked:S.quiz.picked, ok:S.quiz.picked === item.correct };
    if (S.quiz.i === l.quiz.length - 1){
      S.quiz.finished = true;
      var score = S.quiz.answers.filter(function(a){ return a.ok; }).length;
      var r2 = rec(S.mid, S.lid);
      if (r2.best == null || score > r2.best) r2.best = score;
      if (score >= 4) r2.done = true;
      save();
    } else {
      S.quiz.i++; S.quiz.picked = null;
    }
    render();
  }
  else if (act === 'reset-ask'){ S.confirmReset = true; render(); }
  else if (act === 'reset-no'){ S.confirmReset = false; render(); }
  else if (act === 'reset-yes'){
    P = { lang:S.lang, lessons:{}, last:null };
    S.confirmReset = false;
    Store.clear().then(function(){ save(); goHome(); });
  }
});

/* ==================================================================
   10. СТАРТ
   ================================================================== */
el('view').innerHTML = '<p class="muted">' + UI.loading.ru + '</p>';
Store.read().then(function(saved){
  if (saved && typeof saved === 'object'){
    P.lessons = saved.lessons || {};
    P.last = saved.last || null;
    if (saved.lang === 'ru' || saved.lang === 'kk') S.lang = saved.lang;
  }
  P.lang = S.lang;
  render();
});

})();
</script>
</body>
</html>
